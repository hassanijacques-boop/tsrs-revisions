<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS — Programme EXPERNET</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--card:#11151c;--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--pink:#ec4899;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
#app{max-width:860px;margin:0 auto;padding:.8rem .8rem 80px}
h1{font-size:1.25rem;font-weight:800}
h2{font-size:.95rem;font-weight:700;margin:1rem 0 .3rem;color:var(--accent)}
h3{font-size:.82rem;font-weight:600;margin:.5rem 0 .2rem;color:#f1f5f9}
p,li{font-size:.76rem;color:var(--text2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem;margin-bottom:.4rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,12,16,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding:.2rem 0 env(safe-area-inset-bottom,.2rem)}
.tab-btn{flex-shrink:0;padding:.3rem .5rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:6px;white-space:nowrap}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.1)}
.tag{display:inline-block;padding:.1rem .35rem;border-radius:4px;font-size:.55rem;font-weight:600}
.tag-b{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-g{background:rgba(16,185,129,.12);color:var(--green)}
.tag-o{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-r{background:rgba(239,68,68,.12);color:var(--red)}
.tag-p{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-pk{background:rgba(236,72,153,.12);color:var(--pink)}
.box{padding:.35rem .5rem;border-radius:6px;margin:.25rem 0;font-size:.74rem}
.box-info{background:rgba(6,182,212,.05);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.05);border-left:3px solid var(--green)}
.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:.25rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green))}
.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.3rem;padding:.15rem 0;font-size:.72rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:2px;accent-color:var(--accent);width:12px;height:12px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(75px,1fr));gap:.25rem;margin:.3rem 0}
.stat-card{text-align:center;padding:.3rem;background:var(--card);border-radius:8px;border:1px solid var(--border)}
.stat-card .val{font-size:1rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.5rem;color:var(--text2)}
.cmd{font-family:monospace;font-size:.7rem;background:#000;padding:.4rem;border-radius:6px;color:var(--green);line-height:1.5;overflow-x:auto}
.cmd .cm{color:#6b7280}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .2s ease}
</style>
</head>

<div id="app"><div style="text-align:center;padding:3rem;color:var(--text2)"><div style="font-size:2rem">&#x1f4da;</div><div>Chargement...</div></div></div>

</nav>

C.home=["Je connais les 7 couches du modele OSI","Je sais la difference TCP/UDP","Je sais convertir en binaire","J ai utilise VMware pour creer une VM","J ai installe Ubuntu sur une VM"];
C.m1=["Representer le modele OSI avec les 7 couches","Expliquer encapsulation et desencapsulation","Illustrer la communication entre 2 PC","Connaitre le fonctionnement de chaque couche","Mettre en place des materiaux reseaux","Interconnecter des equipements reseaux"];
C.m2=["Connaitre le principe de numeration (binaire)","Effectuer des conversions decimal-binaire-hexa","Comprendre les unites (bit, octet, Ko, Mo, Go)","Connaitre l adressage IPv4","Identifier les classes IPv4 (A, B, C)","Calculer adresse reseau et broadcast","Utiliser la notation CIDR","Calculer les sous-reseaux et sur-reseaux"];
C.m3=["Initiation VMware Workstation","Presentation ecosysteme Microsoft","Ligne de commande (cmd)","Gestion du stockage","Gestion des utilisateurs","Permissions NTFS","Gestion des imprimantes","Pare-feu Windows","Gestion des partages","Initiation PowerShell","Maintenance, sauvegarde, restauration"];
C.m4=["Caracteristiques GNU/Linux","Syntaxe des commandes","Connexion et aide (man)","Arborescence Linux","Gestion des fichiers (ls, cd, cp, mv, rm)","Expressions regulieres (grep)","Editeur Vim","Processus, redirections et pipelines","Permissions (chmod, chown)","Archivage et compression (tar, gzip)","Shell : variables, alias, historique"];
C.m5=["Installation Linux","Gestion des paquets (apt)","Demarrage et niveaux de demarrage","Gestion utilisateurs, groupes, mots de passe","Gestion des droits","Partitionnement et montage des disques","Gestion adressage IP","Gestion memoire et processus","Planification (cron)","Journalisation (syslog)"];
C.m6=["Modele OSI applique au reseau","Architecture reseau","Interconnexion equipements","Adressage TCP/IP","Segmentation en sous-reseaux","Equipements couche 2 (switch)","Switching et VLAN","QoS","Equipements couche 3 (routeur)","Routage statique/dynamique","Initiation Cisco (IOS)"];
C.m7=["Principes VoIP et ToIP","Protocoles de signalisation (SIP)","Protocoles transport voix (RTP)","Configuration serveur IPBX (Asterisk/3CX)","Fonctionnalites IPBX","Creation configuration poste client","Processus gestion des appels"];
C.m8=["Installation GLPI","GLPI authentification AD","GLPI habilitations","Gestion de parc et inventaire","Traitement automatise des tickets","Plugins GLPI, Fusion Inventory","Supervision reseau","SNMP","Nagios","Centreon"];
C.m9=["Ecosysteme Office 365","Exchange Online","SharePoint","Serveur web Apache + PHP","Base de donnees MySQL/MariaDB","Cloud : SaaS, PaaS, IaaS","Pare-feu, DMZ, NAT","VPN IPSec","PKI et certificats"];
C.m10=["Windows Server : disques","Windows Server : SAM utilisateurs","Active Directory (annuaire)","GPO (strategies de groupe)","DHCP","DNS","RDS (bureau a distance)","WDS (deploiement)","Routage et NAT","NFS (partage Linux)","Samba (partage Windows-Linux)","autoFS (montage auto)","NTP (serveur temps)"];
C.m11=["Algorithmique","Variables en Bash","Enchainement de commandes","Commandes internes/externes","Conditions et tests","Fonctions Bash","Decouverte PowerShell","Commandes PowerShell et langage objet","Variables, structures","Administration distance PowerShell","Outils de scripting"];
C.m12=["Fondamentaux cybersecurite","Securite smartphones/tablettes/PC","Securite et sauvegarde des donnees","Pare-feu et regles","Configuration VPN","Antivirus","Anglais : vocabulaire technique","Anglais : support utilisateurs","Anglais : procedures securite","Preparation TOEIC (650 vise)"];
C.exo=["Exercice 1 : ping et ipconfig (diagnostic reseau)","Exercice 2 : tracer une route avec tracert/traceroute","Exercice 3 : nslookup pour interroger le DNS","Exercice 4 : cmd Windows (creer dossiers fichiers)","Exercice 5 : PowerShell (processus et services)","Exercice 6 : installer Ubuntu sur VMware","Exercice 7 : commandes Linux de base","Exercice 8 : creer un script Bash simple","Exercice 9 : creer un script PowerShell","Exercice 10 : Packet Tracer (monter un reseau)","Exercice 11 : calculer des sous-reseaux","Exercice 12 : analyser le trafic avec Wireshark"];

// ====== PERSISTANCE ======
var P={};
function lp(){try{var d=localStorage.getItem("t2");if(d)P=JSON.parse(d)}catch(e){}}
function sp(){try{localStorage.setItem("t2",JSON.stringify(P))}catch(e){}}
function tg(s,i){if(!P[s])P[s]=[];var a=P[s],p=a.indexOf(i);p>=0?a.splice(p,1):a.push(i);sp();r();}
function ch(s){var it=C[s],sv=P[s]||[],h='<h2>Checklist</h2><ul class="check-list">';for(var i=0;i<it.length;i++){var d=sv.indexOf(i)>=0;h+='<li class="'+(d?'done':'')+'" onclick="tg(\''+s+'\','+i+')"><input type="checkbox"'+(d?' checked':'')+'>'+it[i]+'</li>';}return h+'</ul>';}
function st(){var t=0,d=0;for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++;}}return{d:d,t:t,p:t>0?Math.round(d/t*100):0};}

// ====== ACCUEIL ======
function pgHome(){
  var s=st(),h='<div class="page">';
  h+='<h1>TSRS <span class="gradient">Programme</span></h1>';
  h+='<p>Programme officiel <b>EXPERNET Campus Mayotte</b> — Formation BAC+2 Technicien Systemes Reseaux & Securite (RNCP 31115, Niveau 5). Revisions par module.</p>';
  h+='<div class="stat-grid"><div class="stat-card"><div class="val">'+s.d+'</div><div class="lbl">Acquis</div></div><div class="stat-card"><div class="val">'+s.t+'</div><div class="lbl">Notions</div></div><div class="stat-card"><div class="val" style="color:var(--green)">'+s.p+'%</div><div class="lbl">Maitrise</div></div></div>';
  h+='<div class="progress"><div class="progress-fill" style="width:'+s.p+'%"></div></div>';
  var mods=[["m1","Modele OSI",6],["m2","Unites et IPv4",8],["m3","Windows Client",10],["m4","Linux Utilisation",11],["m5","Admin Linux",10],["m6","Reseaux",11],["m7","Telephonie IP",7],["m8","Exploitation & Supervision",10],["m9","Cloud & Web",8],["m10","Services Reseau",14],["m11","Scripting",12],["m12","Securite & Anglais",10],["exo","Exercices pratiques",12]];
  for(var i=0;i<mods.length;i++){var ms=P[mods[i][0]]||[],mp=mods[i][2]>0?Math.round(ms.length/mods[i][2]*100):0;
  h+='<div class="card" style="cursor:pointer" onclick="nav(\''+mods[i][0]+'\')"><b>'+mods[i][1]+'</b> <span style="color:var(--text2);font-size:.65rem">'+ms.length+'/'+mods[i][2]+'</span><div class="progress"><div class="progress-fill" style="width:'+mp+'%"></div></div></div>';}
  h+='<div class="box box-info"><b>Infos :</b> Formation en alternance 24 mois (70% entreprise, 30% centre). Taux de reussite 88%. Poursuite possible Bac+4. Metiers : technicien support, technicien exploitation, technicien systeme/reseau.</div>';

// ====== MODULE 1 : MODELE OSI ======
function pgM1(){
  var h='<div class="page"><h1>M1 — Modele OSI</h1>';
  h+='<div class="card"><b>Les 7 couches :</b></div>';
  h+='<div class="box box-green"><b>7-Application</b> <span class="tag tag-pk">Application</span> : Logiciels (HTTP, SMTP, FTP)</div>';
  h+='<div class="box box-green"><b>6-Presentation</b> <span class="tag tag-pk">Presentation</span> : Traduction et chiffrement (SSL/TLS, JPEG)</div>';
  h+='<div class="box box-green"><b>5-Session</b> <span class="tag tag-pk">Session</span> : Ouvre/ferme la connexion (NetBIOS)</div>';
  h+='<div class="box box-green"><b>4-Transport</b> <span class="tag tag-pk">Transport</span> : TCP (fiable) vs UDP (rapide)</div>';
  h+='<div class="box box-green"><b>3-Reseau</b> <span class="tag tag-pk">Network</span> : Adresse IP et routage (IP, routeurs)</div>';
  h+='<div class="box box-green"><b>2-Liaison</b> <span class="tag tag-pk">Data Link</span> : Adresse MAC, trames (Ethernet, WiFi)</div>';
  h+='<div class="box box-green"><b>1-Physique</b> <span class="tag tag-pk">Physical</span> : Cables, fibre, signaux electriques</div>';
  h+='<div class="box box-info"><b>Encapsulation :</b> Quand un PC envoie des donnees, chaque couche ajoute son entete (comme des enveloppes dans des enveloppes). A la reception, chaque couche retire son entete (desencapsulation).</div>';
  h+='<div class="box box-info"><b>Mnemo :</b> "Please Do Not Throw Sausage Pizza Away" (Physique, Donnee, Reseau, Transport, Session, Presentation, Application)</div>';
  h+='<div class="box"><b>TCP (fiable) :</b> Verifie que les donnees arrivent. Utilise pour web, email, FTP.<br><b>UDP (rapide) :</b> Envoie sans verification. Utilise pour streaming, VoIP, jeux.</div>';
  h+='<div class="cmd"><span class="cm"># Voir les infos reseau de sa machine</span><br>ipconfig (Windows)<br>ip a (Linux)<br><span class="cm"># Tester la connexion</span><br>ping 8.8.8.8</div>';
  h+=ch("m1")+'</div>';return h;
}

// ====== MODULE 2 : UNITES ET IPv4 ======
function pgM2(){
  var h='<div class="page"><h1>M2 — Unites et IPv4</h1>';
  h+='<div class="card"><b>Le binaire :</b> Les ordinateurs ne comprennent que le binaire (0 et 1). 1 bit = 0 ou 1. 1 octet = 8 bits.</div>';
  h+='<div class="box"><b>Unites :</b> 1 octet = 8 bits. 1 Ko = 1024 octets. 1 Mo = 1024 Ko. 1 Go = 1024 Mo. 1 To = 1024 Go.</div>';
  h+='<div class="box"><b>Conversion :</b> 192 en binaire = 11000000. 168 = 10101000. 1 = 00000001.</div>';
  h+='<div class="card"><b>Adresse IPv4 :</b> 4 nombres de 0 a 255 separes par des points. Ex: 192.168.1.10. 32 bits au total.</div>';
  h+='<div class="box"><b>Classes IPv4 :</b><br><b>Classe A</b> : 1.0.0.0 a 126.255.255.255 (masque /8 = 255.0.0.0) — 16M hotes<br><b>Classe B</b> : 128.0.0.0 a 191.255.255.255 (/16 = 255.255.0.0) — 65 534 hotes<br><b>Classe C</b> : 192.0.0.0 a 223.255.255.255 (/24 = 255.255.255.0) — 254 hotes</div>';
  h+='<div class="box"><b>A savoir :</b> Adresse reseau = premiere adresse (192.168.1.0). Broadcast = derniere (192.168.1.255). Passerelle = premiere IP dispo (192.168.1.1). CIDR = notation /24 = 255.255.255.0.</div>';
  h+='<div class="card"><b>Sous-reseaux :</b> Decouper un grand reseau en plus petits. Exemple : un /24 peut etre decoupe en 2 x /25 (128 hotes chacun) ou 4 x /26 (64 hotes chacun).</div>';
  h+='<div class="cmd">IP: 192.168.1.10<br>Masque: 255.255.255.0 (/24)<br>Reseau: 192.168.1.0<br>Broadcast: 192.168.1.255<br>Passerelle: 192.168.1.1</div>';
  h+=ch("m2")+'</div>';return h;
}

// ====== MODULE 3 : WINDOWS CLIENT ======
function pgM3(){
  var h='<div class="page"><h1>M3 — Systeme Client Microsoft</h1>';
  h+='<div class="card"><b>VMware Workstation :</b> Permet de creer des machines virtuelles. Tu installes un OS dans une fenetre sans toucher a ton vrai PC. Essentiel pour s entrainer.</div>';
  h+='<div class="card"><b>Cmd (invite de commandes) :</b> dir (lister fichiers), cd (naviguer), mkdir (creer dossier), copy (copier), move (deplacer), del (supprimer).</div>';
  h+='<div class="card"><b>Stockage :</b> Disques, partitions, formats (NTFS = Windows, FAT32 = compatible, exFAT = cles USB).</div>';
  h+='<div class="card"><b>Utilisateurs :</b> Creer/supprimer des comptes, mots de passe, groupes. Chaque utilisateur a des droits specifiques.</div>';
  h+='<div class="card"><b>Permissions NTFS :</b> Chaque fichier/dossier a des droits : lecture (R), ecriture (W), execution (X). On les attribue aux utilisateurs et groupes.</div>';
  h+='<div class="card"><b>Partages :</b> Dossiers accessibles sur le reseau. Configurer les permissions de partage + permissions NTFS. La plus restrictive gagne.</div>';
  h+='<div class="card"><b>Pare-feu Windows :</b> Protege le PC en filtrant les connexions entrantes/sortantes. Creer des regles pour autoriser/bloquer des ports.</div>';
  h+='<div class="card"><b>PowerShell :</b> Evolution de cmd. Plus puissant, base sur les objets .NET. Commandes : Get-Process, Get-Service, Set-ExecutionPolicy.</div>';
  h+='<div class="card"><b>Maintenance :</b> Nettoyage disque, defragmentation, mise a jour Windows, restauration (point de restauration, backup).</div>';
  h+=ch("m3")+'</div>';return h;
}

// ====== MODULE 4 : LINUX UTILISATION ======
function pgM4(){
  var h='<div class="page"><h1>M4 — Utilisation Linux</h1>';
  h+='<div class="card"><b>Arborescence :</b> Tout part de / (racine). /bin (commandes), /etc (config), /home (utilisateurs), /var (logs), /tmp (temporaire), /dev (peripheriques).</div>';
  h+='<div class="card"><b>Commandes :</b> <span class="cmd">ls (lister), cd (naviguer), pwd (chemin), mkdir (creer dossier), rm (supprimer), cp (copier), mv (deplacer/renommer), cat (afficher fichier)</span></div>';
  h+='<div class="card"><b>Aide :</b> man + nom_commande = manuel. Ex: man ls</div>';
  h+='<div class="card"><b>Expressions regulieres :</b> grep pour chercher du texte. Ex: grep "erreur" /var/log/syslog</div>';
  h+='<div class="card"><b>Editeur Vim :</b> i = insérer, Esc = quitter insertion, :wq = sauvegarder et quitter, :q! = quitter sans sauvegarder.</div>';
  h+='<div class="card"><b>Pipes et redirections :</b> | envoie la sortie d une commande a une autre. Ex: ls | wc -l (compte les fichiers). > ecrit dans un fichier. < lit depuis un fichier.</div>';
  h+='<div class="card"><b>Permissions :</b> rwx r-x r-- = Proprietaire|Groupe|Autres. r=4, w=2, x=1. chmod 755 fichier = rwx pour proprio, r-x pour les autres.</div>';
  h+='<div class="card"><b>Archivage :</b> tar -czf archive.tar.gz dossier/ (compresser), tar -xzf archive.tar.gz (extraire). gzip, bzip2.</div>';
  h+='<div class="card"><b>Shell :</b> Variables (NOM="valeur"; echo $NOM), alias (alias ll="ls -la"), historique (history, fleche haut).</div>';
  h+=ch("m4")+'</div>';return h;
}

// ====== MODULE 5 : ADMIN LINUX ======
function pgM5(){
  var h='<div class="page"><h1>M5 — Administration Linux</h1>';
  h+='<div class="card"><b>Installation :</b> Ubuntu/Debian sont les plus utilisees en entreprise. Partitionnement manuel ou automatique.</div>';
  h+='<div class="card"><b>Paquets :</b> apt update (MAJ liste), apt install paquet (installer), apt remove paquet (supprimer), apt upgrade (MAJ systeme). sudo = super user do = admin.</div>';
  h+='<div class="card"><b>Demarrage :</b> Niveaux : 0 (arret), 1 (mono-utilisateur), 2-5 (multijoueur), 6 (redemarrage). systemctl pour gerer les services (systemctl start nginx).</div>';
  h+='<div class="card"><b>Utilisateurs :</b> adduser nom (creer), passwd nom (mot de passe), groupadd nom (groupe), usermod -aG groupe utilisateur (ajouter a un groupe).</div>';
  h+='<div class="card"><b>Disques :</b> fdisk, parted (partitionnement), mkfs (formater), mount (monter), umount (demonter). Fichier /etc/fstab pour montage automatique.</div>';
  h+='<div class="card"><b>Processus :</b> ps (lister), top (temps reel), kill PID (arreter), kill -9 PID (forcer).</div>';
  h+='<div class="card"><b>Planification :</b> cron. Modifier avec crontab -e. Format : minute heure jour mois jour_semaine commande.</div>';
  h+='<div class="card"><b>Journalisation :</b> syslog, /var/log/. dmesg (messages noyau), journalctl (systemd), /var/log/syslog (logs systeme).</div>';
  h+=ch("m5")+'</div>';return h;
}

// ====== MODULE 6 : RESEAUX ======
function pgM6(){
  var h='<div class="page"><h1>M6 — Reseaux et Cisco</h1>';
  h+='<div class="card"><b>Equipements :</b></div>';
  h+='<div class="box"><b>Switch (couche 2) :</b> Relie les PC entre eux sur un meme reseau. Utilise les adresses MAC pour acheminer les donnees.</div>';
  h+='<div class="box"><b>Routeur (couche 3) :</b> Relie differents reseaux. Choisit le chemin pour les donnees (routage).</div>';
  h+='<div class="box"><b>VLAN :</b> Decouper un switch en plusieurs petits reseaux. VLAN 10 = conptabilite, VLAN 20 = commercial. Ils ne communiquent pas sans routeur.</div>';
  h+='<div class="box"><b>QoS :</b> Prioriser certains flux (ex: la voix avant le telechargement).</div>';
  h+='<div class="box"><b>Routage statique :</b> Chemins ecrits a la main. Routage dynamique (OSPF) : les routeurs apprennent automatiquement.</div>';
  h+='<div class="box"><b>Initiation Cisco :</b> IOS = systeme d exploitation Cisco. Commandes : enable, configure terminal, show running-config, interface, ip address, no shutdown.</div>';
  h+='<div class="box"><b>Packet Tracer :</b> Simulateur gratuit Cisco pour construire des reseaux virtuels et s entrainer.</div>';
  h+=ch("m6")+'</div>';return h;
}

// ====== MODULE 7 : TELEPHONIE IP ======
function pgM7(){
  var h='<div class="page"><h1>M7 — Telephonie sur IP</h1>';
  h+='<div class="card"><b>VoIP (Voice over IP) :</b> La voix devient des donnees numeriques qui voyagent sur le reseau IP. Plus besoin de ligne telephonique separee.</div>';
  h+='<div class="card"><b>ToIP (Telephonie sur IP) :</b> Architecture complete de telephonie basee sur IP, avec PABX virtuel (IPBX).</div>';

<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test TSRS</title></head>
<body>
<div id="app" style="padding:2rem;font-family:sans-serif;background:#0b0d12;color:#e2e8f0;min-height:100vh">
<p>Chargement...</p>
</div>
<noscript><div style="color:red;padding:1rem;border:2px solid red">⚠️ JavaScript est désactivé ! Active-le pour voir le site.</div></noscript>
<script>
document.addEventListener('DOMContentLoaded', function(){
  try {
    var app = document.getElementById('app');
    app.innerHTML = '<h1>✅ OK</h1><p>JS marche !</p><p>Version: 1</p><button onclick="alert(\'test\')">Test</button>';
  } catch(e) {
    document.getElementById('app').innerHTML = '<p style="color:red">Erreur: '+e.message+'</p>';
  }
});
</script>
</body>
</html>

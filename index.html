<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS Programme</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--card:#11151c;--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:860px;margin:0 auto;padding:.8rem .8rem 80px}
h1{font-size:1.2rem;font-weight:800}
h2{font-size:.9rem;font-weight:700;margin:.8rem 0 .3rem;color:var(--accent)}
p{font-size:.76rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem;margin-bottom:.35rem}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,12,16,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding:.2rem 0}
.tab-btn{flex-shrink:0;padding:.3rem .5rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:6px;white-space:nowrap}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.1)}
.box{padding:.35rem .5rem;border-radius:6px;margin:.2rem 0;font-size:.73rem}
.box-info{background:rgba(6,182,212,.05);border-left:3px solid var(--accent)}
.box-g{background:rgba(16,185,129,.05);border-left:3px solid var(--green)}
.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:.2rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green))}
</style>
</head>

<button class="tab-btn" data-tab="m8" onclick="go(this)">M8 Script</button>
<button class="tab-btn" data-tab="exo" onclick="go(this)">Exercices</button>

<script>
var C={};
C.home=["Je connais les 7 couches du modele OSI","Je sais la difference TCP vs UDP","Je sais convertir en binaire","J ai utilise VMware","Je connais les commandes de base Linux"];
C.m1=["7 couches: Application,Presentation,Session,Transport,Reseau,Liaison,Physique","Encapsulation = chaque couche ajoute son entete","TCP = fiable / UDP = rapide","Mnemo: Please Do Not Throw Sausage Pizza Away"];
C.m2=["Binaire = 0 et 1. 1 octet = 8 bits","IPv4 = 4 nombres 0-255 separes par .","Masque = separe reseau (ex:/24) de la machine","Classe A /8, B /16, C /24","CIDR = /24 = 255.255.255.0","Reseau=1ere adresse, Broadcast=derniere, Gateway=porte"];
C.m3=["VMware = logiciel de machines virtuelles (PC dans PC)","Cmd: dir,cd,mkdir,copy,del,ipconfig,ping","NTFS (perm.), FAT32 (compat.), exFAT (USB)","Admin vs Standard. net user pour gerer","Permissions: Lecture R, Ecriture W, Execution X","Pare-feu: filtre entrant/sortant","PowerShell: Get-Process,Get-Service,Get-ChildItem"];
C.m4=["Arborescence: /bin,/etc,/home,/var,/tmp,/dev","Commandes: ls,cd,pwd,mkdir,rm,cp,mv,cat","Permissions: rwx r-x r--. chmod 755","Pipes: | envoie sortie a autre commande","Paquets: apt install/update/upgrade","Processus: ps,top,kill","Cron: crontab -e pour planifier"];
C.m5=["Switch c2: relie PC, adresse MAC","Routeur c3: relie reseaux, IP, routage","VLAN = decouper switch en reseaux isoles","Routage statique (ecrit) / dynamique (OSPF)","Cisco IOS: enable,conf t,show run","Packet Tracer = simulateur gratuit"];
C.m6=["Active Directory = annuaire centralise","DHCP = distribue IP auto","DNS = traduit noms en IP","GPO = regles appliquees aux PC","Apache: /var/www/html/, PHP+MySQL","NFS (Linux) / Samba (Linux-Win)"];
C.m7=["CIA: Confidentialite,Integrite,Disponibilite","Menaces: Phishing,Ransomware,DDOS","Pare-feu + DMZ = protection","VPN = tunnel chiffre pour acces distant","Regle 3-2-1: 3 copies,2 supports,1 hors-site","Cloud: SaaS, PaaS, IaaS"];
C.m8=["Bash: variables,if,for,chmod +x","PowerShell: Get-Process,Get-Service","Script: #!/bin/bash, echo, read"];
C.exo=["ping+ipconfig: test reseau","tracert: voir chemin vers site","nslookup: interroger DNS","cmd: mkdir,cd,echo >fichier,type","PS: Get-Process, Get-Service","VMware: installer Ubuntu","Linux: ls,cd,pwd,mkdir,rm,cp,mv","Script Bash: nano,chmod +x,./","Packet Tracer: 2 PC + switch + ping","Wireshark: capturer traffic DNS/HTTP"];
var P={};
function lp(){try{var d=localStorage.getItem("p");if(d)P=JSON.parse(d)}catch(e){}}
function sp(){try{localStorage.setItem("p",JSON.stringify(P))}catch(e){}}
function tg(s,i){if(!P[s])P[s]=[];var a=P[s],p=a.indexOf(i);p>=0?a.splice(p,1):a.push(i);sp();render();}
function cl(s){var it=C[s],sv=P[s]||[],h="<h2>Checklist</h2><ul>";for(var i=0;i<it.length;i++){var d=sv.indexOf(i)>=0;h+='<li onclick="tg(\\"'+s+'\\",'+i+')" style="cursor:pointer;padding:3px 0;font-size:.73rem;color:var(--text2);'+(d?"text-decoration:line-through;opacity:.5":"")+'">'+(d?"O":".")+" "+it[i]+"</li>";}return h+"</ul>";}
function st(){var t=0,d=0;for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++;}}return{d:d,t:t,p:t>0?Math.round(d/t*100):0};}
function home(){var s=st();return "<h1>TSRS Programme</h1><p>Formation BAC+2 EXPERNET Campus Mayotte.</p><div class=card><b>"+s.d+"/"+s.t+" ("+s.p+"%)</b><div class=progress><div class=progress-fill style=width:"+s.p+"%></div></div></div>"+cl("home");}
function m1(){
  var h="<h1>M1 — Modele OSI (7 couches)</h1>";
  h+="<div class=card><b>C'est quoi le modele OSI ?</b> Imagine un colis postal. Tu ecris une lettre (Application), tu la mets dans une enveloppe (Presentation), tu la fermes (Session), tu choisis le transport (Transport), ecris l adresse (Reseau), mets dans un camion (Liaison), et le camion roule (Physique). Chaque etape ajoute quelque chose. C est pareil pour le reseau : 7 couches qui emballent les donnees.</div>";
  h+="<div class='box box-g'><b>7-Application</b> (Application) : La couche que l utilisateur voit. Logiciels : <b>HTTP</b> (web), <b>SMTP</b> (email), <b>FTP</b> (transfert fichiers), <b>DNS</b> (noms de domaine). Exemple : Tu ouvres Chrome et tapes google.fr => HTTP s active.</div>";
  h+="<div class='box box-g'><b>6-Presentation</b> (Presentation) : Traduit les donnees pour que l ordinateur les comprenne. <b>Chiffrement SSL/TLS</b> (le cadenas dans le navigateur), compression, format <b>JPEG</b>/MP3. Exemple : Quand tu vois https://, c est la couche 6 qui chiffre.</div>";
  h+="<div class='box box-g'><b>5-Session</b> (Session) : Ouvre, maintient et ferme la connexion entre deux machines. Comme un coup de telephone : tu decroches (ouverture), tu parles (maintien), tu raccroches (fermeture).</div>";
  h+="<div class='box box-g'><b>4-Transport</b> (Transport) : Decoupe les donnees en segments et choisit le mode de transport.<br><b>TCP</b> = fiable mais lent. Verifie que tout est arrive. Comme une lettre recommandee.<br><b>UDP</b> = rapide mais pas de verification. Comme un SMS perdu possible. Utilise pour le streaming video.</div>";
  h+="<div class='box box-g'><b>3-Reseau</b> (Network) : Trouve le chemin jusqu a destination. Utilise les <b>adresses IP</b>. Le routeur travaille ici. Comme le facteur qui lit l adresse et choisit la route.</div>";
  h+="<div class='box box-g'><b>2-Liaison</b> (Data Link) : S occupe de la communication entre deux machines voisines. Utilise les <b>adresses MAC</b>. Le switch travaille ici. Trames = paquets de cette couche.</div>";
  h+="<div class='box box-g'><b>1-Physique</b> (Physical) : Les cables, fibres optiques, ondes WiFi, signaux electriques. Le materiel brut. Bits = 0 et 1 qui circulent.</div>";
  h+="<div class='box box-info'><b>Encapsulation :</b> Chaque couche AJOUTE son en-tete au paquet. Comme une poupee russe : couche 4 ajoute son en-tete, puis couche 3 ajoute le sien, etc. A la reception, chaque couche enleve son en-tete.<br><b>Mnemo :</b> Please Do Not Throw Sausage Pizza Away (PDNTSPA).</div>";
  h+="<div class='box box-info'><b>TCP vs UDP (a retenir) :</b> TCP = connexion d abord, accuse reception, retransmet si perdu. UDP = envoi direct, pas d accusé, continue meme si perte. Exemple concret : TCP pour telecharger un fichier (fichier corrompu interdit). UDP pour regarder une video en direct (une image sautee est mieux qu un buffering).</div>";
  return h+cl("m1");
}
function m2(){
  var h="<h1>M2 — Unites, Binaire et IPv4</h1>";
  h+="<div class=card><b>Binaire :</b> Le langage des ordinateurs. Seulement 2 chiffres : <b>0 et 1</b> (comme un interrupteur on/off).<br><b>1 bit</b> = 0 ou 1. <b>1 octet</b> (byte) = 8 bits = 256 valeurs possibles (de 0 a 255).<br>Pour convertir : 128+64+32+16+8+4+2+1. Exemple : 11000000 = 128+64 = <b>192</b>. 10101000 = 128+32+8 = <b>168</b>.</div>";
  h+="<div class=card><b>IPv4 :</b> 4 nombres separes par des points, chaque nombre entre 0 et 255. <b>32 bits</b> au total.<br>Exemple : <b>192.168.1.10</b> = 11000000.10101000.00000001.00001010 en binaire.<br>Il y a environ 4 milliards d adresses IPv4 possibles (32 bits = 2^32 = 4 294 967 296).</div>";
  h+="<div class=card><b>Masque de sous-reseau :</b> Separe l adresse en 2 parties : <b>RESEAU</b> (la rue) et <b>MACHINE</b> (le numero de maison).<br><b>/24</b> = 255.255.255.0 = les 3 premiers nombres designent le reseau, le dernier designe la machine.<br>Exemple : IP 192.168.1.10 avec masque /24 => reseau = 192.168.1, machine = 10.</div>";
  h+="<div class='box box-g'><b>Classe A</b> /8 : De 1.0.0.0 a 126.255.255.255. <b>16 millions</b> de machines par reseau. Pour les tres grandes entreprises (Google, Amazon). Masque = 255.0.0.0.</div>";
  h+="<div class='box box-g'><b>Classe B</b> /16 : De 128.0.0.0 a 191.255.255.255. <b>65 534</b> machines par reseau. Pour les moyennes entreprises. Masque = 255.255.0.0.</div>";
  h+="<div class='box box-g'><b>Classe C</b> /24 : De 192.0.0.0 a 223.255.255.255. <b>254</b> machines par reseau. Usage courant (maison, petite entreprise). Masque = 255.255.255.0.</div>";
  h+="<div class='box box-g'><b>CIDR :</b> (Classless Inter-Domain Routing) Notation moderne. /24 = 255.255.255.0, /16 = 255.255.0.0, /8 = 255.0.0.0. Plus le nombre est petit, plus le reseau est grand.</div>";
  h+="<div class='box box-info'><b>A retenir absolument :</b><br><b>Adresse reseau</b> = la premiere adresse (tous les bits machine a 0). Ex: 192.168.1.0<br><b>Broadcast</b> = la derniere adresse (tous les bits machine a 1). Ex: 192.168.1.255<br><b>Gateway</b> (passerelle) = la porte vers Internet. Ex: 192.168.1.1 (souvent la premiere adresse utilisable)<br>Les adresses utilisables pour les PC sont entre la premiere (reseau) et la derniere (broadcast).</div>";
  h+="<div class='box box-info'><b>Exercice pratique :</b> Pour 192.168.1.0/24, combien de machines ? 254 (2^8 - 2). Quelle est l adresse de broadcast ? 192.168.1.255. Quelle est la gateway typique ? 192.168.1.1.</div>";
  return h+cl("m2");
}
function m3(){
  var h="<h1>M3 — Windows (Client et Serveur)</h1>";
  h+="<div class=card><b>VMware :</b> Logiciel qui cree un PC virtuel dans votre PC. Comme un jeu video qui simule un ordinateur complet. Utile pour tester Windows Server sans avoir un 2e PC.</div>";
  h+="<div class='box box-g'><b>CMD (Invite de commandes) :</b> L'ancetre du terminal Windows.<br><b>dir</b> = liste les fichiers<br><b>cd</b> = change de dossier<br><b>mkdir</b> = cree un dossier<br><b>copy</b> = copie un fichier<br><b>del</b> = supprime un fichier<br><b>ipconfig</b> = voir son IP<br><b>ping</b> = tester si une machine repond</div>";
  h+="<div class='box box-g'><b>NTFS :</b> (New Technology File System) Moderne, permet les permissions, crypter, compresser. Utilise par Windows depuis 20 ans.<br><b>FAT32 :</b> Ancien, compatible partout (USB, appareils photo) mais fichier max 4 Go.<br><b>exFAT :</b> Moderne, compatible, pas de limite 4 Go. Ideal pour grosses cles USB.</div>";
  h+="<div class='box box-g'><b>Utilisateurs :</b> <b>Administrateur</b> = controle total du PC. <b>Standard</b> = utilisateur normal, ne peut pas installer de logiciel. Commande: <b>net user</b> pour gerer les comptes.</div>";
  h+="<div class='box box-g'><b>Permissions NTFS :</b> <b>R</b> (Read) = Lecture, peut ouvrir le fichier. <b>W</b> (Write) = Ecriture, peut modifier. <b>X</b> (eXecute) = Execution, peut lancer le programme.</div>";
  h+="<div class='box box-g'><b>Pare-feu Windows :</b> (Firewall) Filtre ce qui entre et sort du PC. Regle: autoriser ou bloquer un programme. Exemple: bloquer un jeu qui veut aller sur Internet.</div>";
  h+="<div class='box box-info'><b>PowerShell :</b> La version moderne de CMD. Plus puissant. <b>Get-Process</b> = liste les programmes en cours. <b>Get-Service</b> = liste les services. <b>Get-ChildItem</b> = equivalent de dir.</div>";
  return h+cl("m3");
}
function m4(){
  var h="<h1>M4 — Linux (Ubuntu/Debian)</h1>";
  h+="<div class=card><b>Arborescence :</b> Tout part de / (racine). <b>/bin</b> = programmes essentiels. <b>/etc</b> = fichiers de configuration. <b>/home</b> = dossiers des utilisateurs. <b>/var</b> = donnees variables (logs). <b>/tmp</b> = fichiers temporaires. <b>/dev</b> = peripheriques (disques, ports).</div>";
  h+="<div class='box box-g'><b>Commandes de base :</b><br><b>ls</b> = lister fichiers<br><b>cd</b> = changer dossier<br><b>pwd</b> = afficher dossier actuel<br><b>mkdir</b> = creer dossier<br><b>rm</b> = supprimer (fichier ou -r dossier)<br><b>cp</b> = copier<br><b>mv</b> = deplacer/renommer<br><b>cat</b> = afficher contenu fichier</div>";
  h+="<div class='box box-g'><b>Permissions Linux :</b> 3 groupes : <b>rwx</b> pour le proprio, <b>r-x</b> pour le groupe, <b>r--</b> pour les autres.<br>Chiffres : r=4, w=2, x=1. <b>chmod 755</b> = proprio peut tout (7), groupe peut lire+exec (5), autres peuvent lire+exec (5).</div>";
  h+="<div class='box box-g'><b>Pipe | :</b> Envoie la sortie d'une commande a une autre. Exemple: <b>ls | grep .txt</b> = liste seulement les fichiers .txt. Comme un tuyau qui relie deux commandes.</div>";
  h+="<div class='box box-g'><b>Gestionnaire de paquets apt :</b> App store de Linux. <b>apt install</b> = installer. <b>apt update</b> = mettre a jour la liste. <b>apt upgrade</b> = mettre a jour les logiciels.</div>";
  h+="<div class='box box-g'><b>Processus :</b> <b>ps</b> = liste les processus en cours. <b>top</b> = tableau interactif des processus. <b>kill</b> = arreter un processus (kill 1234).</div>";
  h+="<div class='box box-info'><b>Cron :</b> Planificateur de taches. <b>crontab -e</b> = editer les taches. Exemple: <b>0 2 * * * /script.sh</b> = lance le script tous les jours a 2h du matin.</div>";
  return h+cl("m4");
}
function m5(){
  var h="<h1>M5 — Reseau (Equipements Cisco)</h1>";
  h+="<div class='box box-g'><b>Switch (couche 2) :</b> Relie les PC entre eux dans le meme reseau. Utilise les <b>adresses MAC</b> (adresse physique unique de la carte reseau). Table MAC = le switch sait quel PC est a quel port.</div>";
  h+="<div class='box box-g'><b>Routeur (couche 3) :</b> Relie differents reseaux entre eux. Utilise les <b>adresses IP</b>. Table de routage = le routeur sait par ou envoyer les paquets pour chaque destination.</div>";
  h+="<div class='box box-g'><b>VLAN :</b> (Virtual LAN) Decoupe un switch physique en plusieurs reseaux isoles. Exemple: VLAN 10 = profs, VLAN 20 = eleves. Meme switch, mais ils ne se voient pas.</div>";
  h+="<div class='box box-g'><b>Routage :</b> <b>Statique</b> = l'administrateur ecrit les routes a la main. Simple mais ne s'adapte pas.<br><b>Dynamique (OSPF)</b> = les routeurs parlent entre eux et trouvent le meilleur chemin automatiquement.</div>";
  h+="<div class='box box-g'><b>Cisco IOS :</b> L'OS des routeurs Cisco. <b>enable</b> = mode administrateur. <b>conf t</b> = configuration terminal. <b>show run</b> = afficher la configuration actuelle.</div>";
  h+="<div class='box box-info'><b>Packet Tracer :</b> Simulateur gratuit de Cisco. Permet de construire un reseau entier sur PC sans materiel. Ideal pour s entrainer aux examens.</div>";
  return h+cl("m5");
}
function m6(){
  var h="<h1>M6 — Services Reseau</h1>";
  h+="<div class='box box-g'><b>Active Directory (AD) :</b> Annuaire centralise de Microsoft. Stocke tous les utilisateurs, ordinateurs, groupes d'une entreprise. Un admin cree un compte = accessible sur tous les PC du domaine.</div>";
  h+="<div class='box box-g'><b>DHCP :</b> (Dynamic Host Configuration Protocol) Distribue automatiquement les adresses IP aux PC. Plus besoin de configurer chaque PC a la main. Le serveur DHCP donne: IP, masque, passerelle, DNS.</div>";
  h+="<div class='box box-g'><b>DNS :</b> (Domain Name System) Traduit les noms de sites (google.fr) en adresses IP (142.250.xxx.xxx). Comme un annuaire telephonique d Internet.</div>";
  h+="<div class='box box-g'><b>GPO :</b> (Group Policy Objects) Regles appliquees aux PC du domaine. Exemple: interdire l acces au Panneau de configuration pour les eleves, imposer un fond d ecran.</div>";
  h+="<div class='box box-g'><b>Apache :</b> Serveur web libre. Fichiers stockes dans <b>/var/www/html/</b>. Marche avec <b>PHP</b> (langage dynamique) et <b>MySQL</b> (base de donnees).</div>";
  h+="<div class='box box-info'><b>Partage de fichiers :</b> <b>NFS</b> (Network File System) = partage entre Linux. <b>Samba</b> = partage entre Linux et Windows. Les deux permettent de monter un dossier distant comme s il etait local.</div>";
  return h+cl("m6");
}
function m7(){
  var h="<h1>M7 — Securite des Systemes</h1>";
  h+="<div class=card><b>Triade CIA :</b> Les 3 piliers de la securite.<br><b>C</b> (Confidentialite) = seul l autorise lit les donnees. Chiffrement.<br><b>I</b> (Integrite) = les donnees ne sont pas modifiees par erreur.<br><b>A</b> (Disponibilite) = le service est accessible quand on en a besoin.</div>";
  h+="<div class='box box-g'><b>Menaces courantes :</b><br><b>Phishing</b> = faux email qui vole vos mots de passe.<br><b>Ransomware</b> = virus qui chiffre vos fichiers et demande une rancon.<br><b>DDOS</b> = des milliers de machines attaquent un site pour le faire planter.</div>";
  h+="<div class='box box-g'><b>Pare-feu + DMZ :</b> <b>Pare-feu</b> (firewall) = mur entre Internet et le reseau interne. <b>DMZ</b> (zone demilitarisee) = zone isolee ou on place les serveurs publics (web, mail). Si un serveur est pirate, le reseau interne reste protege.</div>";
  h+="<div class='box box-g'><b>VPN :</b> (Virtual Private Network) Tunnel chiffre entre votre PC et le reseau de l entreprise. Comme si vous etiez connecte en direct dans le bureau, meme depuis chez vous. Utile pour le teletravail.</div>";
  h+="<div class='box box-g'><b>Regle 3-2-1 :</b> <b>3</b> copies de vos donnees, sur <b>2</b> supports differents (disque dur + cloud), dont <b>1</b> hors-site (dans un autre batiment).</div>";
  h+="<div class='box box-info'><b>Cloud :</b> <b>SaaS</b> = logiciel en ligne (Gmail, Office 365). <b>PaaS</b> = plateforme pour developper (Heroku). <b>IaaS</b> = serveurs virtuels (AWS, Azure).</div>";
  return h+cl("m7");
}
function m8(){
  var h="<h1>M8 — Script (Bash et PowerShell)</h1>";
  h+="<div class=card><b>Script Bash (Linux) :</b> Fichier .sh qui contient des commandes. Commence par <b>#!/bin/bash</b>. Se lance avec <b>./script.sh</b> apres <b>chmod +x</b>.</div>";
  h+="<div class='box box-g'><b>Variables Bash :</b> <b>nom=\"Toto\"</b> puis <b>echo $nom</b> affiche Toto. <b>read prenom</b> attend que l utilisateur tape quelque chose.</div>";
  h+="<div class='box box-g'><b>Conditions Bash :</b> <br>if [ \"$var\" = \"oui\" ]; then<br>  echo \"OK\"<br>else<br>  echo \"Non\"<br>fi</div>";
  h+="<div class='box box-g'><b>Boucle Bash :</b> <br>for i in 1 2 3; do<br>  echo \"Tour $i\"<br>done</div>";
  h+="<div class='box box-g'><b>PowerShell :</b> <b>Get-Process</b> = processus en cours. <b>Get-Service</b> = services Windows. <b>Get-ChildItem</b> = lister fichiers. <b>Select-Object</b> = filtrer les colonnes. <b>Where-Object</b> = filtrer les lignes.</div>";
  h+="<div class='box box-info'><b>Astuce :</b> <b>chmod +x script.sh</b> rend le script executable. <b>./script.sh</b> le lance. <b>nano script.sh</b> edite le fichier. Toujours tester avec des petites donnees d abord.</div>";
  return h+cl("m8");
}

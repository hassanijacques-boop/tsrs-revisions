<!DOCTYPE html>

<head>

<title>TSRS — Bloc 1 : Deploiement</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--bg2:#11151c;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--accent2:#0891b2;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--pink:#ec4899;--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 90px}
h1{font-size:1.4rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--accent)}
h3{font-size:.9rem;font-weight:600;margin:.75rem 0 .35rem;color:#f1f5f9}
h4{font-size:.82rem;font-weight:600;margin:.5rem 0 .25rem;color:var(--accent2)}
p,li{font-size:.82rem;color:var(--text2);line-height:1.7}
p b,li b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.6rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:.3rem 0 env(safe-area-inset-bottom,.3rem);overflow-x:auto}
.tab-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.4rem .2rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:8px;font-weight:500;white-space:nowrap}
.tab-btn svg{width:18px;height:18px;opacity:.6}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.08)}
.tab-btn.active svg{opacity:1}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:10px;border:none;font-size:.82rem;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px}

.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.5rem;padding:.25rem 0;font-size:.78rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}

.tag{display:inline-block;padding:.15rem .45rem;border-radius:5px;font-size:.65rem;font-weight:600}
.tag-blue{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-green{background:rgba(16,185,129,.12);color:var(--green)}
.tag-orange{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red)}
.tag-pink{background:rgba(236,72,153,.12);color:var(--pink)}

.box{padding:.5rem .7rem;border-radius:8px;margin:.4rem 0;font-size:.8rem}
.box-info{background:rgba(6,182,212,.06);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.06);border-left:3px solid var(--green)}
.box-orange{background:rgba(245,158,11,.06);border-left:3px solid var(--orange)}
.box-blue{background:rgba(99,102,241,.06);border-left:3px solid #6366f1}

.code{font-family:monospace;font-size:.72rem;background:rgba(0,0,0,.4);padding:.6rem;border-radius:8px;overflow-x:auto;color:var(--green);line-height:1.6;margin:.4rem 0}
.code .gr{color:#6b7280}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}

.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
@media(max-width:480px){.cmd-grid{grid-template-columns:1fr}}
.cmd-item{background:rgba(0,0,0,.3);border-radius:6px;padding:.3rem .5rem;font-family:monospace;font-size:.72rem}
.cmd-item .c{color:var(--green)}
.cmd-item .d{color:var(--text2);font-size:.62rem;font-family:system-ui,sans-serif;margin-top:.1rem}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:.4rem;margin:.5rem 0}
.stat-card{text-align:center;padding:.5rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.stat-card .val{font-size:1.3rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.65rem;color:var(--text2);margin-top:.1rem}

.livrable{border:1px dashed var(--orange);background:rgba(245,158,11,.03);border-radius:8px;padding:.6rem .8rem;margin:.4rem 0;font-size:.78rem}
.livrable strong{color:var(--orange)}
.livrable li{font-size:.75rem}
.eval{border:1px dashed var(--green);background:rgba(16,185,129,.03);border-radius:8px;padding:.6rem .8rem;margin:.4rem 0;font-size:.78rem}
.eval strong{color:var(--green)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease}
</style>
</head>
<body>

  <button class="tab-btn" data-tab="reseau" onclick="nav('reseau')">

</nav>

<script>
// ============================================================
// DATA
// ============================================================

var CHECKS = {
  home: [
    "Je comprends le modele OSI (7 couches)",
    "Je sais la difference entre TCP et UDP",
    "Je connais le binaire et les unites informatiques",
    "J ai installe une machine virtuelle VMware",
    "Je sais faire un ping et lire le resultat"
  ],
  materiel: [
    "Je sais tester un materiel avant de le deployer",
    "Je connais l architecture d un poste de travail",
    "Je sais installer un poste utilisateur",
    "Je sais ce qu est un serveur physique et virtuel",
    "Je sais installer une imprimante en reseau",
    "Je sais deploiement du materiel telephonique",
    "Je peux faire un plan de deploiement"
  ],
  systeme: [
    "Je connais les outils de deploiement automatique",
    "Je sais creer une image systeme",
    "Je sais deployer une image systeme",
    "Je comprends la virtualisation des serveurs",
    "Je sais automatiser avec des scripts",
    "Je sais rediger une procedure d installation"
  ],
  reseau: [
    "Je sais realiser un reseau filaire",
    "Je sais configurer un reseau sans fil (WiFi)",
    "Je sais interconnecter des equipements reseau",
    "Je sais parametrer un switch",
    "Je sais realiser une maquette de simulation",
    "Je sais faire un plan d adressage",
    "Je sais documenter la topologie du SI"
  ],
  logiciel: [
    "Je sais installer des logiciels bureautiques",
    "Je sais configurer une messagerie",
    "Je sais configurer une plateforme collaborative",
    "Je sais installer un acces bureau virtuel",
    "Je sais utiliser un logiciel de prise en main a distance",
    "Je sais automatiser l installation de logiciels"
  ]
};

var PROGRESS = {};
function loadP() {
  try { var d = localStorage.getItem('tsrs_p'); if (d) PROGRESS = JSON.parse(d); } catch(e) {}
}
function saveP() {
  try { localStorage.setItem('tsrs_p', JSON.stringify(PROGRESS)); } catch(e) {}
}
function tog(s, idx) {
  if (!PROGRESS[s]) PROGRESS[s] = [];
  var a = PROGRESS[s];
  var p = a.indexOf(idx);
  if (p >= 0) a.splice(p, 1); else a.push(idx);
  saveP(); render();
}
function cl(s) {
  var items = CHECKS[s], saved = PROGRESS[s] || [], h = '<ul class="check-list">';
  for (var i = 0; i < items.length; i++) {
    var d = saved.indexOf(i) >= 0;
    h += '<li class="' + (d ? 'done' : '') + '" onclick="tog(\'' + s + '\',' + i + ')">';
    h += '<input type="checkbox"' + (d ? ' checked' : '') + '> ' + items[i] + '</li>';
  }
  return h + '</ul>';
}
function stats() {
  var t = 0, d = 0;
  for (var k in CHECKS) {
    var items = CHECKS[k], saved = PROGRESS[k] || [];
    for (var i = 0; i < items.length; i++) { t++; if (saved.indexOf(i) >= 0) d++; }
  }
  return {d:d, t:t, pct:t>0?Math.round(d/t*100):0};
}

// ============================================================
// PAGES
// ============================================================

function pageHome() {
  var s = stats();
  var h = '<div class="page">';
  h += '<div style="text-align:center;padding:1.5rem 0 1rem">';
  h += '<span style="display:inline-block;background:rgba(6,182,212,.1);color:var(--accent);padding:.2rem .8rem;border-radius:20px;font-size:.7rem;font-weight:600;margin-bottom:.5rem">BAC+2 RNCP Niveau 5 — Bloc 1</span>';
  h += '<h1>Bloc 1 : <span class="gradient">Deploiement</span></h1>';
  h += '<p style="font-size:.82rem">Deployer les materiaux, les systemes et le reseau. Le premier des 5 blocs de competences du Titre TSRS.</p>';
  h += '</div>';

  h += '<div class="card" style="text-align:center;padding:.6rem;margin-bottom:.8rem">';
  h += '<div style="display:flex;justify-content:center;gap:1.5rem;font-size:.8rem">';
  h += '<div><b style="color:var(--accent);font-size:1rem">' + s.d + '</b><br><span style="font-size:.7rem;color:var(--text2)">Acquis</span></div>';
  h += '<div><b style="color:var(--text);font-size:1rem">' + s.t + '</b><br><span style="font-size:.7rem;color:var(--text2)">Notions</span></div>';
  h += '<div><b style="color:var(--green);font-size:1rem">' + s.pct + '%</b><br><span style="font-size:.7rem;color:var(--text2)">Maitrise</span></div>';
  h += '</div>';
  h += '<div class="progress"><div class="progress-fill" style="width:' + s.pct + '%"></div></div>';
  h += '</div>';

  h += '<div class="card" style="border-left:3px solid var(--accent);font-size:.82rem">';
  h += '<b>Activite 1 : Deployer les materiaux, les systemes et le reseau</b><br>';
  h += '<span style="color:var(--text2);font-size:.78rem">Ce bloc couvre tout ce qui concerne la mise en place du parc informatique : depuis la reception du materiel jusqu a sa mise en service, en passant par l installation des systemes d exploitation, du reseau et des logiciels.</span>';
  h += '</div>';

  h += '<h2>Les 4 sous-activites</h2>';

  var acts = [
    ['materiel', '1.1', 'Deploiement des materiaux', 'Installation des postes, serveurs, imprimantes, telephones. Tests avant deploiement.', '🔧', 'var(--accent)', 0],
    ['systeme', '1.2', 'Installation des systemes', 'OS Windows et Linux, virtualisation, images systeme, deploiement automatique.', '💿', 'var(--green)', 1],
    ['reseau', '1.3', 'Deploiement du reseau', 'Reseau filaire/sans fil, equipements, routage, maquettes de simulation, bornes WiFi.', '🌐', 'var(--purple)', 2],
    ['logiciel', '1.4', 'Deploiement des logiciels', 'Logiciels bureautique, messagerie, collaboration, bureau virtuel, prise en main a distance.', '📦', 'var(--orange)', 3]
  ];

  for (var i = 0; i < acts.length; i++) {
    var a = acts[i];
    var ms = PROGRESS[a[0]] || [];
    var mt = (CHECKS[a[0]] || []).length;
    var mp = mt > 0 ? Math.round(ms.length / mt * 100) : 0;
    h += '<div class="card" style="cursor:pointer;padding:.65rem;border-left:3px solid ' + a[5] + '" onclick="nav(\'' + a[0] + '\')">';
    h += '<div style="display:flex;align-items:center;gap:.5rem">';
    h += '<div style="font-size:1.5rem">' + a[4] + '</div>';
    h += '<div style="flex:1"><b style="font-size:.85rem">' + a[1] + ' — ' + a[2] + '</b><br><span style="font-size:.7rem;color:var(--text2)">' + a[3] + '</span></div>';
    h += '</div>';
    h += '<div class="progress" style="height:3px;margin-top:.4rem"><div class="progress-fill" style="width:' + mp + '%"></div></div>';
    h += '</div>';
  }

  h += '<h2>Les livrables attendus pour ce bloc</h2>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li>Procedures d installation</li>';
  h += '<li>Plan de deploiement</li>';
  h += '<li>Plan de recette (tests de validation)</li>';
  h += '<li>Scripts d automatisation</li>';
  h += '<li>Rapport de deploiement d images systemes</li>';
  h += '<li>Tables de routage et plan d adressage</li>';
  h += '<li>Topologie du Systeme d Information (SI)</li>';
  h += '<li>Fiches d interventions</li>';
  h += '</ul>';

  h += '<h2>Checklist</h2>' + cl('home');
  h += '</div>';
  return h;
}

function pageMateriel() {
  var h = '<div class="page">';
  h += '<h1>1.1 — Deploiement des materiaux</h1>';
  h += '<p>Cette activite consiste a <strong>installer et configurer tout le materiel informatique</strong> de l entreprise : ordinateurs, serveurs, imprimantes, telephones, appareils mobiles. Le technicien doit s assurer que tout fonctionne correctement avant de le mettre a disposition des utilisateurs.</p>';

  h += '<h2>Ce qu il faut savoir faire</h2>';

  h += '<h3>1.1.1 — Tester les nouveaux materiaux avant deploiement</h3>';
  h += '<div class="card">';
  h += '<p>Avant de livrer un ordinateur a un employe, tu dois <strong>tester</strong> qu il fonctionne correctement :</p>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li>Allumer la machine et verifier qu elle boote (demarre)</li>';
  h += '<li>Verifier que tous les peripheriques fonctionnent (ecran, clavier, souris, webcam)</li>';
  h += '<li>Tester la connexion reseau (ping, acces Internet)</li>';
  h += '<li>Verifier que le systeme d exploitation est bien installe et a jour</li>';
  h += '<li>Faire un test de performance de base (ouvrir des applications)</li>';
  h += '</ul>';
  h += '<div class="box box-info"><b>Pourquoi c est important ?</b> Si tu livres un PC defectueux, l employe perd du temps, le service support est deborde, et ca donne une mauvaise image du service informatique. Le test evite les retours et les dysfonctionnements.</div>';
  h += '</div>';

  h += '<h3>1.1.2 — Installer et configurer les postes utilisateurs</h3>';
  h += '<div class="card">';
  h += '<p>Un poste utilisateur doit etre <strong>adapte aux besoins specifiques</strong> de la personne qui va l utiliser :</p>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li>Connaitre l <b>architecture materielle</b> : processeur, RAM, disque dur, carte reseau</li>';
  h += '<li>Choisir le bon materiel selon le metier (ex: un graphiste a besoin de plus de RAM et d un bon ecran)</li>';
  h += '<li>Installer les peripheriques necessaires (imprimante locale, scanner, lecteur de badge)</li>';
  h += '<li>Configurer le poste dans le domaine de l entreprise (Active Directory)</li>';
  h += '<li>Prendre en compte l <b>accessibilite numerique</b> pour les personnes handicapees (grande police, contraste eleve, lecteur d ecran)</li>';
  h += '</ul>';
  h += '</div>';

  h += '<h3>1.1.3 — Installer et parametrer les serveurs physiques et virtuels</h3>';
  h += '<div class="card">';
  h += '<p><b>Serveur physique :</b> Une machine puissante installee dans une salle dediee (datacenter, baie serveur). On y installe Windows Server ou Linux.</p>';
  h += '<p><b>Serveur virtuel (VM) :</b> Un serveur qui tourne a l interieur d un autre serveur grace a un <b>hyperviseur</b> (VMware ESXi, Hyper-V). Un seul serveur physique peut heberger 10, 20 ou 50 serveurs virtuels.</p>';
  h += '<div class="box box-green"><b>Avantage de la virtualisation :</b> Economie d electricite, facilite de sauvegarde, isolation entre services. Si un serveur virtuel plante, les autres continuent de fonctionner.</div>';
  h += '<p style="font-size:.78rem">Le technicien doit savoir : installer l hyperviseur, creer une VM, installer un OS dedans, l integrer dans l annuaire AD de l entreprise.</p>';
  h += '</div>';

  h += '<h3>1.1.4 — Installer et parametrer les imprimantes multifonctions</h3>';
  h += '<div class="card">';
  h += '<p>Les imprimantes en entreprise sont <strong>partagees en reseau</strong>. Plusieurs personnes peuvent imprimer sur la meme machine :</p>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li>Connecter l imprimante au reseau (par cable ethernet ou WiFi)</li>';
  h += '<li>Attribuer une adresse IP fixe a l imprimante</li>';
  h += '<li>L integrer dans le <b>serveur d impression</b> Windows</li>';
  h += '<li>Deployer l imprimante automatiquement sur les postes via les GPO</li>';
  h += '<li>Gerer les cartouches et le papier (maintenance)</li>';
  h += '</ul>';
  h += '<div class="box box-info"><b>Serveur d impression :</b> Un service Windows qui centralise la gestion des imprimantes. Les utilisateurs n ont pas besoin d installer de pilote manuellement, c est automatique.</div>';
  h += '</div>';

  h += '<h3>1.1.5 — Deployer le materiel telephonique et audiovisuel</h3>';
  h += '<div class="card">';
  h += '<p>Les telephones modernes sont des <b>telephones IP (VoIP)</b> qui se branchent sur le reseau informatique comme un ordinateur :</p>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li>Installer les telephones IP sur les bureaux</li>';
  h += '<li>Configurer le standard telephonique virtuel (IPBX)</li>';
  h += '<li>Installer les camera et ecrans dans les salles de reunion</li>';
  h += '<li>Centraliser la gestion de tout l equipement audiovisuel</li>';
  h += '</ul>';
  h += '</div>';

  h += '<h2>Ce qui sera evalue</h2>';
  h += '<div class="eval">';
  h += '<b>Mise en situation professionnelle :</b> A partir d un cas reel d entreprise, tu dois deployer des materiaux informatiques de production.<br><br>';
  h += '<b>Livrables a fournir :</b>';
  h += '<ul style="margin-top:.25rem">';
  h += '<li>Procedures d installation</li>';
  h += '<li>Plan de deploiement</li>';
  h += '<li>Plan de recette (test de validation)</li>';
  h += '</ul>';
  h += '<b>Criteres de reussite :</b>';
  h += '<ul style="margin-top:.25rem">';
  h += '<li>Les tests de deploiement sont effectues et reussis</li>';
  h += '<li>Les delais de deploiement sont respectes</li>';
  h += '<li>Le materiel correspond aux besoins des utilisateurs</li>';
  h += '<li>Les serveurs sont integres dans l annuaire de l entreprise</li>';
  h += '<li>Les tests d impression sont concluants</li>';
  h += '<li>La procedure de deploiement est respectee</li>';
  h += '</ul>';
  h += '</div>';

  h += '<h2>Checklist 1.1</h2>' + cl('materiel');
  h += '</div>';
  return h;
}

function pageSysteme() {
  var h = '<div class="page">';
  h += '<h1>1.2 — Installation des systemes d exploitation</h1>';
  h += '<p>Cette activite consiste a <strong>installer Windows et Linux</strong> sur les postes et serveurs, en utilisant des methodes automatisees pour gagner du temps et assurer une configuration identique sur toutes les machines.</p>';

  h += '<h2>Ce qu il faut savoir faire</h2>';

  h += '<li><b>Clonezilla :</b> Outil gratuit pour cloner un disque dur</li>';

  h += '</div>';

  h += '<h3>1.2.2 — Creer, deployer et mettre a jour une image systeme</h3>';
  h += '<div class="card">';

function pageReseau() {

function pageProgres() {
  var s = stats();
  var h = '<div class="page">';
  h += '<h1>Progression</h1>';
  h += '<p>Suis ta maitrise du Bloc 1 theme par theme.</p>';

  h += '<div class="stat-grid">';
  h += '<div class="stat-card"><div class="val">' + s.d + '</div><div class="lbl">Acquis</div></div>';
  h += '<div class="stat-card"><div class="val">' + s.t + '</div><div class="lbl">Total</div></div>';
  h += '<div class="stat-card"><div class="val" style="color:var(--green)">' + s.pct + '%</div><div class="lbl">Maitrise</div></div>';
  h += '</div>';
  h += '<div class="progress" style="height:8px"><div class="progress-fill" style="width:' + s.pct + '%"></div></div>';

  var secs = [
    ['materiel', '1.1 — Deploiement des materiaux', '🔧'],
    ['systeme', '1.2 — Installation des systemes', '💿'],
    ['reseau', '1.3 — Deploiement du reseau', '🌐'],
    ['logiciel', '1.4 — Deploiement des logiciels', '📦']
  ];

  for (var i = 0; i < secs.length; i++) {
    var items = CHECKS[secs[i][0]] || [];
    var saved = PROGRESS[secs[i][0]] || [];
    var pct = items.length > 0 ? Math.round(saved.length / items.length * 100) : 0;
    h += '<div class="card" style="padding:.6rem .8rem">';
    h += '<div style="display:flex;align-items:center;gap:.5rem">';
    h += '<div style="font-size:1.3rem">' + secs[i][2] + '</div>';
    h += '<div style="flex:1"><b style="font-size:.82rem">' + secs[i][1] + '</b>';
    h += '<div class="progress" style="height:4px;margin:.2rem 0"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    h += '<span style="font-size:.65rem;color:var(--text2)">' + saved.length + '/' + items.length + ' maitrises</span></div>';
    h += '<button class="btn btn-outline" style="padding:.25rem .6rem;font-size:.7rem" onclick="nav(\'' + secs[i][0] + '\')">Voir</button>';
    h += '</div></div>';
  }

  h += '<h2>Ressources pour ce bloc</h2>';
  h += '<div class="card" style="font-size:.78rem">';
  h += '<b>Outils gratuits a installer :</b><br>';
  h += '<ul style="color:var(--text2);padding-left:1rem;line-height:1.8;margin-top:.2rem">';
  h += '<li><b>VMware Workstation Player</b> — Machines virtuelles (gratuit)</li>';
  h += '<li><b>Cisco Packet Tracer</b> — Simulation reseau (gratuit via NetAcad)</li>';
  h += '<li><b>Ubuntu Desktop</b> — Linux pour debutant (gratuit)</li>';
  h += '<li><b>Wireshark</b> — Analyse du trafic reseau (gratuit)</li>';
  h += '</ul>';
  h += '</div>';

  h += '<div style="margin-top:.5rem">';
  h += '<button class="btn btn-outline" onclick="resetAll()" style="font-size:.72rem">Reinitialiser la progression</button>';
  h += '</div>';

  h += '</div>';
  return h;
}

function resetAll() {
  if (!confirm('Reinitialiser toute la progression ?')) return;
  PROGRESS = {};
  saveP();
  render();
}

// ============================================================
// ROUTER
// ============================================================
var PAGES = {
  home: pageHome,
  materiel: pageMateriel,
  systeme: pageSysteme,
  reseau: pageReseau,
  logiciel: pageLogiciel,
  progres: pageProgres
};

var currentTab = 'home';

function nav(page) {
  currentTab = page;
  try { localStorage.setItem('tsrs_tab', page); } catch(e) {}
  render();
}

function render() {
  var app = document.getElementById('app');
  var fn = PAGES[currentTab];
  if (!fn) fn = PAGES.home;
  app.innerHTML = fn();
  var tabs = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'tab-btn' + (tabs[i].dataset.tab === currentTab ? ' active' : '');
  }
  var bar = document.getElementById('tab-bar');
  if (bar) bar.style.display = 'flex';
  window.scrollTo(0, 0);
}

// ============================================================
// START
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  try {
    loadP();
    try { var t = localStorage.getItem('tsrs_tab'); if (t && PAGES[t]) currentTab = t; } catch(e) {}
    render();
  } catch(e) {
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<div style="padding:2rem;color:#ef4444">Erreur: ' + e.message + '</div>';
  }
});
</script>

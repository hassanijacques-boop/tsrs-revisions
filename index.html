<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS Programme</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b12;--card:#0f1520;--card2:#141b2a;--border:rgba(255,255,255,.06);--text:#e8edf5;--text2:#94a3b8;--accent:#22d3ee;--green:#34d399;--gold:#fbbf24;--purple:#a78bfa;--orange:#fb923c;--pink:#f472b6;--tag:#f59e0b;--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.8}
#app{max-width:860px;margin:0 auto;padding:1.2rem 1.2rem 100px}
h1{font-size:1.4rem;font-weight:800;padding-bottom:.4rem;border-bottom:2px solid var(--border);margin-bottom:.9rem}
h2{font-size:1.05rem;font-weight:700;margin:1.2rem 0 .5rem;color:var(--accent);letter-spacing:.3px}
p{font-size:.88rem;color:var(--text2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.7rem;line-height:1.75}
.card b{color:#f1f5f9}
.tag{display:inline-block;background:rgba(245,158,11,.12);color:var(--tag);font-size:.7rem;font-weight:600;padding:.1rem .4rem;border-radius:5px;letter-spacing:.4px;text-transform:uppercase;vertical-align:middle;margin-right:3px}
.box{padding:.6rem .75rem;border-radius:8px;margin:.4rem 0;font-size:.85rem;line-height:1.7}
.box-info{background:rgba(34,211,238,.04);border-left:4px solid var(--accent)}
.box-g{background:rgba(52,211,153,.04);border-left:4px solid var(--green)}
.box-def{background:rgba(167,139,250,.04);border-left:4px solid var(--purple)}
.box-cmd{background:rgba(251,146,60,.04);border-left:4px solid var(--orange)}
.box-warn{background:rgba(244,114,182,.04);border-left:4px solid var(--pink)}
.box br{margin-bottom:4px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(8,11,18,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding:.5rem .3rem;gap:5px}
.tab-btn{flex-shrink:0;padding:.5rem .65rem;border:none;background:transparent;color:var(--text2);font-size:.72rem;font-weight:600;cursor:pointer;border-radius:10px;white-space:nowrap;transition:all .15s;letter-spacing:.2px}
.tab-btn.active{color:#fff}
.tab-btn[data-tab=home].active{background:rgba(34,211,238,.15);color:var(--accent)}
.tab-btn[data-tab=m1].active,.tab-btn[data-tab=m2].active,.tab-btn[data-tab=m6].active{background:rgba(167,139,250,.15);color:var(--purple)}
.tab-btn[data-tab=m3].active,.tab-btn[data-tab=m4].active,.tab-btn[data-tab=m8].active{background:rgba(251,146,60,.15);color:var(--orange)}
.tab-btn[data-tab=m5].active{background:rgba(34,211,238,.15);color:var(--accent)}
.tab-btn[data-tab=m7].active{background:rgba(244,114,182,.15);color:var(--pink)}
.tab-btn[data-tab=exo].active{background:rgba(52,211,153,.15);color:var(--green)}
.tab-btn[data-tab=prog].active{background:rgba(251,191,36,.15);color:var(--gold)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem .75rem;cursor:pointer;transition:all .15s;line-height:1.5}
.mod-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
.mod-card .num{font-size:.6rem;font-weight:700;letter-spacing:.5px;opacity:.7}
.mod-card .titre{font-size:.85rem;font-weight:700;color:#f1f5f9}
.mod-card .desc{font-size:.72rem;color:var(--text2);margin-top:2px}
.mod-card.b-p{border-left:3px solid var(--purple)}
.mod-card.b-o{border-left:3px solid var(--orange)}
.mod-card.b-c{border-left:3px solid var(--accent)}
.mod-card.b-pk{border-left:3px solid var(--pink)}
.mod-card.b-g{border-left:3px solid var(--green)}
.mod-card.b-gd{border-left:3px solid var(--gold)}
.access-box{background:rgba(34,211,238,.04);border:1px dashed rgba(34,211,238,.2);border-radius:8px;padding:.5rem .65rem;margin:.3rem 0 .5rem;font-size:.82rem;line-height:1.6}
.access-box b{color:var(--accent)}
.progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px}
ul{list-style:none;padding:0}
ul li{padding:6px 0;font-size:.85rem;color:var(--text2);cursor:pointer;border-radius:6px;transition:background .1s}
ul li:hover{background:rgba(255,255,255,.04)}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:3rem">Chargement...</div></div>
<nav class="tab-bar" id="tab-bar">
<button class="tab-btn active" data-tab="home" onclick="go(this)">Accueil</button>
<button class="tab-btn" data-tab="m1" onclick="go(this)">M1 OSI</button>
<button class="tab-btn" data-tab="m2" onclick="go(this)">M2 IP</button>
<button class="tab-btn" data-tab="m3" onclick="go(this)">M3 Win</button>
<button class="tab-btn" data-tab="m4" onclick="go(this)">M4 Linux</button>
<button class="tab-btn" data-tab="m5" onclick="go(this)">M5 Reseau</button>
<button class="tab-btn" data-tab="m6" onclick="go(this)">M6 Services</button>
<button class="tab-btn" data-tab="m7" onclick="go(this)">M7 Securite</button>
<button class="tab-btn" data-tab="m8" onclick="go(this)">M8 Script</button>
<button class="tab-btn" data-tab="exo" onclick="go(this)">Exercices</button>
<button class="tab-btn" data-tab="prog" onclick="go(this)">Progres</button>
</nav>
<script>
var C={};
C.home=["Naviguer dans les 8 modules TSRS","Cocher les cases au fil de la progression","Faire les 12 exercices pratiques","Decouvrir les commandes CMD et Linux","Comprendre le modele OSI et les classes IP"];
C.m1=["7 couches: Application,Presentation,Session,Transport,Reseau,Liaison,Physique","Encapsulation = chaque couche ajoute son entete","TCP = fiable / UDP = rapide","Mnemo: Please Do Not Throw Sausage Pizza Away"];
C.m2=["Binaire = 0 et 1. 1 octet = 8 bits","IPv4 = 4 nombres 0-255 separes par .","Masque = separe reseau (ex:/24) de la machine","Classe A /8, B /16, C /24","CIDR = /24 = 255.255.255.0","Reseau=1ere adresse, Broadcast=derniere, Gateway=porte"];
C.m3=["VMware = logiciel de machines virtuelles (PC dans PC)","Cmd: dir,cd,mkdir,copy,del,ipconfig,ping","NTFS (perm.), FAT32 (compat.), exFAT (USB)","Admin vs Standard. net user pour gerer","Permissions: Lecture R, Ecriture W, Execution X","Pare-feu: filtre entrant/sortant","PowerShell: Get-Process,Get-Service,Get-ChildItem"];
C.m4=["Arborescence: /bin,/etc,/home,/var,/tmp,/dev","Commandes: ls,cd,pwd,mkdir,rm,cp,mv,cat","Permissions: rwx r-x r--. chmod 755","Pipes: | envoie sortie a autre commande","Paquets: apt install/update/upgrade","Processus: ps,top,kill","Cron: crontab -e pour planifier"];
C.m5=["Switch c2: relie PC, adresse MAC","Routeur c3: relie reseaux, IP, routage","VLAN = decouper switch en reseaux isoles","Routage statique (ecrit) / dynamique (OSPF)","Cisco IOS: enable,conf t,show run","Packet Tracer = simulateur gratuit"];
C.m6=["Active Directory = annuaire centralise","DHCP = distribue IP auto","DNS = traduit noms en IP","GPO = regles appliquees aux PC","Apache: /var/www/html/, PHP+MySQL","NFS (Linux) / Samba (Linux-Win)"];
C.m7=["CIA: Confidentialite,Integrite,Disponibilite","Menaces: Phishing,Ransomware,DDOS","Pare-feu + DMZ = protection","VPN = tunnel chiffre pour acces distant","Regle 3-2-1: 3 copies,2 supports,1 hors-site","Cloud: SaaS, PaaS, IaaS"];
C.m8=["Bash: variables,if,for,chmod +x","PowerShell: Get-Process,Get-Service","Script: #!/bin/bash, echo, read"];
C.exo=["ipconfig: voir mon IP","ping google.fr: tester Internet","tracert: voir le chemin","nslookup: IP d un site","CMD: mkdir,cd,echo,type","Get-Process / Get-Service","VMware + installer Ubuntu","Linux: ls,cd,pwd,mkdir,cp,mv","Installer un logiciel (apt)","Premier script Bash","Packet Tracer: 2 PC + switch","Wireshark: capturer DNS","Faire les 12 exercices"];
var P={};
function lp(){try{var d=localStorage.getItem("p");if(d)P=JSON.parse(d)}catch(e){}}
function sp(){try{localStorage.setItem("p",JSON.stringify(P))}catch(e){}}
function tg(s,i){if(!P[s])P[s]=[];var a=P[s],p=a.indexOf(i);p>=0?a.splice(p,1):a.push(i);sp();render();}
function cl(s){var it=C[s],sv=P[s]||[],h="<h2>Checklist</h2><ul>";for(var i=0;i<it.length;i++){var d=sv.indexOf(i)>=0;h+='<li onclick="tg(\\"'+s+'\\",'+i+')" style="cursor:pointer;padding:3px 0;font-size:.73rem;color:var(--text2);'+(d?"text-decoration:line-through;opacity:.5":"")+'">'+(d?"O":".")+" "+it[i]+"</li>";}return h+"</ul>";}
function st(){var t=0,d=0;for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++;}}return{d:d,t:t,p:t>0?Math.round(d/t*100):0};}
function home(){var s=st();var mods=[
  {t:"m1",n:"M1",l:"Modele OSI",d:"Les 7 couches de A a P",c:"b-p"},
  {t:"m2",n:"M2",l:"Unites et IPv4",d:"Binaire, classes A/B/C, masque",c:"b-p"},
  {t:"m3",n:"M3",l:"Windows",d:"CMD, NTFS, Admin, Pare-feu",c:"b-o"},
  {t:"m4",n:"M4",l:"Linux",d:"Ubuntu, commandes, permissions",c:"b-o"},
  {t:"m5",n:"M5",l:"Reseau",d:"Switch, routeur, Cisco IOS",c:"b-c"},
  {t:"m6",n:"M6",l:"Services",d:"AD, DHCP, DNS, GPO",c:"b-p"},
  {t:"m7",n:"M7",l:"Securite",d:"CIA, menaces, VPN, pare-feu",c:"b-pk"},
  {t:"m8",n:"M8",l:"Script",d:"Bash, PowerShell, variables",c:"b-o"}
];var h="<h1>TSRS Programme</h1><p>Formation BAC+2 EXPERNET Campus Mayotte.</p><div class=card><span style=font-size:.9rem>"+s.d+"/"+s.t+" acquis ("+s.p+"%)</span><div class=progress><div class=progress-fill style=width:"+s.p+"%></div></div></div><div class=home-grid>";for(var i=0;i<mods.length;i++){var m=mods[i];h+="<div class='mod-card "+m.c+"' onclick='goTab(\""+m.t+"\")'><div class=num>"+m.n+"</div><div class=titre>"+m.l+"</div><div class=desc>"+m.d+"</div></div>";}h+="</div>";return h+cl("home");}

function m1(){
  var h="<h1>M1 — Modele OSI <span class=tag>7 layers</span></h1>";
  h+="<div class=card><b>C'est quoi le modele OSI ?</b> Imagine un colis postal. Tu ecris une lettre <span class=tag>Application</span>, tu la mets dans une enveloppe <span class=tag>Presentation</span>, tu la fermes <span class=tag>Session</span>, tu choisis le transport <span class=tag>Transport</span>, ecris l'adresse <span class=tag>Network</span>, mets dans un camion <span class=tag>Data Link</span>, et le camion roule <span class=tag>Physical</span>. Chaque etape ajoute quelque chose. C'est pareil pour le reseau : 7 couches qui emballent les donnees.</div>";
  h+="<div class='box box-def'><b>7-Application</b> <span class=tag>Application</span> : La couche que l'utilisateur voit. Logiciels : <b>HTTP</b> (web), <b>SMTP</b> (email), <b>FTP</b> (transfert fichiers), <b>DNS</b> (noms de domaine). Exemple : Tu ouvres Chrome et tapes google.fr => HTTP s'active.</div>";
  h+="<div class='box box-def'><b>6-Presentation</b> <span class=tag>Presentation</span> : Traduit les donnees pour que l'ordinateur les comprenne. <b>Chiffrement SSL/TLS</b> (le cadenas dans le navigateur), compression, format <b>JPEG</b>/MP3. Exemple : Quand tu vois https://, c'est la couche 6 qui chiffre.</div>";
  h+="<div class='box box-def'><b>5-Session</b> <span class=tag>Session</span> : Ouvre, maintient et ferme la connexion entre deux machines. Comme un coup de telephone : tu decroches (ouverture), tu parles (maintien), tu raccroches (fermeture).</div>";
  h+="<div class='box box-def'><b>4-Transport</b> <span class=tag>Transport</span> : Decoupe les donnees en segments et choisit le mode de transport.<br><b>TCP</b> = fiable mais lent. Verifie que tout est arrive. Comme une lettre recommandee.<br><b>UDP</b> = rapide mais pas de verification. Comme un SMS perdu possible. Utilise pour le streaming video.</div>";
  h+="<div class='box box-def'><b>3-Reseau</b> <span class=tag>Network</span> : Trouve le chemin jusqu'a destination. Utilise les <b>adresses IP</b>. Le routeur travaille ici. Comme le facteur qui lit l'adresse et choisit la route.</div>";
  h+="<div class='box box-def'><b>2-Liaison</b> <span class=tag>Data Link</span> : S'occupe de la communication entre deux machines voisines. Utilise les <b>adresses MAC</b>. Le switch travaille ici. Trames = paquets de cette couche.</div>";
  h+="<div class='box box-def'><b>1-Physique</b> <span class=tag>Physical</span> : Les cables, fibres optiques, ondes WiFi, signaux electriques. Le materiel brut. Bits = 0 et 1 qui circulent.</div>";
  h+="<div class='box box-info'><b>Encapsulation :</b> Chaque couche AJOUTE son en-tete au paquet. Comme une poupee russe : couche 4 ajoute son en-tete, puis couche 3 ajoute le sien, etc. A la reception, chaque couche enleve son en-tete.<br><b>Mnemo :</b> Please Do Not Throw Sausage Pizza Away <span class=tag>PDNTSPA</span></div>";
  h+="<div class='box box-warn'><b>TCP vs UDP (a retenir) :</b> <b>TCP</b> = connexion d'abord, accuse reception, retransmet si perdu. Comme lettre recommandee. <b>UDP</b> = envoi direct, pas d'accuse, continue meme si perte. Comme SMS.<br>Exemple concret : TCP pour telecharger un fichier (fichier corrompu interdit). UDP pour regarder une video en direct (une image sautee est mieux qu'un buffering).</div>";
  return h+cl("m1");
}

function m2(){
  var h="<h1>M2 — Unites, Binaire et IPv4</h1>";
  h+="<div class=card><b>Binaire :</b> Le langage des ordinateurs. Seulement 2 chiffres : <b>0 et 1</b> (comme un interrupteur <span class=tag>on/off</span>).<br><b>1 bit</b> = 0 ou 1. <b>1 octet</b> <span class=tag>byte</span> = 8 bits = 256 valeurs possibles (de 0 a 255).<br>Pour convertir : 128+64+32+16+8+4+2+1. Exemple : 11000000 = 128+64 = <b>192</b>. 10101000 = 128+32+8 = <b>168</b>.</div>";
  h+="<div class=card><b>IPv4 :</b> 4 nombres separes par des points, chaque nombre entre 0 et 255. <b>32 bits</b> au total.<br>Exemple : <b>192.168.1.10</b> = 11000000.10101000.00000001.00001010 en binaire.<br>Il y a environ 4 milliards d'adresses IPv4 possibles (32 bits = 2^32 = 4 294 967 296).</div>";
  h+="<div class=card><b>Masque de sous-reseau <span class=tag>subnet mask</span> :</b> Separe l'adresse en 2 parties : <b>RESEAU</b> (la rue) et <b>MACHINE</b> (le numero de maison).<br><b>/24</b> = 255.255.255.0 = les 3 premiers nombres = le reseau, le dernier = la machine.<br>Exemple : IP 192.168.1.10 avec masque /24 => reseau = 192.168.1, machine = 10.</div>";
  h+="<div class='box box-def'><b>Classe A</b> /8 : De 1.0.0.0 a 126.255.255.255. <b>16 millions</b> de machines par reseau. Pour les tres grandes entreprises (Google, Amazon). Masque = 255.0.0.0.</div>";
  h+="<div class='box box-def'><b>Classe B</b> /16 : De 128.0.0.0 a 191.255.255.255. <b>65 534</b> machines par reseau. Pour les moyennes entreprises. Masque = 255.255.0.0.</div>";
  h+="<div class='box box-def'><b>Classe C</b> /24 : De 192.0.0.0 a 223.255.255.255. <b>254</b> machines par reseau. Usage courant (maison, petite entreprise). Masque = 255.255.255.0.</div>";
  h+="<div class='box box-def'><b>CIDR</b> <span class=tag>Classless Inter-Domain Routing</span> : Notation moderne. /24 = 255.255.255.0, /16 = 255.255.0.0, /8 = 255.0.0.0. Plus le nombre est petit, plus le reseau est grand.</div>";
  h+="<div class='box box-warn'><b>A retenir absolument :</b><br><b>Adresse reseau</b> <span class=tag>Network ID</span> = la premiere adresse (bits machine a 0). Ex: 192.168.1.0<br><b>Broadcast</b> <span class=tag>Broadcast</span> = la derniere adresse (bits machine a 1). Ex: 192.168.1.255<br><b>Gateway</b> <span class=tag>Gateway</span> = la porte vers Internet. Ex: 192.168.1.1<br>Les adresses utilisables pour les PC sont entre la premiere (reseau) et la derniere (broadcast).</div>";
  h+="<div class='box box-g'><b>Exercice pratique :</b> Pour 192.168.1.0/24, combien de machines ? 254 (2^8 - 2). Adresse de broadcast ? 192.168.1.255. Gateway typique ? 192.168.1.1.</div>";
  return h+cl("m2");
}

function m3(){
  var h="<h1>M3 — Windows <span class=tag>Client & Server</span></h1>";
  h+="<div class=card><b>VMware</b> <span class=tag>Virtual Machine</span> : Logiciel qui cree un PC virtuel dans votre PC. Comme un jeu video qui simule un ordinateur complet. Utile pour tester Windows Server sans avoir un 2e PC.</div>";
  h+="<div class='box box-cmd'><b>CMD</b> <span class=tag>Command Prompt</span> : L'ancetre du terminal Windows.<br><b>dir</b> = liste les fichiers<br><b>cd</b> = change de dossier<br><b>mkdir</b> = cree un dossier<br><b>copy</b> = copie un fichier<br><b>del</b> = supprime un fichier<br><b>ipconfig</b> = voir son IP<br><b>ping</b> = tester si une machine repond</div>";
  h+="<div class='box box-def'><b>NTFS</b> <span class=tag>New Technology File System</span> : Moderne, permet les permissions, crypter, compresser. Utilise par Windows depuis 20 ans.<br><b>FAT32</b> : Ancien, compatible partout (USB, appareils photo) mais fichier max 4 Go.<br><b>exFAT</b> : Moderne, compatible, pas de limite 4 Go. Ideal pour grosses cles USB.</div>";
  h+="<div class='box box-g'><b>Utilisateurs :</b> <b>Administrateur</b> <span class=tag>Admin</span> = controle total du PC. <b>Standard</b> <span class=tag>User</span> = utilisateur normal, ne peut pas installer de logiciel. Commande: <b>net user</b> pour gerer les comptes.</div>";
  h+="<div class='box box-def'><b>Permissions NTFS :</b> <b>R</b> <span class=tag>Read</span> = Lecture. <b>W</b> <span class=tag>Write</span> = Ecriture. <b>X</b> <span class=tag>eXecute</span> = Execution, peut lancer le programme.</div>";
  h+="<div class='box box-g'><b>Pare-feu Windows</b> <span class=tag>Firewall</span> : Filtre ce qui entre et sort du PC. Regle: autoriser ou bloquer un programme. Exemple: bloquer un jeu qui veut aller sur Internet.</div>";
  h+="<div class='box box-info'><b>PowerShell :</b> La version moderne de CMD. Plus puissant. <b>Get-Process</b> = liste les programmes en cours. <b>Get-Service</b> = liste les services. <b>Get-ChildItem</b> = equivalent de dir.</div>";
  return h+cl("m3");
}

function m4(){
  var h="<h1>M4 — Linux <span class=tag>Ubuntu / Debian</span></h1>";
  h+="<div class=card><b>Arborescence <span class=tag>Filesystem</span> :</b> Tout part de / (racine). <b>/bin</b> = programmes essentiels. <b>/etc</b> = fichiers de configuration. <b>/home</b> = dossiers des utilisateurs. <b>/var</b> = donnees variables <span class=tag>logs</span>. <b>/tmp</b> = fichiers temporaires. <b>/dev</b> = peripheriques (disques, ports).</div>";
  h+="<div class='box box-cmd'><b>Commandes de base :</b><br><b>ls</b> <span class=tag>list</span> = lister fichiers<br><b>cd</b> <span class=tag>change directory</span> = changer dossier<br><b>pwd</b> <span class=tag>print working directory</span> = afficher dossier actuel<br><b>mkdir</b> <span class=tag>make directory</span> = creer dossier<br><b>rm</b> <span class=tag>remove</span> = supprimer<br><b>cp</b> <span class=tag>copy</span> = copier<br><b>mv</b> <span class=tag>move</span> = deplacer/renommer<br><b>cat</b> <span class=tag>concatenate</span> = afficher contenu fichier</div>";
  h+="<div class='box box-def'><b>Permissions Linux <span class=tag>rwx</span> :</b> 3 groupes : <b>rwx</b> pour le proprio, <b>r-x</b> pour le groupe, <b>r--</b> pour les autres.<br>Chiffres : r=4, w=2, x=1. <b>chmod 755</b> = proprio peut tout (7), groupe peut lire+exec (5), autres peuvent lire+exec (5).</div>";
  h+="<div class='box box-cmd'><b>Pipe |</b> <span class=tag>pipe</span> : Envoie la sortie d'une commande a une autre. Exemple: <b>ls | grep .txt</b> = liste seulement les fichiers .txt. Comme un tuyau qui relie deux commandes.</div>";
  h+="<div class='box box-cmd'><b>Gestionnaire de paquets apt</b> <span class=tag>package manager</span> : L'App Store de Linux. <b>apt install</b> = installer. <b>apt update</b> = mettre a jour la liste. <b>apt upgrade</b> = mettre a jour les logiciels.</div>";
  h+="<div class='box box-cmd'><b>Processus :</b> <b>ps</b> <span class=tag>process status</span> = liste les processus. <b>top</b> <span class=tag>table of processes</span> = tableau interactif. <b>kill</b> = arreter un processus (kill 1234).</div>";
  h+="<div class='box box-info'><b>Cron</b> <span class=tag>scheduler</span> : Planificateur de taches. <b>crontab -e</b> = editer les taches. Exemple: <b>0 2 * * * /script.sh</b> = lance le script tous les jours a 2h du matin.</div>";
  return h+cl("m4");
}

function m5(){
  var h="<h1>M5 — Reseau <span class=tag>Equipements Cisco</span></h1>";
  h+="<div class='box box-def'><b>Switch</b> <span class=tag>couche 2 / Data Link</span> : Relie les PC entre eux dans le meme reseau. Utilise les <b>adresses MAC</b> (adresse physique unique de la carte reseau). Table MAC = le switch sait quel PC est a quel port.</div>";
  h+="<div class='box box-def'><b>Routeur</b> <span class=tag>couche 3 / Network</span> : Relie differents reseaux entre eux. Utilise les <b>adresses IP</b>. Table de routage <span class=tag>routing table</span> = le routeur sait par ou envoyer les paquets.</div>";
  h+="<div class='box box-def'><b>VLAN</b> <span class=tag>Virtual LAN</span> : Decoupe un switch physique en plusieurs reseaux isoles. Exemple: VLAN 10 = profs, VLAN 20 = eleves. Meme switch, mais ils ne se voient pas.</div>";
  h+="<div class='box box-g'><b>Routage :</b> <b>Statique</b> <span class=tag>static</span> = l'admin ecrit les routes a la main. Simple mais ne s'adapte pas.<br><b>Dynamique</b> <span class=tag>OSPF</span> = les routeurs parlent entre eux et trouvent le meilleur chemin automatiquement.</div>";
  h+="<div class='box box-cmd'><b>Cisco IOS</b> <span class=tag>Internetwork Operating System</span> : L'OS des routeurs Cisco. <b>enable</b> = mode admin. <b>conf t</b> = configuration terminal. <b>show run</b> = afficher la configuration.</div>";
  h+="<div class='box box-info'><b>Packet Tracer</b> <span class=tag>simulateur Cisco</span> : Simulateur gratuit. Permet de construire un reseau entier sur PC sans materiel. Ideal pour s'entrainer aux examens.</div>";
  return h+cl("m5");
}

function m6(){
  var h="<h1>M6 — Services Reseau</h1>";
  h+="<div class='box box-def'><b>Active Directory</b> <span class=tag>AD</span> : Annuaire centralise de Microsoft. Stocke tous les utilisateurs, ordinateurs, groupes d'une entreprise. Un admin cree un compte = accessible sur tous les PC du domaine.</div>";
  h+="<div class='box box-def'><b>DHCP</b> <span class=tag>Dynamic Host Configuration Protocol</span> : Distribue automatiquement les adresses IP aux PC. Plus besoin de configurer chaque PC a la main. Le serveur donne: IP, masque, passerelle, DNS.</div>";
  h+="<div class='box box-def'><b>DNS</b> <span class=tag>Domain Name System</span> : Traduit les noms de sites (google.fr) en adresses IP (142.250.xxx.xxx). Comme un annuaire telephonique d'Internet.</div>";
  h+="<div class='box box-def'><b>GPO</b> <span class=tag>Group Policy Objects</span> : Regles appliquees aux PC du domaine. Exemple: interdire l'acces au Panneau de configuration pour les eleves, imposer un fond d'ecran.</div>";
  h+="<div class='box box-g'><b>Apache</b> <span class=tag>serveur HTTP</span> : Serveur web libre. Fichiers stockes dans <b>/var/www/html/</b>. Marche avec <b>PHP</b> et <b>MySQL</b>.</div>";
  h+="<div class='box box-info'><b>Partage de fichiers :</b> <b>NFS</b> <span class=tag>Network File System</span> = partage entre Linux. <b>Samba</b> <span class=tag>SMB/CIFS</span> = partage entre Linux et Windows. Les deux permettent de monter un dossier distant comme s'il etait local.</div>";
  return h+cl("m6");
}

function m7(){
  var h="<h1>M7 — Securite des Systemes</h1>";
  h+="<div class='box box-def'><b>Triade CIA</b> <span class=tag>Confidentiality, Integrity, Availability</span> : Les 3 piliers de la securite.<br><b>C</b> (Confidentialite) = seul l'autorise lit les donnees. Chiffrement.<br><b>I</b> (Integrite) = les donnees ne sont pas modifiees par erreur.<br><b>A</b> (Disponibilite) = le service est accessible quand on en a besoin.</div>";
  h+="<div class='box box-warn'><b>Menaces courantes :</b><br><b>Phishing</b> <span class=tag>hameconnage</span> = faux email qui vole vos mots de passe.<br><b>Ransomware</b> <span class=tag>rancon</span> = virus qui chiffre vos fichiers et demande une rancon.<br><b>DDOS</b> <span class=tag>Distributed Denial of Service</span> = des milliers de machines attaquent un site pour le faire planter.</div>";
  h+="<div class='box box-g'><b>Pare-feu + DMZ :</b> <b>Pare-feu</b> <span class=tag>Firewall</span> = mur entre Internet et le reseau interne. <b>DMZ</b> <span class=tag>Demilitarized Zone</span> = zone isolee ou on place les serveurs publics (web, mail). Si un serveur est pirate, le reseau interne reste protege.</div>";
  h+="<div class='box box-def'><b>VPN</b> <span class=tag>Virtual Private Network</span> : Tunnel chiffre entre votre PC et le reseau de l'entreprise. Comme si vous etiez connecte en direct dans le bureau, meme depuis chez vous. Utile pour le teletravail.</div>";
  h+="<div class='box box-warn'><b>Regle 3-2-1</b> <span class=tag>backup</span> : <b>3</b> copies de vos donnees, sur <b>2</b> supports differents (disque dur + cloud), dont <b>1</b> hors-site (dans un autre batiment).</div>";
  h+="<div class='box box-info'><b>Cloud :</b> <b>SaaS</b> <span class=tag>Software as a Service</span> (Gmail, Office 365). <b>PaaS</b> <span class=tag>Platform as a Service</span> (Heroku). <b>IaaS</b> <span class=tag>Infrastructure as a Service</span> (AWS, Azure).</div>";
  return h+cl("m7");
}

function m8(){
  var h="<h1>M8 — Script <span class=tag>Bash & PowerShell</span></h1>";
  h+="<div class=card><b>Script Bash</b> <span class=tag>.sh</span> : Fichier qui contient des commandes Linux. Commence par <b>#!/bin/bash</b> (<span class=tag>shebang</span>). Se lance avec <b>./script.sh</b> apres <b>chmod +x</b>.</div>";
  h+="<div class='box box-cmd'><b>Variables Bash :</b> <b>nom=\"Toto\"</b> puis <b>echo $nom</b> affiche Toto. <b>read prenom</b> attend que l'utilisateur tape quelque chose.</div>";
  h+="<div class='box box-cmd'><b>Conditions <span class=tag>if/else</span> :</b> <br>if [ \"$var\" = \"oui\" ]; then<br>  echo \"OK\"<br>else<br>  echo \"Non\"<br>fi</div>";
  h+="<div class='box box-cmd'><b>Boucle <span class=tag>for loop</span> :</b> <br>for i in 1 2 3; do<br>  echo \"Tour $i\"<br>done</div>";
  h+="<div class='box box-cmd'><b>PowerShell</b> <span class=tag>.ps1</span> : <b>Get-Process</b> = processus en cours. <b>Get-Service</b> = services Windows. <b>Get-ChildItem</b> = lister fichiers. <b>Select-Object</b> = filtrer colonnes. <b>Where-Object</b> = filtrer lignes.</div>";
  h+="<div class='box box-warn'><b>Astuce :</b> <b>chmod +x script.sh</b> rend le script executable. <b>./script.sh</b> le lance. <b>nano script.sh</b> edite le fichier. Toujours tester avec des petites donnees d'abord.</div>";
  return h+cl("m8");
}

function exo(){
  var h="<h1>Exercices Pratiques <span class=tag>pas a pas</span></h1>";
  h+="<div class=card><b>Comment utiliser cette page ?</b> Chaque exercice est classe par outil necessaire. <b>Sans outil</b> = directement depuis Windows. <b>Avec outil</b> = il faut installer un logiciel gratuit. Suis les etapes dans l ordre.</div>";
  h+="<h2>Sans outil CMD (Windows) <span class=tag>deja pret</span></h2>";
  h+="<div class=card><b>Ouvrir CMD :</b> Appuie sur la touche Windows, tape <b>cmd</b> ou Invite de commandes, appuie sur Entree. Tu vois une fenetre noire. C est la.</div>";
  h+="<div class='access-box'>💻 <b>Raccourci clavier :</b> <b>Windows + R</b>, tape <b>cmd</b>, Entree. Ou cherche <b>CMD</b> dans le menu Demarrer.</div>";
  h+="<div class='box box-cmd'><b>Exercice 1 ipconfig</b> (voir son adresse IP)<br>Dans CMD, tape : <b>ipconfig</b> et appuie sur Entree.<br>Tu vois des infos. Cherche la ligne <b>Adresse IPv4</b>. Elle ressemble a 192.168.x.x ou 10.x.x.x.<br><b>Ca veut dire quoi ?</b> C est l adresse de ton PC sur le reseau local, comme le numero de ta maison dans la rue.</div>";
  h+="<div class='box box-cmd'><b>Exercice 2 ping</b> (tester si un site repond)<br>Tape : <b>ping google.fr</b> et Entree.<br>Tu vois des lignes avec <b>reponse de</b> ou Reply from. Si tu vois ca, la connexion marche.<br><b>Ca veut dire quoi ?</b> Ton PC a envoye 4 petits paquets a Google et Google a repondu. Le temps (ms) = rapidite.</div>";
  h+="<div class='box box-warn'><b>Piege :</b> Si tu vois <b>Delai d attente depasse</b>, le site ne repond pas. Teste avec <b>ping 8.8.8.8</b> (serveur Google).</div>";
  h+="<div class='box box-cmd'><b>Exercice 3 tracert</b> (voir le chemin jusqu a un site)<br>Tape : <b>tracert google.fr</b> et Entree.<br>Tu vois une liste de sauts (hop). Chaque ligne = un routeur traverse.<br><b>Exemple :</b> Saut 1 = ta box, saut 2 = ton FAI, saut 10 = Google.<br><b>A quoi ca sert ?</b> Si un site est lent, tu vois quel saut ralentit tout.</div>";
  h+="<div class='box box-cmd'><b>Exercice 4 nslookup</b> (trouver l IP d un site)<br>Tape : <b>nslookup google.fr</b> et Entree.<br>Tu vois <b>Addresses</b> avec des chiffres. C est l IP de Google.<br><b>Ca veut dire quoi ?</b> Le DNS a traduit google.fr en adresse IP que l ordinateur comprend.</div>";
  h+="<h2>Sans outil Fichiers et dossiers (CMD)</h2>";
  h+="<div class='box box-cmd'><b>Exercice 5 Naviguer dans les dossiers</b><br>1. Tape <b>cd Desktop</b> (va sur le Bureau)<br>2. Tape <b>mkdir MonDossier</b> (cree un dossier)<br>3. Tape <b>cd MonDossier</b> (entre dedans)<br>4. Tape <b>echo Bonjour > test.txt</b> (cree un fichier avec le mot Bonjour)<br>5. Tape <b>type test.txt</b> (affiche le contenu)<br>6. Tape <b>cd ..</b> (retour au dossier parent)<br>7. Tape <b>dir</b> (voir le contenu du dossier actuel)<br><b>A retenir :</b> dir = lister, cd = changer, mkdir = creer, type = afficher.</div>";
  h+="<h2>Sans outil PowerShell</h2>";
  h+="<div class=card><b>Ouvrir PowerShell :</b> Touche Windows, tape <b>PowerShell</b>, Entree. Interface bleue au lieu de noire.</div>";
  h+="<div class='access-box'>💻 <b>Raccourci :</b> Clic droit sur le menu Demarrer > <b>Windows PowerShell</b>. Ou cherche <b>PowerShell</b> dans la recherche Windows.</div>";
  h+="<div class='box box-cmd'><b>Exercice 6 Get-Process et Get-Service</b><br>Tape : <b>Get-Process</b> et Entree = liste des programmes en cours. Cherche chrome ou notepad.<br>Tape : <b>Get-Service</b> et Entree = tous les services Windows. Colonne Status = Running ou Stopped.<br><b>Astuce :</b> Get-Process | Where-Object {$_.CPU -gt 50} = seulement les processus qui utilisent beaucoup de CPU.</div>";
  h+="<h2>Avec outil VMware <span class=tag>gratuit</span></h2>";
  h+="<div class=card><b>Installation :</b> Va sur vmware.com, telecharge <b>VMware Workstation Player</b> (gratuit). Installe-le. Telecharge aussi Ubuntu Desktop (ubuntu.com/download).</div>";
  h+="<div class='access-box'>💻 <b>Ouvrir VMware :</b> Une fois installe, cherche <b>VMware Player</b> dans le menu Demarrer. Double-clique pour lancer.</div>";
  h+="<div class='box box-cmd'><b>Exercice 7 Installer Ubuntu dans VMware</b><br>1. Ouvre VMware Player, clique sur <b>Create a New Virtual Machine</b><br>2. Choisis le fichier ISO d Ubuntu que tu as telecharge<br>3. Donne un nom (Ubuntu), laisse les options par defaut (20 Go disque, 2 Go RAM)<br>4. Clique Finish, puis <b>Power on</b><br>5. Suis les instructions a l ecran pour installer Ubuntu (c est comme installer un nouveau PC)<br>6. Une fois installe, tu as un vrai Linux dans une fenetre !</div>";
  h+="<h2>Avec outil Ubuntu (Linux en vrai)</h2>";
  h+="<div class='access-box'>💻 <b>Ouvrir le terminal :</b> Dans Ubuntu, fais <b>Ctrl + Alt + T</b>. Ou clique sur l icone <b>Terminal</b> dans la barre de gauche.</div>";
  h+="<div class='box box-cmd'><b>Exercice 8 Premieres commandes Linux</b><br>Ouvre le terminal (clic droit > Ouvrir un terminal). Tape :<br><b>ls</b> = voir les fichiers<br><b>pwd</b> = voir ou on est (/home/tonnom)<br><b>mkdir essai</b> = creer un dossier<br><b>cd essai</b> = entrer dedans<br><b>touch toto.txt</b> = creer un fichier vide<br><b>cp toto.txt toto2.txt</b> = copier<br><b>mv toto2.txt backup.txt</b> = renommer<br><b>cat backup.txt</b> = afficher le contenu</div>";
  h+="<div class='box box-cmd'><b>Exercice 9 Installer un logiciel (apt)</b><br>Tape : <b>sudo apt update</b> (met a jour la liste des paquets. Sudo = super admin, tape ton mot de passe)<br>Puis : <b>sudo apt install neofetch</b> (installe le logiciel neofetch)<br>Puis : <b>neofetch</b> (affiche les infos de ton systeme Linux avec un logo colorie)</div>";
  h+="<h2>Avec outil Script Bash</h2>";
  h+="<div class='box box-cmd'><b>Exercice 10 Creer son premier script</b><br>1. Tape <b>nano mon_script.sh</b> (ouvre l editeur nano)<br>2. Ecrit ces lignes :<br>#!/bin/bash<br>echo Quel est ton nom ?<br>read nom<br>echo Bonjour $nom !<br>3. Ctrl+X pour quitter, O pour sauvegarder, Entree<br>4. Tape <b>chmod +x mon_script.sh</b> (rend le script executable)<br>5. Tape <b>./mon_script.sh</b> (lance le script)</div>";
  h+="<h2>Avec outil Packet Tracer <span class=tag>gratuit Cisco</span></h2>";
  h+="<div class=card><b>Installation :</b> Va sur netacad.com, cree un compte, telecharge <b>Cisco Packet Tracer</b> (gratuit pour etudiants). Installe-le.</div>";
  h+="<div class='access-box'>💻 <b>Ouvrir Packet Tracer :</b> Cherche <b>Packet Tracer</b> dans le menu Demarrer. L icone est un globe avec un cable reseau.</div>";
  h+="<div class='box box-cmd'><b>Exercice 11 2 PC + Switch + Ping</b><br>1. Ouvre Packet Tracer<br>2. Glisse 2 PC (End Devices > PC) sur le schema<br>3. Glisse 1 Switch (Switches > 2960)<br>4. Relie chaque PC au switch (Connections > Copper Straight-Through, clique PC puis switch)<br>5. Clique sur un PC > Desktop > IP Configuration. Donne IP 192.168.1.1 masque 255.255.255.0<br>6. Donne a l autre PC IP 192.168.1.2 masque 255.255.255.0<br>7. Dans un PC, va dans Desktop > Command Prompt, tape <b>ping 192.168.1.2</b><br>8. Si tu vois <b>Reply</b>, les deux PC communiquent !</div>";
  h+="<h2>Avec outil Wireshark <span class=tag>gratuit</span></h2>";
  h+="<div class=card><b>Installation :</b> Telecharge <b>Wireshark</b> sur wireshark.org. Installe-le. Attention : il faut installer Npcap aussi (coche la case pendant l install).</div>";
  h+="<div class='access-box'>💻 <b>Ouvrir Wireshark :</b> Cherche <b>Wireshark</b> dans le menu Demarrer. Fais <b>clic droit > Run as Administrator</b> pour capturer le reseau.</div>";
  h+="<div class='box box-cmd'><b>Exercice 12 Capturer du traffic DNS</b><br>1. Ouvre Wireshark (clic droit > Run as Administrator)<br>2. Double-clique sur ton interface reseau (celle qui a des graphiques qui bougent)<br>3. Dans la barre de filtre en haut, tape <b>dns</b> et Entree<br>4. Ouvre un navigateur et va sur un site jamais visite (ex: lemonde.fr)<br>5. Regarde Wireshark : tu vois les paquets DNS partis et les reponses arrivees<br>6. Clique sur un paquet pour voir : Query = question, Response = reponse avec l IP<br>7. Arrete la capture avec le carre rouge en haut</div>";
  h+="<div class='box box-warn'><b>Attention :</b> Wireshark capture TOUT ce qui passe sur le reseau. Ne l utilise que sur ton propre reseau. Arrete la capture des que tu as fini.</div>";
  return h+cl("exo");
}
function prog(){var s=st(),h="<h1>Progression</h1><div class=card><b>"+s.d+"/"+s.t+" ("+s.p+"%)</b><div class=progress><div class=progress-fill style=width:"+s.p+"%></div></div></div>";return h;}
var PG={home:home,m1:m1,m2:m2,m3:m3,m4:m4,m5:m5,m6:m6,m7:m7,m8:m8,exo:exo,prog:prog};
var ct="home";
function go(el){ct=el.dataset.tab;render();}
function render(){var a=document.getElementById("app"),fn=PG[ct];if(!fn)fn=PG.home;a.innerHTML=fn();var tb=document.querySelectorAll(".tab-btn");for(var i=0;i<tb.length;i++){tb[i].className="tab-btn"+(tb[i].dataset.tab===ct?" active":"");}}
function goTab(t){ct=t;render();}
lp();try{var t=localStorage.getItem("t");if(t&&PG[t])ct=t;}catch(e){}render();
</script>

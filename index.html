<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>TSRS Revisions — Programme complet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--bg2:#11151c;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--accent2:#0891b2;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--pink:#ec4899;--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 90px}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--accent)}
h3{font-size:.9rem;font-weight:600;margin:.75rem 0 .35rem;color:#f1f5f9}
p,li{font-size:.82rem;color:var(--text2);line-height:1.7}
p b,li b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.6rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:.3rem 0 env(safe-area-inset-bottom,.3rem);overflow-x:auto}
.tab-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.4rem .2rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:8px;font-weight:500;white-space:nowrap}
.tab-btn svg{width:18px;height:18px;opacity:.6}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.08)}
.tab-btn.active svg{opacity:1}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:10px;border:none;font-size:.82rem;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}

.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}

.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.5rem;padding:.25rem 0;font-size:.78rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}

.layer{display:flex;align-items:center;padding:.35rem .6rem;border-radius:6px;font-size:.7rem;font-weight:600;gap:.4rem;margin:2px 0}
.layer .num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0}
.layer .name{width:80px;flex-shrink:0}
.l7{background:rgba(239,68,68,.12);color:#fca5a5}.l7 .num{background:rgba(239,68,68,.3)}
.l6{background:rgba(249,115,22,.12);color:#fdba74}.l6 .num{background:rgba(249,115,22,.3)}
.l5{background:rgba(234,179,8,.12);color:#fde047}.l5 .num{background:rgba(234,179,8,.3)}
.l4{background:rgba(34,197,94,.12);color:#86efac}.l4 .num{background:rgba(34,197,94,.3)}
.l3{background:rgba(6,182,212,.12);color:#67e8f9}.l3 .num{background:rgba(6,182,212,.3)}
.l2{background:rgba(99,102,241,.12);color:#a5b4fc}.l2 .num{background:rgba(99,102,241,.3)}
.l1{background:rgba(168,85,247,.12);color:#d8b4fe}.l1 .num{background:rgba(168,85,247,.3)}

.tag{display:inline-block;padding:.15rem .45rem;border-radius:5px;font-size:.65rem;font-weight:600}
.tag-blue{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-green{background:rgba(16,185,129,.12);color:var(--green)}
.tag-orange{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red)}

.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
@media(max-width:480px){.cmd-grid{grid-template-columns:1fr}}
.cmd-item{background:rgba(0,0,0,.3);border-radius:6px;padding:.3rem .5rem;font-family:monospace;font-size:.72rem}
.cmd-item .c{color:var(--green)}
.cmd-item .d{color:var(--text2);font-size:.62rem;font-family:system-ui,sans-serif;margin-top:.1rem}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:.4rem;margin:.5rem 0}
.stat-card{text-align:center;padding:.5rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.stat-card .val{font-size:1.3rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.65rem;color:var(--text2);margin-top:.1rem}

.box{padding:.5rem .7rem;border-radius:8px;margin:.4rem 0;font-size:.8rem}
.box-info{background:rgba(6,182,212,.06);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.06);border-left:3px solid var(--green)}
.box-orange{background:rgba(245,158,11,.06);border-left:3px solid var(--orange)}

.code{font-family:monospace;font-size:.72rem;background:rgba(0,0,0,.4);padding:.6rem;border-radius:8px;overflow-x:auto;color:var(--green);line-height:1.6;margin:.4rem 0}
.code .gr{color:#6b7280}
.code .bl{color:var(--accent)}
.code .yl{color:var(--orange)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease}
</style>
</head>

<script>
// ============================================================
// DATA
// ============================================================

var OSI = [

  ['6','Presentation','SSL/TLS, JPEG, MPEG','l6'],

var EQUIP = [
  ['Switch','Couche 2','Relie les appareils sur un meme reseau local. Utilise les adresses MAC. Equipement de base.'],
  ['Routeur','Couche 3','Relie differents reseaux (LAN, Internet). Utilise les adresses IP. Essentiel.'],

var CMDS = [

  ['ps','Lister les processus en cours'],

  ['man commande','Afficher le manuel de la commande'],

var CHECKS = {
  home: [
    "Je connais les 7 couches du modele OSI dans l ordre",
    "Je sais convertir une IP en binaire",
    "J ai installe Ubuntu sur VMware",
    "Je sais me deplacer dans Linux avec cd ls pwd",

  ],
  bases: [

    "Je connais les unites (bit, octet, Ko, Mo)"
  ],
  windows: [
    "Je sais ce qu est Active Directory",
    "Je comprends le role de DHCP",
    "Je comprends le role de DNS",
    "Je sais creer des utilisateurs dans AD",
    "Je connais les GPO (strategies de groupe)",
    "Je sais configurer un partage de fichiers",

  ],
  linux: [
    "Je maitrise ls cd cp mv rm",
    "Je gere les permissions (chmod, chown)",
    "J utilise apt pour installer des logiciels",
    "Je gere les processus (ps, top, kill)",
    "Je connais l arborescence Linux",
    "Je sais utiliser grep pour chercher",
    "Je sais rediriger la sortie (|, >)"
  ],
  reseau: [
    "Je sais calculer une adresse reseau et broadcast",
    "Je connais la notation CIDR (/24 = 255.255.255.0)",
    "Je connais les classes IP (A, B, C)",
    "Je sais ce qu est une passerelle (gateway)",
    "Je comprends le routage statique et dynamique",
    "Je sais ce qu est un VLAN",
    "Je comprends le NAT",
    "Je connais les equipements reseau (switch, routeur)"
  ],
  services: [
    "Je configure un serveur DHCP",
    "Je configure un serveur DNS",
    "Je sais ce qu est un serveur web (Apache)",
    "Je connais les bases de GLPI",
    "Je sais ce qu est la supervision (Nagios/Centreon)",
    "Je configure un partage NFS ou Samba"
  ],
  secu: [
    "Je connais le modele CIA (Confidentialite, Integrite, Disponibilite)",
    "Je sais ce qu est un pare-feu et son role",
    "Je comprends le principe du VPN",
    "Je sais ce qu est une DMZ",
    "Je connais les modeles de cloud (SaaS, PaaS, IaaS)",
    "Je cite 3 menaces de cyber-securite"
  ]
};

var PROGRESS = {};
function loadProgress() {
  try { var d = localStorage.getItem('tsrs_p'); if (d) PROGRESS = JSON.parse(d); } catch(e) {}
}
function saveProgress() {
  try { localStorage.setItem('tsrs_p', JSON.stringify(PROGRESS)); } catch(e) {}
}

function toggleCheck(section, idx) {
  if (!PROGRESS[section]) PROGRESS[section] = [];
  var arr = PROGRESS[section];
  var p = arr.indexOf(idx);
  if (p >= 0) arr.splice(p, 1);
  else arr.push(idx);
  saveProgress();
  render();
}

function checklistHTML(section) {
  var items = CHECKS[section];
  if (!items) return '';
  var saved = PROGRESS[section] || [];
  var h = '<ul class="check-list">';
  for (var i = 0; i < items.length; i++) {
    var done = saved.indexOf(i) >= 0;
    h += '<li class="' + (done ? 'done' : '') + '" onclick="toggleCheck(\'' + section + '\',' + i + ')">';
    h += '<input type="checkbox"' + (done ? ' checked' : '') + '> ' + items[i] + '</li>';
  }
  h += '</ul>';
  return h;
}

function getPct() {
  var total = 0, done = 0;
  for (var k in CHECKS) {
    var items = CHECKS[k];
    var saved = PROGRESS[k] || [];
    for (var i = 0; i < items.length; i++) {
      total++;
      if (saved.indexOf(i) >= 0) done++;
    }
  }
  return total > 0 ? Math.round(done / total * 100) : 0;
}

function getDone() {
  var total = 0, done = 0;
  for (var k in CHECKS) {
    var items = CHECKS[k];
    var saved = PROGRESS[k] || [];
    for (var i = 0; i < items.length; i++) {
      total++;
      if (saved.indexOf(i) >= 0) done++;
    }
  }
  return {done: done, total: total};
}

// ============================================================
// PAGES
// ============================================================

function pageHome() {
  var d = getDone();
  var pct = getPct();
  var h = '<div class="page">';
  h += '<div style="text-align:center;padding:1.5rem 0 1rem">';
  h += '<span style="display:inline-block;background:rgba(6,182,212,.1);color:var(--accent);padding:.2rem .8rem;border-radius:20px;font-size:.7rem;font-weight:600;margin-bottom:.5rem">Formation BAC+2 — RNCP Niveau 5</span>';
  h += '<h1>TSRS <span class="gradient">Revisions</span></h1>';
  h += '<p style="font-size:.82rem">Technicien Systemes Reseaux et Securite — Programme complet pour Astoiyous</p>';
  h += '</div>';

  h += '<div class="card" style="text-align:center;padding:.6rem">';
  h += '<div style="display:flex;justify-content:center;gap:1.5rem;font-size:.8rem">';
  h += '<div><strong style="color:var(--accent);font-size:1rem">' + d.done + '</strong><br><span style="color:var(--text2);font-size:.7rem">Acquis</span></div>';
  h += '<div><strong style="color:var(--text);font-size:1rem">' + d.total + '</strong><br><span style="color:var(--text2);font-size:.7rem">A apprendre</span></div>';
  h += '<div><strong style="color:var(--green);font-size:1rem">' + pct + '%</strong><br><span style="color:var(--text2);font-size:.7rem">Maitrise</span></div>';
  h += '</div>';
  h += '<div class="progress"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  h += '</div>';

  h += '<h2>7 modules de revision</h2>';
  h += '<div class="grid2" style="margin-top:.3rem">';

  var mods = [
    ['bases','Bases du reseau','OSI, IPv4, binaire, commandes','🔰',7,'var(--accent)'],
    ['windows','Windows','Client, Serveur, AD, DHCP, DNS','🪟',6,'var(--orange)'],
    ['linux','Linux','Commandes, administration, droits','🐧',5,'var(--green)'],
    ['reseau','Reseaux','Equipements, routage, VLAN, NAT','🌐',6,'var(--purple)'],
    ['services','Services Reseaux','Apache, GLPI, supervision, partages','📡',5,'var(--pink)'],
    ['secu','Securite & Cloud','Pare-feu, VPN, CIA, Cloud, menaces','🔒',5,'var(--red)']
  ];

  for (var i = 0; i < mods.length; i++) {
    var m = mods[i];
    var ms = PROGRESS[m[0]] || [];
    var mt = (CHECKS[m[0]] || []).length;
    var mpct = mt > 0 ? Math.round(ms.length / mt * 100) : 0;
    h += '<div class="card" style="cursor:pointer;padding:.6rem;border-left:3px solid ' + m[5] + '" onclick="navig(\'' + m[0] + '\')">';
    h += '<div style="font-size:1.3rem">' + m[3] + '</div>';
    h += '<h3 style="margin:0;font-size:.82rem">' + m[1] + '</h3>';
    h += '<p style="font-size:.7rem">' + m[2] + '</p>';
    h += '<div class="progress" style="height:3px;margin-top:.25rem"><div class="progress-fill" style="width:' + mpct + '%"></div></div>';
    h += '</div>';
  }
  h += '</div>';

  h += '<h2>Checklist de base</h2>';
  h += '<p style="font-size:.72rem;margin-bottom:.2rem;color:var(--text2)">Coche ce que tu maitrises deja pour suivre ta progression</p>';
  h += checklistHTML('home');

  h += '<div style="margin-top:1rem;padding:.8rem;border-radius:10px;background:rgba(6,182,212,.04);border:1px solid rgba(6,182,212,.1);font-size:.78rem">';
  h += '<strong style="color:var(--accent)">Conseil du jour :</strong><br>';
  h += '<span style="color:var(--text2)">30 minutes par jour suffisent. La regularite est plus importante que la duree. Alterne entre lecture et pratique sur machine virtuelle.</span>';
  h += '</div>';

  h += '</div>';
  return h;
}

function pageBases() {
  var h = '<div class="page">';
  h += '<h1>Bases du reseau</h1>';
  h += '<p>Cette section couvre les <strong>fondamentaux</strong> : le modele OSI, le binaire, l adressage IP et les premieres commandes. C est le socle de toute la formation.</p>';

  h += '<h2>1. Modele OSI — Les 7 couches</h2>';
  h += '<p>Le modele OSI est le <strong>squelette</strong> de tout le reseau. Imagine un immeuble de 7 etages. Chaque etage a son role et ne parle qu a l etage du dessus et du dessous.</p>';
  h += '<p style="font-size:.78rem;margin-bottom:.3rem">Quand tu envoies un message, il descend les 7 etages (encapsulation). Quand tu le recois, il remonte les 7 etages (desencapsulation).</p>';

  h += '<div class="box box-info"><strong>A retenir :</strong> Les couches 1-4 gerent le transport (comment les donnees voyagent). Les couches 5-7 gerent les applications (ce que font les donnees).</div>';

  for (var i = OSI.length - 1; i >= 0; i--) {
    var l = OSI[i];
    h += '<div class="layer ' + l[3] + '"><span class="num">' + l[0] + '</span><span class="name">' + l[1] + '</span><span style="font-size:.65rem;opacity:.7">' + l[2] + '</span></div>';
  }

  h += '<div class="card" style="font-size:.78rem">';
  h += '<strong>Astuce memoire :</strong> "Please Do Not Throw Sausage Pizza Away"<br>';
  h += '<span style="color:var(--text2);font-size:.7rem">P=Physique, D=Donnee(Liaison), N=Reseau, T=Transport, S=Session, P=Presentation, A=Application</span>';
  h += '</div>';

  h += '<h3>Details par couche</h3>';
  var layerDetails = [
    ['7', 'Application', 'C est la que se trouvent les <b>logiciels</b> que tu utilises : navigateur web, client email, logiciel FTP. Exemples : HTTP (web), SMTP (email), DNS (traduction des noms).'],
    ['6', 'Presentation', 'Cette couche <b>traduit et formate</b> les donnees. Elle gere le chiffrement (SSL/TLS pour les sites en HTTPS), la compression et la traduction entre differents formats.'],
    ['5', 'Session', 'Elle <b>ouvre et ferme</b> la communication entre deux machines. Comme un coup de telephone : elle etablit la connexion, maintient la ligne, puis raccroche.'],
    ['4', 'Transport', 'C est le <b>facteur</b>. TCP est un facteur qui demande une signature (fiable). UDP est un facteur qui jette le courrier dans la boite sans verification (rapide).'],
    ['3', 'Reseau', 'C est le <b>GPS</b>. Elle trouve le meilleur chemin pour arriver a destination. C est la que se trouve le protocole IP et le routage.'],

  h += '<div class="box box-info"><strong>Conversion exemple :</strong> L adresse IP 192.168.1.10 en binaire = 11000000.10101000.00000001.00001010. Chaque nombre entre les points fait 8 bits = 1 octet.</div>';

  h += '<div class="card" style="text-align:center;border-left:3px solid var(--green)"><b style="color:var(--green)">Integrite</b><br><span style="font-size:.72rem;color:var(--text2)">Les donnees n ont pas ete modifiees par un tiers. Signatures, hachages.</span></div>';
  h += '<div class="card" style="text-align:center;border-left:3px solid var(--orange)"><b style="color:var(--orange)">Disponibilite</b><br><span style="font-size:.72rem;color:var(--text2)">Les donnees sont accessibles quand on en a besoin. Sauvegardes, redondance.</span></div>';
  h += '</div>';
  h += '<div class="box box-info"><b>Astuce :</b> CIA = <b>C</b>onfidentialite, <b>I</b>ntegrite, <b>A</b>vailability (Disponibilite). Les trois doivent etre assures pour une securite complete.</div>';

  h += '<h2>2. Pare-feu (Firewall)</h2>';
  h += '<p>Le pare-feu <strong>filtre le trafic</strong> entre le reseau interne et Internet. Imagine un vigile a l entree qui controle qui entre et qui sort.</p>';
  h += '<div class="box box-green"><b>Regles typiques :</b> Autoriser la navigation web (port 80/443), autoriser les emails (port 25/587), bloquer tout le reste. Le pare-feu peut aussi creer une <b>DMZ</b>.</div>';

  h += '<h2>3. VPN (Virtual Private Network)</h2>';
  h += '<p>Le VPN cree un <strong>tunnel chiffre</strong> entre deux points sur Internet. Comme si tu avais un tube prive a travers Internet.</p>';
  h += '<div class="box box-info"><b>Cas d usage :</b> Un commercial en deplacement se connecte en VPN au reseau de l entreprise. Il accede aux fichiers et logiciels comme s il etait au bureau. Tout le trafic est chiffre.</div>';

  h += '<h2>4. DMZ (Zone Demilitarisee)</h2>';
  h += '<p>La DMZ est une <strong>zone intermediaire</strong> entre Internet et le reseau interne. On y place les serveurs qui doivent etre accessibles depuis Internet (site web, mail, VPN).</p>';
  h += '<div class="box box-orange"><b>Architecture :</b> Internet → Pare-feu → DMZ (serveurs web, mail) → Pare-feu → Reseau interne (PC, serveurs internes). Si un pirate attaque le site web, il n accede qu a la DMZ, pas au reseau interne.</div>';

  h += '<h2>5. Sauvegarde et Securite des donnees</h2>';
  h += '<ul style="font-size:.78rem;color:var(--text2);padding-left:1rem;line-height:1.8">';
  h += '<li><b>Regle 3-2-1 :</b> 3 copies des donnees, sur 2 supports differents, dont 1 hors site</li>';
  h += '<li><b>Chiffrement :</b> Les donnees sensibles doivent etre chiffrees (BitLocker, FileVault)</li>';
  h += '<li><b>Antivirus / EDR :</b> Protection des postes clients et serveurs</li>';
  h += '<li><b>Mises a jour :</b> Les correctifs de securite doivent etre installes regulierement</li>';
  h += '</ul>';

  h += '<h2>6. Menaces courantes</h2>';
  h += '<div class="grid2">';
  h += '<div class="card" style="border-left:3px solid var(--red);font-size:.75rem"><b style="color:var(--red)">Phishing</b><br><span style="color:var(--text2)">Email qui semble legitime pour voler tes identifiants</span></div>';
  h += '<div class="card" style="border-left:3px solid var(--red);font-size:.75rem"><b style="color:var(--red)">Ransomware</b><br><span style="color:var(--text2)">Virus qui chiffre tes fichiers et demande une rancon</span></div>';
  h += '<div class="card" style="border-left:3px solid var(--orange);font-size:.75rem"><b style="color:var(--orange)">DDOS</b><br><span style="color:var(--text2)">Submerger un serveur de requetes pour le faire planter</span></div>';
  h += '<div class="card" style="border-left:3px solid var(--orange);font-size:.75rem"><b style="color:var(--orange)">Ingenierie Sociale</b><br><span style="color:var(--text2)">Manipulation psychologique pour obtenir des infos</span></div>';
  h += '</div>';

  h += '<h2>7. Green IT (Informatique durable)</h2>';
  h += '<p>Le Green IT est l <strong>eco-responsabilite</strong> dans l informatique : reconditionner le materiel, recycler, reduire la consommation electrique, sensibiliser les utilisateurs.</p>';
  h += '<div class="box box-info"><b>Methode 4R :</b> <b>R</b>eduire, <b>R</b>eparer, <b>R</b>eemployer, <b>R</b>ecycler. Le technicien applique cette methode pour augmenter la duree de vie des equipements.</div>';

  h += '<h2>Checklist Securite</h2>' + checklistHTML('secu');
  h += '</div>';
  return h;
}

var PAGES = {
  home: pageHome,
  bases: pageBases,
  windows: pageWindows,
  linux: pageLinux,
  reseau: pageReseau,
  services: pageServices,
  secu: pageSecu
};

var currentTab = 'home';

function navig(page) {
  currentTab = page;
  try { localStorage.setItem('tsrs_tab', page); } catch(e) {}
  render();
}

function render() {
  var app = document.getElementById('app');
  var fn = PAGES[currentTab];
  if (!fn) fn = PAGES.home;
  app.innerHTML = fn();

  var tabs = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'tab-btn';
    if (tabs[i].dataset.tab === currentTab) {
      tabs[i].className = 'tab-btn active';
    }
  }

  var bar = document.getElementById('tab-bar');
  if (bar) bar.style.display = 'flex';
  window.scrollTo(0, 0);
}

// ============================================================
// START
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  try {
    loadProgress();
    try {
      var saved = localStorage.getItem('tsrs_tab');
      if (saved && PAGES[saved]) currentTab = saved;
    } catch(e) {}
    render();
  } catch(e) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<div style="padding:2rem;color:#ef4444">Erreur: ' + e.message + '</div>';
    }
  }
});
</script>

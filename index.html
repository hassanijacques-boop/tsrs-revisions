<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--card:#11151c;--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--pink:#ec4899;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
#app{max-width:860px;margin:0 auto;padding:.8rem .8rem 80px}
h1{font-size:1.25rem;font-weight:800}
h2{font-size:.95rem;font-weight:700;margin:1rem 0 .3rem;color:var(--accent)}
h3{font-size:.82rem;font-weight:600;margin:.5rem 0 .2rem;color:#f1f5f9}
p,li{font-size:.76rem;color:var(--text2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem;margin-bottom:.4rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,12,16,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding:.2rem 0 env(safe-area-inset-bottom,.2rem)}
.tab-btn{flex-shrink:0;padding:.3rem .5rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:6px;white-space:nowrap}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.1)}
.tag{display:inline-block;padding:.1rem .35rem;border-radius:4px;font-size:.55rem;font-weight:600}
.tag-b{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-g{background:rgba(16,185,129,.12);color:var(--green)}
.tag-o{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-r{background:rgba(239,68,68,.12);color:var(--red)}
.tag-p{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-pk{background:rgba(236,72,153,.12);color:var(--pink)}
.box{padding:.35rem .5rem;border-radius:6px;margin:.25rem 0;font-size:.74rem}
.box-info{background:rgba(6,182,212,.05);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.05);border-left:3px solid var(--green)}
.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:.25rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green))}
.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.3rem;padding:.15rem 0;font-size:.72rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:2px;accent-color:var(--accent);width:12px;height:12px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(75px,1fr));gap:.25rem;margin:.3rem 0}
.stat-card{text-align:center;padding:.3rem;background:var(--card);border-radius:8px;border:1px solid var(--border)}
.stat-card .val{font-size:1rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.5rem;color:var(--text2)}
.cmd{font-family:monospace;font-size:.7rem;background:#000;padding:.4rem;border-radius:6px;color:var(--green);line-height:1.5;overflow-x:auto}
.cmd .cm{color:#6b7280}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .2s ease}
</style>

C.m9=["Ecosysteme Office 365","Exchange Online","SharePoint","Serveur web Apache + PHP","Base de donnees MySQL/MariaDB","Cloud : SaaS, PaaS, IaaS","Pare-feu, DMZ, NAT","VPN IPSec","PKI et certificats"];
C.m10=["Windows Server : disques","Windows Server : SAM utilisateurs","Active Directory (annuaire)","GPO (strategies de groupe)","DHCP","DNS","RDS (bureau a distance)","WDS (deploiement)","Routage et NAT","NFS (partage Linux)","Samba (partage Windows-Linux)","autoFS (montage auto)","NTP (serveur temps)"];
C.m11=["Algorithmique","Variables en Bash","Enchainement de commandes","Commandes internes/externes","Conditions et tests","Fonctions Bash","Decouverte PowerShell","Commandes PowerShell et langage objet","Variables, structures","Administration distance PowerShell","Outils de scripting"];
C.m12=["Fondamentaux cybersecurite","Securite smartphones/tablettes/PC","Securite et sauvegarde des donnees","Pare-feu et regles","Configuration VPN","Antivirus","Anglais : vocabulaire technique","Anglais : support utilisateurs","Anglais : procedures securite","Preparation TOEIC (650 vise)"];
C.exo=["Exercice 1 : ping et ipconfig (diagnostic reseau)","Exercice 2 : tracer une route avec tracert/traceroute","Exercice 3 : nslookup pour interroger le DNS","Exercice 4 : cmd Windows (creer dossiers fichiers)","Exercice 5 : PowerShell (processus et services)","Exercice 6 : installer Ubuntu sur VMware","Exercice 7 : commandes Linux de base","Exercice 8 : creer un script Bash simple","Exercice 9 : creer un script PowerShell","Exercice 10 : Packet Tracer (monter un reseau)","Exercice 11 : calculer des sous-reseaux","Exercice 12 : analyser le trafic avec Wireshark"];

function sp(){try{localStorage.setItem("t2",JSON.stringify(P))}catch(e){}}
function tg(s,i){if(!P[s])P[s]=[];var a=P[s],p=a.indexOf(i);p>=0?a.splice(p,1):a.push(i);sp();r();}
function ch(s){var it=C[s],sv=P[s]||[],h='<h2>Checklist</h2><ul class="check-list">';for(var i=0;i<it.length;i++){var d=sv.indexOf(i)>=0;h+='<li class="'+(d?'done':'')+'" onclick="tg(\''+s+'\','+i+')"><input type="checkbox"'+(d?' checked':'')+'>'+it[i]+'</li>';}return h+'</ul>';}
function st(){var t=0,d=0;for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++;}}return{d:d,t:t,p:t>0?Math.round(d/t*100):0};}

  var s=st(),h='<div class="page">';

// ====== MODULE 1 : MODELE OSI ======
function pgM1(){
  var h='<div class="page"><h1>M1 — Modele OSI</h1>';
  h+='<p>Le modele <b>OSI</b> (Open Systems Interconnection) est le <b>squelette de tout le reseau</b>. Il divise la communication en <b>7 couches</b>. Chaque couche a un role precis et ne parle qu a la couche voisine (au-dessus et en-dessous).</p>';
  h+='<div class="box box-info"><b>Principe :</b> Quand un ordinateur envoie des donnees, elles descendent les 7 couches (encapsulation). Chaque couche <b>ajoute son en-tete</b> (comme des enveloppes mises dans des enveloppes). A la reception, les donnees remontent les 7 couches et chaque couche <b>retire son en-tete</b> (desencapsulation).</div>';
  
  h+='<h2>Les 7 couches (de haut en bas)</h2>';
  
  h+='<div class="card" style="border-left:3px solid var(--red)">';
  h+='<b>Couche 7 — Application</b> <span class="tag tag-pk">Application</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">C est la couche que <b>tu utilises directement</b>. C est la que se trouvent les logiciels : navigateur web (HTTP), client email (SMTP, IMAP), transfert de fichiers (FTP).<br><br>';
  h+='<b>Exemple :</b> Quand tu ouvres Chrome et tu tapes "google.com", la couche Application prepare la demande "donne-moi la page google.com" et l envoie a la couche 6.</span></div>';
  
  h+='<div class="card" style="border-left:3px solid var(--orange)">';
  h+='<b>Couche 6 — Presentation</b> <span class="tag tag-pk">Presentation</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">C est la couche qui <b>traduit et formate</b> les donnees. Elle s assure que les donnees envoyees par un ordinateur peuvent etre comprises par un autre.<br><br>';
  h+='<b>Role :</b> Chiffrement (SSL/TLS pour les sites HTTPS), compression (JPEG, MPEG), conversion de format.<br>';
  h+='<b>Exemple :</b> Un site en HTTPS (cadenas vert) utilise SSL/TLS (couche 6) pour chiffrer les donnees. Si quelqu un intercepte, il ne peut pas les lire.</span></div>';
  
  h+='<div class="card" style="border-left:3px solid #eab308">';
  h+='<b>Couche 5 — Session</b> <span class="tag tag-pk">Session</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">Cette couche <b>ouvre, maintient et ferme</b> la communication entre deux machines. Comme un coup de telephone : elle etablit la ligne, maintient la conversation, puis raccroche.<br><br>';
  h+='<b>Exemple :</b> Quand tu te connectes a ton compte Google, la couche Session cree une session qui reste active jusqu a ce que tu te deconnectes ou que le temps expire.</span></div>';
  
  h+='<div class="card" style="border-left:3px solid var(--green)">';
  h+='<b>Couche 4 — Transport</b> <span class="tag tag-pk">Transport</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">C est la couche qui <b>decoupe les donnees en paquets</b> et s assure qu ils arrivent correctement. Deux protocoles :<br><br>';
  h+='<b>TCP (Transmission Control Protocol) :</b> Fiable. Chaque paquet est numero, verifie, renvoye si perdu. Lent mais sur. Utilise pour : web, email, FTP, transfert de fichiers.<br>';
  h+='<b>UDP (User Datagram Protocol) :</b> Rapide. Envoie les paquets sans verification. Rapide mais non fiable. Utilise pour : streaming video, appel telephonique (VoIP), jeux en ligne.<br><br>';
  h+='<b>Analogie :</b> TCP = lettre recommandee (signature, verification). UDP = carte postale (envoyee, on verifie pas si elle arrive).</span></div>';
  
  h+='<div class="card" style="border-left:3px solid var(--accent)">';
  h+='<b>Couche 3 — Reseau</b> <span class="tag tag-pk">Network</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">Cette couche <b>trouve le chemin</b> jusqu a la destination. C est la que se trouve le protocole <b>IP</b> (Internet Protocol) et le <b>routage</b>.<br><br>';
  h+='<b>Role :</b> Ajouter l adresse IP de la source et de la destination. Choisir la meilleure route pour arriver a destination (comme un GPS).<br>';
  h+='<b>Equipement :</b> Le <b>routeur</b> travaille a cette couche. Il decide du chemin que prennent les donnees.</span></div>';
  
  h+='<div class="card" style="border-left:3px solid #6366f1">';
  h+='<b>Couche 2 — Liaison</b> <span class="tag tag-pk">Data Link</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">Cette couche <b>organise les donnees pour les envoyer sur le cable</b>. Elle utilise les <b>adresses MAC</b> (adresse physique unique de la carte reseau).<br><br>';
  h+='<b>Role :</b> Decouper les donnees en <b>trames</b>, gerer l acces au support (Ethernet, WiFi), detecter les erreurs de transmission.<br>';
  h+='<b>Equipement :</b> Le <b>switch</b> travaille a cette couche. Il achemine les trames vers le bon destinataire.<br>';
  h+='<b>Exemple :</b> Chaque carte reseau (Ethernet, WiFi) a une adresse MAC unique au monde. C est comme une empreinte digitale.</span></div>';
  
  h+='<div class="card" style="border-left:3px solid var(--purple)">';
  h+='<b>Couche 1 — Physique</b> <span class="tag tag-pk">Physical</span><br>';
  h+='<span style="color:var(--text2);font-size:.74rem">C est la couche la <b>plus basse</b>. Elle s occupe du <b>support physique</b> : les cables, la fibre optique, les ondes radio.<br><br>';
  h+='<b>Role :</b> Convertir les donnees en signaux electriques (cable cuivre), lumineux (fibre optique) ou radio (WiFi). Envoyer les bits (0 et 1) sur le support.<br>';
  h+='<b>Exemple :</b> Le cable Ethernet (RJ45) que tu branches entre ton PC et la box. Les 8 fils a l interieur transportent les signaux electriques.<br>';
  h+='<b>Equipements :</b> Cables, connecteurs, hub (concentre), modem, carte reseau.</span></div>';
  
  h+='<h2>Resume : les 7 couches en image</h2>';
  h+='<div class="box box-green"><b>7-Application</b> <span class="tag tag-pk">Application</span> — Les logiciels (Chrome, Outlook)<br><b>6-Presentation</b> <span class="tag tag-pk">Presentation</span> — Chiffrement, traduction (SSL)<br><b>5-Session</b> <span class="tag tag-pk">Session</span> — Ouverture/fermeture connexion<br><b>4-Transport</b> <span class="tag tag-pk">Transport</span> — TCP (fiable) / UDP (rapide)<br><b>3-Reseau</b> <span class="tag tag-pk">Network</span> — IP, routage (routeur)<br><b>2-Liaison</b> <span class="tag tag-pk">Data Link</span> — MAC, trames (switch)<br><b>1-Physique</b> <span class="tag tag-pk">Physical</span> — Cables, fibre, signaux</div>';
  
  h+='<div class="card"><b>Astuce memoire :</b> "Please Do Not Throw Sausage Pizza Away"<br>';
  h+='<span style="font-size:.7rem;color:var(--text2)">P = Physical (Physique), D = Data Link (Liaison), N = Network (Reseau), T = Transport (Transport), S = Session (Session), P = Presentation (Presentation), A = Application (Application)</span></div>';
  
  h+='<h2>Communication entre deux PC</h2>';
  h+='<div class="card" style="font-size:.74rem;line-height:1.7">';
  h+='<b>Quand tu tapes "google.com" dans ton navigateur :</b><br><br>';
  h+='1. <b>Couche 7</b> : Le navigateur cree une requete HTTP "donne-moi la page"<br>';
  h+='2. <b>Couche 6</b> : Les donnees sont chiffrees (HTTPS)<br>';
  h+='3. <b>Couche 5</b> : Une session est ouverte entre ton PC et Google<br>';
  h+='4. <b>Couche 4</b> : TCP decoupe la requete en paquets et les numerote<br>';
  h+='5. <b>Couche 3</b> : IP ajoute l adresse source (ton PC) et destination (Google)<br>';
  h+='6. <b>Couche 2</b> : Decoupage en trames, ajout des adresses MAC<br>';
  h+='7. <b>Couche 1</b> : Les bits voyagent sur le cable ou le WiFi<br><br>';
  h+='Puis c est l inverse chez Google : la couche 1 recoit les bits, la couche 2 retire les trames... jusqu a la couche 7 qui recoit la requete HTTP.</div>';
  
  h+='<div class="cmd"><span class="cm"># Voir les infos reseau de sa machine</span><br>ipconfig (Windows)<br>ip a (Linux)<br><br><span class="cm"># Tester la connexion</span><br>ping 8.8.8.8<br><br><span class="cm"># Voir le chemin emprunte</span><br>tracert google.com (Windows)<br>traceroute google.com (Linux)</div>';
  h+=ch("m1")+'</div>';return h;
}

// ====== MODULE 2 : UNITES ET IPv4 ======
function pgM2(){
  var h='<div class="page"><h1>M2 — Unites et IPv4</h1>';
  
  h+='<h2>1. Le binaire et les unites</h2>';
  h+='<div class="card"><b>Le binaire <span class="tag tag-pk">Binary</span> :</b> Un ordinateur ne comprend que le <b>binaire</b> : des 0 et des 1. Chaque 0 ou 1 s appelle un <b>bit</b> (contraction de "binary digit").<br><br>';
  h+='1 bit = 0 ou 1 (la plus petite unite possible)<br>';
  h+='1 octet <span class="tag tag-pk">Byte</span> = 8 bits (exemple : une lettre comme "A" = 1 octet)<br>';
  h+='<br><b>Unites de stockage :</b><br>';
  h+='1 Kilo-octet (Ko / KB) = 1024 octets (environ 1 page de texte)<br>';
  h+='1 Mega-octet (Mo / MB) = 1024 Ko (environ 1 photo)<br>';
  h+='1 Giga-octet (Go / GB) = 1024 Mo (environ 1 film)<br>';
  h+='1 Tera-octet (To / TB) = 1024 Go (un disque dur externe)</div>';
  
  h+='<h2>2. Qu est-ce qu une adresse IPv4 ?</h2>';
  h+='<div class="card">';
  h+='<p>Une <b>adresse IPv4</b> <span class="tag tag-pk">IP Address</span> est comme une <b>adresse postale</b> pour ton ordinateur sur le reseau. C est un identifiant unique qui permet aux machines de se trouver et de communiquer entre elles.</p><br>';
  h+='<b>A quoi ca ressemble ?</b><br>';
  h+='<div style="font-family:monospace;font-size:1.1rem;color:var(--accent);text-align:center;padding:.5rem;background:rgba(0,0,0,.3);border-radius:6px;margin:.3rem 0">192 . 168 . 1 . 10</div>';
  h+='<b>Structure :</b> 4 nombres separes par des points. Chaque nombre est compris entre <b>0 et 255</b>.<br><br>';
  h+='<b>Pourquoi 0 a 255 ?</b> Parce que chaque nombre fait 8 bits (1 octet). Avec 8 bits, le plus petit nombre est 00000000 = 0, le plus grand est 11111111 = 255. 4 x 8 bits = 32 bits au total.<br><br>';
  h+='<b>Analogie :</b> C est comme une adresse postale :<br>';
  h+='192 = le pays (France)<br>';
  h+='168 = la ville (Mamoudzou)<br>';
  h+='1 = la rue (Rue Combo)<br>';
  h+='10 = le numero de maison (numero 10)</div>';
  
  h+='<h2>3. Masque de sous-reseau — La partie la plus importante</h2>';
  h+='<div class="card">';
  h+='<p>Le <b>masque de sous-reseau</b> (subnet mask) est ce qui <b>separe l adresse en deux parties</b> :</p>';
  h+='- La partie <b>RESEAU</b> (le quartier) — tous les PC du meme quartier sont dans le meme reseau<br>';
  h+='- La partie <b>MACHINE</b> (le numero de maison) — chaque PC a son numero unique dans le quartier<br><br>';
  h+='<div style="font-family:monospace;font-size:.85rem;color:var(--accent);text-align:center;padding:.4rem;background:rgba(0,0,0,.3);border-radius:6px">';
  h+='<span style="color:var(--accent)">192.168.1</span>.<span style="color:var(--green)">10</span><br>';
  h+='<span style="font-size:.65rem;color:var(--accent)">Partie RESEAU (quartier)</span>  <span style="font-size:.65rem;color:var(--green)">Partie MACHINE (maison)</span></div><br>';
  h+='<b>Les masques les plus courants :</b><br>';
  h+='<b>/24</b> (255.255.255.0) : les 3 premiers nombres = le reseau, le dernier = la machine. Permet 254 machines.<br>';
  h+='<b>/16</b> (255.255.0.0) : les 2 premiers = le reseau, les 2 derniers = la machine. Permet 65 534 machines.<br>';
  h+='<b>/8</b> (255.0.0.0) : le 1er nombre = le reseau, les 3 derniers = la machine. Permet 16 millions de machines.</div>';
  
  h+='<h2>4. Les classes IPv4 (A, B, C) — explication simple</h2>';
  h+='<div class="card">';
  h+='<p>Au debut d Internet, on a <b>decoupe les adresses IP en classes</b> selon la taille du reseau. Chaque classe a un masque par defaut different :</p><br>';
  
  h+='<div style="background:rgba(6,182,212,.06);padding:.5rem;border-radius:6px;margin-bottom:.4rem">';
  h+='<b>Classe A <span class="tag tag-b">/8</span></b> — Pour les <b>tres grands reseaux</b> (Google, Amazon, etc.)<br>';
  h+='<span style="color:var(--text2);font-size:.72rem">';
  h+='Les adresses vont de <b>1.0.0.0</b> a <b>126.255.255.255</b><br>';
  h+='Masque : <b>255.0.0.0</b> = le PREMIER nombre est le reseau, les 3 autres sont les machines<br>';
  h+='Nombre de machines possibles : <b>16 millions</b> (enorme !)<br>';
  h+='<b>Exemple :</b> L adresse 34.56.78.90 — le "34" est le reseau, le reste designe la machine.</span></div>';
  
  h+='<div style="background:rgba(16,185,129,.06);padding:.5rem;border-radius:6px;margin-bottom:.4rem">';
  h+='<b>Classe B <span class="tag tag-g">/16</span></b> — Pour les <b>moyens reseaux</b> (universites, grandes entreprises)<br>';
  h+='<span style="color:var(--text2);font-size:.72rem">';
  h+='Les adresses vont de <b>128.0.0.0</b> a <b>191.255.255.255</b><br>';
  h+='Masque : <b>255.255.0.0</b> = les DEUX premiers nombres sont le reseau, les 2 autres sont les machines<br>';
  h+='Nombre de machines possibles : <b>65 534</b><br>';
  h+='<b>Exemple :</b> L adresse 172.16.5.20 — le "172.16" est le reseau, le "5.20" designe la machine.</span></div>';
  
  h+='<div style="background:rgba(245,158,11,.06);padding:.5rem;border-radius:6px;margin-bottom:.4rem">';
  h+='<b>Classe C <span class="tag tag-o">/24</span></b> — Pour les <b>petits reseaux</b> (entreprises, ecoles, maisons)<br>';
  h+='<span style="color:var(--text2);font-size:.72rem">';
  h+='Les adresses vont de <b>192.0.0.0</b> a <b>223.255.255.255</b><br>';
  h+='Masque : <b>255.255.255.0</b> = les TROIS premiers nombres sont le reseau, le dernier est la machine<br>';
  h+='Nombre de machines possibles : <b>254</b><br>';
  h+='C est la classe la plus utilisee ! Ta box a la maison utilise une IP de classe C.<br>';
  h+='<b>Exemple :</b> 192.168.1.10 — le "192.168.1" est le reseau, le "10" est la machine.</span></div>';
  
  h+='<p style="margin-top:.3rem"><b>Comment reconnaitre la classe ?</b> Regarde le premier nombre :</p>';
  h+='<ul style="font-size:.72rem;color:var(--text2);padding-left:1rem;line-height:1.5">';
  h+='<li>1 a 126 = Classe A (grand reseau, /8)</li>';
  h+='<li>128 a 191 = Classe B (moyen reseau, /16)</li>';
  h+='<li>192 a 223 = Classe C (petit reseau, /24)</li>';
  h+='</ul></div>';
  
  h+='<h2>5. Les adresses importantes a connaitre</h2>';
  h+='<div class="card" style="font-size:.74rem">';
  h+='Prenons un exemple : reseau <b>192.168.1.0/24</b> (masque 255.255.255.0)<br><br>';
  h+='<b>Adresse reseau <span class="tag tag-b">Network</span> :</b> 192.168.1.<b>0</b> — C est la <b>premiere adresse</b>. Elle sert a identifier le reseau lui-meme. On ne peut pas l attribuer a une machine.<br><br>';
  h+='<b>Adresse de broadcast <span class="tag tag-o">Broadcast</span> :</b> 192.168.1.<b>255</b> — C est la <b>derniere adresse</b>. Elle sert a envoyer un message a <b>TOUTES</b> les machines du reseau en meme temps.<br><br>';
  h+='<b>Passerelle <span class="tag tag-g">Gateway</span> :</b> 192.168.1.<b>1</b> — C est la <b>porte de sortie</b> vers Internet. C est l adresse de ta box (ou du routeur).<br><br>';
  h+='<b>Adresse IP des machines :</b> de 192.168.1.<b>2</b> a 192.168.1.<b>254</b> — 253 adresses disponibles pour les PC, telephones, imprimantes...</div>';
  
  h+='<h2>6. La notation CIDR</h2>';
  h+='<div class="card">';
  h+='<p>Au lieu d ecrire le masque en entier <b>255.255.255.0</b>, on utilise une notation plus courte : <b>/24</b> (on dit "slash 24").<br><br>';
  h+='Le nombre apres le slash indique <b>combien de bits</b> sont reserves pour la partie reseau :</p>';
  h+='<div style="font-family:monospace;font-size:.8rem;text-align:center;line-height:1.8">';
  h+='<b>/8</b> = 255.0.0.0 (8 bits pour le reseau, 24 pour les machines)<br>';
  h+='<b>/16</b> = 255.255.0.0 (16 bits reseau, 16 bits machines)<br>';
  h+='<b>/24</b> = 255.255.255.0 (24 bits reseau, 8 bits machines)<br>';
  h+='<b>/30</b> = 255.255.255.252 (30 bits reseau, 2 bits machines = 2 adresses utilisables)</div></div>';
  
  h+='<h2>7. Calcul rique : combien de machines ?</h2>';
  h+='<div class="card" style="font-size:.74rem">';
  h+='Formule : <b>2^(32 - nombre_apres_slash) - 2</b><br><br>';
  h+='<b>Exemple pour /24 :</b> 2^(32-24) - 2 = 2^8 - 2 = 256 - 2 = <b>254 machines</b><br>';
  h+='<b>Exemple pour /16 :</b> 2^(32-16) - 2 = 2^16 - 2 = 65536 - 2 = <b>65 534 machines</b><br>';
  h+='On enleve 2 parce que la premiere adresse est reservee (reseau) et la derniere aussi (broadcast).</div>';
  
  h+='<h2>8. Les sous-reseaux</h2>';
  h+='<div class="card">';
  h+='<p>On peut <b>decouper un grand reseau en plus petits</b> sous-reseaux. Exemple : on a le reseau 192.168.1.0/24 (254 machines). On veut 4 sous-reseaux :</p><br>';
  h+='<b>Sous-reseau 1 :</b> 192.168.1.0/26 (machines 1 a 62)<br>';
  h+='<b>Sous-reseau 2 :</b> 192.168.1.64/26 (machines 65 a 126)<br>';
  h+='<b>Sous-reseau 3 :</b> 192.168.1.128/26 (machines 129 a 190)<br>';
  h+='<b>Sous-reseau 4 :</b> 192.168.1.192/26 (machines 193 a 254)<br><br>';
  h+='Chaque sous-reseau peut avoir 62 machines. C est comme decouper un grand terrain en 4 parcelles.</div>';
  
  h+='<div class="cmd">Exemple de configuration IP :<br>IP: 192.168.1.10<br>Masque: 255.255.255.0 (/24)<br>Reseau: 192.168.1.0<br>Broadcast: 192.168.1.255<br>Passerelle: 192.168.1.1<br><br><span class="cm"># Voir sa propre IP (Windows)</span><br>C:\> ipconfig<br><br><span class="cm"># Voir sa propre IP (Linux)</span><br>$ ip a</div>';
  h+=ch("m2")+'</div>';return h;
}

function pgM12(){
  var h='<div class="page"><h1>M12 — Securite & Anglais</h1>';
  h+='<div class="card"><b>Cybersecurite <span class="tag tag-pk">Cybersecurity</span> :</b> Confidentialite <span class="tag tag-pk">Confidentiality</span> + Integrite <span class="tag tag-pk">Integrity</span> + Disponibilite <span class="tag tag-pk">Availability</span> (CIA). Les 3 piliers de la securite.</div>';
  h+='<div class="box"><b>Menaces :</b> Phishing (email piege), Ransomware (donnees chiffrees, rancon), DDOS (submerger un serveur), Ingenierie sociale (manipulation).</div>';
  h+='<div class="card"><b>Securite des appareils :</b> Smartphones, tablettes, PC portables. Chiffrement, antivirus, mots de passe forts, MFA. Ne pas brancher de cle USB inconnue.</div>';
  h+='<div class="card"><b>Sauvegarde <span class="tag tag-pk">Backup</span> :</b> Regle 3-2-1 : 3 copies <span class="tag tag-pk">Copies</span>, 2 supports differents <span class="tag tag-pk">Different media</span>, 1 hors site <span class="tag tag-pk">Offsite</span>. Tester les restaurations regulierement.</div>';
  h+='<div class="card"><b>Pare-feu <span class="tag tag-pk">Firewall</span> :</b> Filtre le trafic. Regles : autoriser les ports necessaires (80, 443, 25), bloquer tout le reste. DMZ pour les serveurs accessibles depuis Internet.</div>';
  h+='<div class="card"><b>VPN <span class="tag tag-pk">Virtual Private Network</span> :</b> Tunnel chiffre pour acceder au reseau de l entreprise depuis l exterieur. IPSec, SSL VPN.</div>';
  h+='<div class="card"><b>Anglais technique :</b> Vocabulaire : router, switch, firewall, bandwidth, latency, troubleshooting, deployment. Support : "Please restart your computer." "Can you describe the problem?" TOEIC 650 vise.</div>';
  h+=ch("m12")+'</div>';return h;
}

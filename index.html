<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS — Révisions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--bg2:#11151c;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 90px}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--accent)}
h3{font-size:.95rem;font-weight:600;margin:.75rem 0 .35rem;color:#f1f5f9}
p,li{font-size:.85rem;color:var(--text2);line-height:1.7}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.6rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:.35rem 0 env(safe-area-inset-bottom,.35rem)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem .3rem;border:none;background:transparent;color:var(--text2);font-size:.6rem;cursor:pointer;border-radius:8px;font-weight:500;white-space:nowrap}
.tab-btn svg{width:20px;height:20px;opacity:.6}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.08)}
.tab-btn.active svg{opacity:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:10px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0891b2);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}

/* Progress bar */
.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}

/* Checklist */
.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;font-size:.8rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}

/* Layers */
.layer{display:flex;align-items:center;padding:.35rem .7rem;border-radius:6px;font-size:.72rem;font-weight:600;gap:.4rem;margin:2px 0}
.layer .num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0}
.layer .name{width:85px;flex-shrink:0}
.l7{background:rgba(239,68,68,.12);color:#fca5a5}.l7 .num{background:rgba(239,68,68,.3)}
.l6{background:rgba(249,115,22,.12);color:#fdba74}.l6 .num{background:rgba(249,115,22,.3)}
.l5{background:rgba(234,179,8,.12);color:#fde047}.l5 .num{background:rgba(234,179,8,.3)}
.l4{background:rgba(34,197,94,.12);color:#86efac}.l4 .num{background:rgba(34,197,94,.3)}
.l3{background:rgba(6,182,212,.12);color:#67e8f9}.l3 .num{background:rgba(6,182,212,.3)}
.l2{background:rgba(99,102,241,.12);color:#a5b4fc}.l2 .num{background:rgba(99,102,241,.3)}
.l1{background:rgba(168,85,247,.12);color:#d8b4fe}.l1 .num{background:rgba(168,85,247,.3)}

/* Tag */
.tag{display:inline-block;padding:.15rem .45rem;border-radius:5px;font-size:.65rem;font-weight:600}
.tag-blue{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-green{background:rgba(16,185,129,.12);color:var(--green)}
.tag-orange{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red)}

/* Cmd grid */
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
@media(max-width:480px){.cmd-grid{grid-template-columns:1fr}}
.cmd-item{background:rgba(0,0,0,.3);border-radius:6px;padding:.35rem .55rem;font-family:monospace;font-size:.75rem}
.cmd-item .c{color:var(--green)}
.cmd-item .d{color:var(--text2);font-size:.65rem;font-family:system-ui,sans-serif;margin-top:.1rem}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:.4rem;margin:.5rem 0}
.stat-card{text-align:center;padding:.5rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.stat-card .val{font-size:1.4rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.65rem;color:var(--text2);margin-top:.1rem}

/* IP Visual */
.ip-viz{font-family:monospace;font-size:.85rem;padding:.6rem;background:rgba(0,0,0,.3);border-radius:8px;text-align:center}
.ip-viz .net{color:var(--accent);font-weight:700}
.ip-viz .host{color:var(--green)}
.ip-viz .dim{opacity:.5;font-size:.7rem}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease}
</style>
</head>
<body>
<noscript><div style="padding:2rem;text-align:center;color:var(--red)">JavaScript est desactive. Active-le pour voir le site.</div></noscript>
<div id="app">
  <div style="text-align:center;padding:3rem 1rem;color:var(--text2)">
    <div style="font-size:2rem;margin-bottom:.5rem">📡</div>
    <div>Chargement...</div>
  </div>
</div>

<nav class="tab-bar" id="tab-bar" style="display:none">
  <button class="tab-btn active" data-tab="home" onclick="navig('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"/></svg>
    <span>Accueil</span>
  </button>
  <button class="tab-btn" data-tab="osi" onclick="navig('osi')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    <span>OSI</span>
  </button>
  <button class="tab-btn" data-tab="reseau" onclick="navig('reseau')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2"/><path d="M12 2a10 10 0 0110 10"/><path d="M12 22A10 10 0 012 12"/><circle cx="12" cy="2" r="1"/><circle cx="12" cy="22" r="1"/></svg>
    <span>Reseau</span>
  </button>
  <button class="tab-btn" data-tab="linux" onclick="navig('linux')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    <span>Linux</span>
  </button>
  <button class="tab-btn" data-tab="win" onclick="navig('win')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
    <span>Windows</span>
  </button>
  <button class="tab-btn" data-tab="secu" onclick="navig('secu')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <span>Securite</span>
  </button>
  <button class="tab-btn" data-tab="script" onclick="navig('script')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    <span>Script</span>
  </button>
</nav>

<script>
// ============================================================
// DATA — NO FRENCH APOSTROPHES, NO SINGLE QUOTES IN CONTENT
// ============================================================

var OSI = [
  ['7', 'Application', 'HTTP, FTP, SMTP, DNS', 'l7'],
  ['6', 'Presentation', 'SSL/TLS, JPEG, MPEG', 'l6'],
  ['5', 'Session', 'NetBIOS, RPC', 'l5'],
  ['4', 'Transport', 'TCP, UDP', 'l4'],
  ['3', 'Reseau', 'IP, Routage', 'l3'],
  ['2', 'Liaison', 'Ethernet, MAC, WiFi', 'l2'],
  ['1', 'Physique', 'Cables, Fibre, RJ45', 'l1']
];

var EQUIP = [
  ['Switch', 'Liaison (2)', 'Relie les appareils sur un meme reseau local. Utilise les adresses MAC.'],
  ['Routeur', 'Reseau (3)', 'Relie differents reseaux (LAN vers Internet). Utilise les adresses IP.'],
  ['Pare-feu', 'Reseau/Transp.', 'Filtre le trafic autorise et interdit. Protege le reseau.'],
  ['Switch L3', 'Liaison + Reseau', 'Switch capable de faire du routage inter-VLAN.'],
  ['Borne WiFi', 'Physique + Liaison', "Point d'acces sans fil. Relie le WiFi au reseau filaire."],
  ['Hub', 'Physique (1)', 'Multiprise reseau. Obsolète et dangereux (domaine de diffusion).']
];

var CMDS = [
  ['ls', 'Lister les fichiers'],
  ['cd dossier', 'Aller dans un dossier'],
  ['pwd', 'Chemin du dossier courant'],
  ['mkdir nom', 'Creer un dossier'],
  ['rm fichier', 'Supprimer (rm -r = dossier)'],
  ['cp src dst', 'Copier'],
  ['mv src dst', 'Deplacer ou renommer'],
  ['cat fichier', 'Afficher un fichier'],
  ['grep motif fichier', 'Chercher du texte'],
  ['chmod droits fichier', "Modifier les permissions"],
  ['chown user fichier', "Changer le proprietaire"],
  ['ps', 'Lister les processus'],
  ['kill PID', 'Arreter un processus'],
  ['man cmd', 'Manuel de la commande'],
  ['apt install paquet', 'Installer un logiciel'],
  ['ping adresse', 'Tester la connexion'],
  ['ip a', 'Voir les adresses IP'],
  ['df -h', 'Espace disque']
];

var CHECKS = {
  home: [
    "Je connais les 7 couches du modele OSI",
    "Je sais convertir une IP en binaire",
    "J ai installe Ubuntu sur VMware",
    "Je sais me deplacer dans Linux",
    "Je sais ce qu est une adresse IP",
    "Je connais TCP vs UDP"
  ],
  osi: [
    "Je cite les 7 couches dans l ordre",
    "Je comprends l encapsulation",
    "Je connais un protocole par couche"
  ],
  reseau: [
    "Je sais calculer une adresse reseau",
    "Je connais la notation CIDR",
    "Je connais les classes IP A B C",
    "Je sais ce qu est le NAT"
  ],
  linux: [
    "Je maitrise ls cd cp mv rm",
    "Je gere les permissions",
    "J utilise apt pour installer",
    "Je gere les processus ps top kill"
  ],
  win: [
    "Je sais ce qu est Active Directory",
    "Je comprends le role de DHCP",
    "Je comprends le role de DNS"
  ],
  secu: [
    "Je connais le modele CIA",
    "Je sais ce qu est un pare-feu",
    "Je comprends le VPN",
    "Je connais SaaS PaaS IaaS"
  ],
  script: [
    "J ecris un script Bash simple",
    "Je connais les variables Bash",
    "Je fais une condition if",
    "Je connais la boucle for"
  ]
};

var PROGRESS = {};
function loadProgress() {
  try {
    var d = localStorage.getItem('tsrs_p');
    if (d) PROGRESS = JSON.parse(d);
  } catch(e) {}
}
function saveProgress() {
  try { localStorage.setItem('tsrs_p', JSON.stringify(PROGRESS)); } catch(e) {}
}

function toggleCheck(section, idx) {
  if (!PROGRESS[section]) PROGRESS[section] = [];
  var arr = PROGRESS[section];
  var p = arr.indexOf(idx);
  if (p >= 0) arr.splice(p, 1);
  else arr.push(idx);
  saveProgress();
  render();
}

function getPct() {
  var total = 0, done = 0;
  for (var k in CHECKS) {
    var items = CHECKS[k];
    var saved = PROGRESS[k] || [];
    for (var i = 0; i < items.length; i++) {
      total++;
      if (saved.indexOf(i) >= 0) done++;
    }
  }
  return total > 0 ? Math.round(done / total * 100) : 0;
}

function getDone() {
  var t = 0, d = 0;
  for (var k in CHECKS) {
    var items = CHECKS[k];
    var saved = PROGRESS[k] || [];
    for (var i = 0; i < items.length; i++) {
      t++;
      if (saved.indexOf(i) >= 0) d++;
    }
  }
  return {done: d, total: t};
}

function checklistHTML(section) {
  var items = CHECKS[section];
  if (!items) return '';
  var saved = PROGRESS[section] || [];
  var h = '<ul class="check-list">';
  for (var i = 0; i < items.length; i++) {
    var done = saved.indexOf(i) >= 0;
    h += '<li class="' + (done ? 'done' : '') + '" onclick="toggleCheck(\'' + section + '\',' + i + ')">';
    h += '<input type="checkbox"' + (done ? ' checked' : '') + '> ';
    h += items[i] + '</li>';
  }
  h += '</ul>';
  return h;
}

// ============================================================
// PAGES
// ============================================================

function pageHome() {
  var d = getDone();
  var pct = getPct();
  var h = '<div class="page">';
  h += '<div style="text-align:center;padding:1.5rem 0 1rem">';
  h += '<span style="display:inline-block;background:rgba(6,182,212,.1);color:var(--accent);padding:.2rem .8rem;border-radius:20px;font-size:.7rem;font-weight:600;margin-bottom:.5rem">Formation TSRS - BAC+2</span>';
  h += '<h1>Revisions <span class="gradient">TSRS</span></h1>';
  h += '<p style="font-size:.85rem">Programme complet Technicien Systemes Reseaux & Securite</p>';
  h += '</div>';

  h += '<div class="card" style="text-align:center;padding:.6rem">';
  h += '<div style="display:flex;justify-content:center;gap:1rem;font-size:.8rem">';
  h += '<div><strong style="color:var(--accent);font-size:1rem">' + d.done + '</strong><br><span style="color:var(--text2);font-size:.7rem">Acquis</span></div>';
  h += '<div><strong style="color:var(--text);font-size:1rem">' + d.total + '</strong><br><span style="color:var(--text2);font-size:.7rem">Notions</span></div>';
  h += '<div><strong style="color:var(--green);font-size:1rem">' + pct + '%</strong><br><span style="color:var(--text2);font-size:.7rem">Maitrise</span></div>';
  h += '</div>';
  h += '<div class="progress"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  h += '</div>';

  h += '<div class="grid2" style="margin-top:.5rem">';
  var mods = [
    ['osi', 'OSI', 'Les 7 couches', '📡', 7],
    ['reseau', 'Reseau', 'IP, routage, equipements', '🌐', 6],
    ['linux', 'Linux', 'Commandes, permissions', '🐧', 5],
    ['win', 'Windows', 'AD, DHCP, DNS', '🪟', 4],
    ['secu', 'Securite', 'Pare-feu, VPN, Cloud', '🔒', 5],
    ['script', 'Scripting', 'Bash, PowerShell', '⚡', 4]
  ];
  for (var i = 0; i < mods.length; i++) {
    var m = mods[i];
    var ms = PROGRESS[m[0]] || [];
    var mtotal = (CHECKS[m[0]] || []).length;
    var mpct = mtotal > 0 ? Math.round(ms.length / mtotal * 100) : 0;
    h += '<div class="card" style="cursor:pointer;padding:.7rem;border-left:3px solid ' + (i===0?'var(--accent)':i===1?'var(--purple)':i===2?'var(--green)':i===3?'var(--orange)':i===4?'var(--red)':'var(--pink)') + '" onclick="navig(\'' + m[0] + '\')">';
    h += '<div style="font-size:1.5rem">' + m[3] + '</div>';
    h += '<h3 style="margin:.1rem 0;font-size:.85rem">' + m[1] + '</h3>';
    h += '<p style="font-size:.72rem">' + m[2] + '</p>';
    h += '<div class="progress" style="height:3px;margin-top:.3rem"><div class="progress-fill" style="width:' + mpct + '%"></div></div>';
    h += '</div>';
  }
  h += '</div>';

  h += '<h2>Checklist de base</h2>';
  h += '<p style="font-size:.75rem;margin-bottom:.3rem">Coche ce que tu maitrises deja</p>';
  h += checklistHTML('home');
  h += '</div>';
  return h;
}

function pageOSI() {
  var h = '<div class="page">';
  h += '<h1>Modele OSI</h1>';
  h += '<p>Le modele OSI (Open Systems Interconnection) divise la communication en <strong>7 couches</strong>. Chaque couche a un role precis et ne parle que a la couche voisine.</p>';

  h += '<h2>Les 7 couches</h2>';
  for (var i = OSI.length - 1; i >= 0; i--) {
    var l = OSI[i];
    h += '<div class="layer ' + l[3] + '"><span class="num">' + l[0] + '</span><span class="name">' + l[1] + '</span><span style="font-size:.68rem;opacity:.7">' + l[2] + '</span></div>';
  }

  h += '<div class="card" style="font-size:.78rem;border-left:3px solid var(--accent)">';
  h += '<strong>Mnemotechnique :</strong> "Please Do Not Throw Sausage Pizza Away"<br>';
  h += '<span style="font-size:.7rem;color:var(--text2)">Physique, Donnee (Liaison), Reseau, Transport, Session, Presentation, Application</span>';
  h += '</div>';

  h += '<h2>Encapsulation</h2>';
  h += '<p style="font-size:.8rem">Quand un ordinateur envoie des donnees, chaque couche <strong>ajoute son entete</strong>. A la reception, on retire chaque entete dans l ordre inverse.</p>';

  h += '<div class="card" style="font-family:monospace;font-size:.72rem;line-height:1.8">';
  h += '<span style="color:#fca5a5">C7: Donnees</span><br>';
  h += '<span style="color:#67e8f9">C4: Entete TCP + Donnees</span><br>';
  h += '<span style="color:#c4b5fd">C3: Entete IP + Entete TCP + Donnees</span><br>';
  h += '<span style="color:#a5b4fc">C2: Entete MAC + IP + TCP + Donnees + FCS </span><br>';
  h += '<span style="color:#d8b4fe">C1: Bits sur le cable</span>';
  h += '</div>';

  h += '<h2>TCP vs UDP</h2>';
  h += '<div class="grid2">';
  h += '<div class="card" style="border-left:3px solid var(--green)"><strong style="color:var(--green)">TCP</strong><br><span style="font-size:.75rem;color:var(--text2)">Fiable, lent, verifie la reception. Web, email, FTP.</span></div>';
  h += '<div class="card" style="border-left:3px solid var(--orange)"><strong style="color:var(--orange)">UDP</strong><br><span style="font-size:.75rem;color:var(--text2)">Rapide, pas de verification. Streaming, VoIP, jeux.</span></div>';
  h += '</div>';

  h += '<h2>Checklist OSI</h2>' + checklistHTML('osi');
  h += '</div>';
  return h;
}

function pageReseau() {
  var h = '<div class="page">';
  h += '<h1>Reseaux & IP</h1>';

  h += '<h2>Structure d une adresse IPv4</h2>';
  h += '<div class="ip-viz">';
  h += '<span class="net">192</span>.<span class="net">168</span>.<span class="net">1</span>.<span class="host">10</span><br>';
  h += '<span class="dim">Partie RESEAU</span>  <span class="host">Partie MACHINE</span>';
  h += '</div>';

  h += '<h2>Classes IPv4</h2>';
  h += '<div class="card" style="font-size:.8rem;line-height:2">';
  h += '<strong style="color:var(--accent)">Classe A</strong> : 1.0.0.0 a 126.255.255.255 — 16M hotes <span class="tag tag-blue">/8</span><br>';
  h += '<strong style="color:var(--accent)">Classe B</strong> : 128.0.0.0 a 191.255.255.255 — 65 534 hotes <span class="tag tag-blue">/16</span><br>';
  h += '<strong style="color:var(--accent)">Classe C</strong> : 192.0.0.0 a 223.255.255.255 — 254 hotes <span class="tag tag-blue">/24</span>';
  h += '</div>';

  h += '<h2>Equipements reseau</h2>';
  h += '<div style="font-size:.78rem;line-height:1.8">';
  for (var i = 0; i < EQUIP.length; i++) {
    h += '<div class="card" style="padding:.5rem .7rem">';
    h += '<strong style="color:var(--text)">' + EQUIP[i][0] + '</strong> <span class="tag tag-blue">' + EQUIP[i][1] + '</span><br>';
    h += '<span style="font-size:.72rem;color:var(--text2)">' + EQUIP[i][2] + '</span>';
    h += '</div>';
  }
  h += '</div>';

  h += '<h2>VLAN & Routage & NAT</h2>';
  h += '<div class="card"><strong style="color:var(--accent)">VLAN</strong><br><span style="font-size:.78rem;color:var(--text2)">Decouper un switch en plusieurs petits reseaux virtuels isoles. Communication inter-VLAN necessite un routeur.</span></div>';
  h += '<div class="grid2">';
  h += '<div class="card" style="border-left:3px solid var(--accent);font-size:.78rem"><strong style="color:var(--accent)">Routage statique</strong><br><span style="color:var(--text2)">Chemins ecrits a la main. Simple, ne s adapte pas.</span></div>';

var PAGES = {
  home: pageHome,
  osi: pageOSI,
  reseau: pageReseau,
  linux: pageLinux,
  win: pageWin,
  secu: pageSecu,
  script: pageScript
};

var currentTab = 'home';

function navig(page) {
  currentTab = page;
  try { localStorage.setItem('tsrs_tab', page); } catch(e) {}
  render();
}

function render() {
  var app = document.getElementById('app');
  var fn = PAGES[currentTab];
  if (!fn) fn = PAGES.home;
  app.innerHTML = fn();

  var tabs = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].dataset.tab === currentTab) {
      tabs[i].className = 'tab-btn active';
    } else {
      tabs[i].className = 'tab-btn';
    }
  }

  var bar = document.getElementById('tab-bar');
  if (bar) bar.style.display = 'flex';
  window.scrollTo(0, 0);
}

// ============================================================
// START
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  try {
    loadProgress();
    try {
      var saved = localStorage.getItem('tsrs_tab');
      if (saved && PAGES[saved]) currentTab = saved;
    } catch(e) {}
    render();
  } catch(e) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<div style="padding:2rem;color:#ef4444;font-size:.85rem;font-family:monospace">Erreur: ' + e.message + '<br><br>' + (e.stack || '') + '</div>';
    }
  }
});

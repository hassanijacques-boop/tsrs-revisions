<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TSRS — Révisions Interactives</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;
  --bg2:#11151c;
  --card:rgba(255,255,255,.035);
  --card-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07);
  --text:#e2e8f0;
  --text2:#8892a4;
  --accent:#06b6d4;
  --accent2:#0891b2;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#ef4444;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 90px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700;margin:1.5rem 0 .75rem;color:var(--accent)}
h3{font-size:1rem;font-weight:600;margin:1rem 0 .5rem;color:#f1f5f9}
p,li{font-size:.9rem;color:var(--text2);line-height:1.8}
a{color:var(--accent);text-decoration:none}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:.75rem}
.card:hover{background:var(--card-hover)}

/* Gradient accent */
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Nav tabs */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(11,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;overflow-x:auto;padding:.35rem 0 env(safe-area-inset-bottom,.35rem);
  gap:2px;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:.5rem .3rem;border:none;background:transparent;color:var(--text2);
  font-size:.6rem;cursor:pointer;transition:all .2s;border-radius:8px;
  font-weight:500;white-space:nowrap;
}
.tab-btn svg{width:20px;height:20px;opacity:.6;transition:opacity .2s}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.08)}
.tab-btn.active svg{opacity:1}
.tab-btn:hover{color:var(--text)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.6rem 1.2rem;border-radius:10px;border:none;
  font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(6,182,212,.35)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--card)}

/* Progress bar */
.progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:.75rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .5s ease}

/* Tags */
.tag{display:inline-block;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}
.tag-blue{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-green{background:rgba(16,185,129,.12);color:var(--green)}
.tag-orange{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red)}

/* Accordion */
details.card summary{cursor:pointer;font-weight:600;font-size:.95rem;color:var(--text);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:'▼';font-size:.7rem;color:var(--text2);transition:transform .3s}
details.card[open] summary::after{transform:rotate(180deg)}
details.card .content{padding-top:.75rem;border-top:1px solid var(--border);margin-top:.75rem}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* Checkbox list */
.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem 0;font-size:.85rem;color:var(--text2);cursor:pointer}
.check-list li input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}

/* SVG illustrations */
.illo{display:block;margin:.75rem auto;max-width:100%;overflow:visible}
.illo text{font-family:system-ui,sans-serif}

/* Layers diagram */
.layers{display:flex;flex-direction:column;gap:3px;margin:.75rem 0}
.layer{display:flex;align-items:center;padding:.4rem .8rem;border-radius:6px;font-size:.75rem;font-weight:600;gap:.5rem}
.layer .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.layer .name{width:90px;flex-shrink:0}
.layer .example{opacity:.7;font-weight:400;font-size:.7rem}
.l7{background:rgba(239,68,68,.12);color:#fca5a5}.l7 .num{background:rgba(239,68,68,.3)}
.l6{background:rgba(249,115,22,.12);color:#fdba74}.l6 .num{background:rgba(249,115,22,.3)}
.l5{background:rgba(234,179,8,.12);color:#fde047}.l5 .num{background:rgba(234,179,8,.3)}
.l4{background:rgba(34,197,94,.12);color:#86efac}.l4 .num{background:rgba(34,197,94,.3)}
.l3{background:rgba(6,182,212,.12);color:#67e8f9}.l3 .num{background:rgba(6,182,212,.3)}
.l2{background:rgba(99,102,241,.12);color:#a5b4fc}.l2 .num{background:rgba(99,102,241,.3)}
.l1{background:rgba(168,85,247,.12);color:#d8b4fe}.l1 .num{background:rgba(168,85,247,.3)}

/* IP calculator visual */
.ip-visual{font-family:monospace;font-size:.75rem;background:rgba(0,0,0,.3);border-radius:8px;padding:.75rem;overflow-x:auto;white-space:pre}
.ip-visual .hl{color:var(--accent);font-weight:700}
.ip-visual .hl2{color:var(--green)}
.ip-visual .dim{opacity:.5}

/* Tooltip cards */
.tip{background:rgba(6,182,212,.05);border-left:3px solid var(--accent);padding:.6rem .8rem;border-radius:0 8px 8px 0;font-size:.8rem;margin:.5rem 0;color:var(--text2)}
.tip strong{color:var(--accent)}

/* Equipment table */
.eq-table{width:100%;border-collapse:collapse;font-size:.8rem;margin:.5rem 0}
.eq-table th{text-align:left;padding:.4rem .6rem;background:rgba(255,255,255,.04);color:var(--text);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.eq-table td{padding:.4rem .6rem;border-bottom:1px solid var(--border);color:var(--text2)}

/* Home hero */
.hero{text-align:center;padding:2rem 0 1.5rem}
.hero h1{font-size:2rem}
.hero p{font-size:.95rem;max-width:500px;margin:.5rem auto 1rem}
.hero-badge{display:inline-flex;gap:.4rem;align-items:center;background:rgba(6,182,212,.1);color:var(--accent);padding:.2rem .8rem;border-radius:20px;font-size:.75rem;font-weight:600;margin-bottom:.75rem}

/* Module cards */
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mod-card:hover{background:var(--card-hover);transform:translateY(-2px)}
.mod-card .icon{font-size:1.8rem;margin-bottom:.3rem}
.mod-card h3{font-size:.9rem;margin:0 0 .2rem;color:var(--text)}
.mod-card p{font-size:.75rem;margin:0;color:var(--text2)}
.mod-card .count{font-size:.7rem;color:var(--accent);font-weight:600;margin-top:.3rem}

/* Command grid */
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
@media(max-width:480px){.cmd-grid{grid-template-columns:1fr}}
.cmd-item{background:rgba(0,0,0,.3);border-radius:6px;padding:.4rem .6rem;font-family:monospace;font-size:.78rem}
.cmd-item .c{color:var(--green)}
.cmd-item .d{color:var(--text2);font-size:.7rem;font-family:system-ui,sans-serif;margin-top:.15rem}

/* Section nav */
.sec-nav{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0;margin-bottom:.75rem;scrollbar-width:none}
.sec-nav::-webkit-scrollbar{display:none}
.sec-btn{padding:.3rem .75rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.75rem;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.sec-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sec-btn:hover:not(.active){background:var(--card)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease}

/* Celebration */
.celebration{text-align:center;padding:1.5rem 0}
.celebration .big{font-size:3rem;margin-bottom:.5rem}
.celebration h2{color:var(--green);margin:0}

/* Study timer */
.timer-bar{display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--text2);margin:.5rem 0}
.timer-bar .bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .3s}

/* Search */
.search-box{width:100%;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.85rem;outline:none;transition:border .2s;margin-bottom:.5rem}
.search-box:focus{border-color:var(--accent)}

/* Empty state */
.empty-state{text-align:center;padding:2rem;color:var(--text2);font-size:.85rem}

/* Modal overlay for diagrams */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeUp .2s ease}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
.modal-content h3{margin-top:0}

/* Progress dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.5rem;margin:.75rem 0}
.stat-card{text-align:center;padding:.75rem .5rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.stat-card .val{font-size:1.5rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.7rem;color:var(--text2);margin-top:.15rem}

/* Topic details */
.topic-grid{display:grid;grid-template-columns:1fr;gap:.5rem}

/* Mobile adjustments */
@media(max-width:480px){
  #app{padding:.75rem .75rem 80px}
  .hero h1{font-size:1.5rem}
  .hero{padding:1.25rem 0 1rem}
  .layers .layer{font-size:.7rem;padding:.3rem .6rem}
  .layer .name{width:70px;font-size:.68rem}
}

/* Dark scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Subnet visual */
.subnet-v{display:flex;gap:2px;margin:.5rem 0;overflow-x:auto;padding:.25rem 0}
.subnet-v .oct{font-family:monospace;font-size:.7rem;padding:.25rem .35rem;border-radius:4px;text-align:center;min-width:40px}
.subnet-v .net{background:rgba(6,182,212,.2);color:var(--accent)}
.subnet-v .host{background:rgba(16,185,129,.2);color:var(--green)}
.subnet-v .mask{background:rgba(139,92,246,.2);color:var(--purple);border:1px dashed rgba(139,92,246,.3)}

/* Code block */
.code-block{background:#000;border:1px solid var(--border);border-radius:8px;padding:.75rem;font-family:monospace;font-size:.78rem;overflow-x:auto;margin:.5rem 0;color:var(--green);line-height:1.6}
.code-block .cm{color:#6b7280;font-style:italic}
.code-block .kw{color:var(--accent)}
.code-block .str{color:var(--orange)}
.code-block .var{color:var(--purple)}
</style>
</head>

</nav>

<script>
// ============================================================
// STATE MANAGEMENT
// ============================================================
const SS=window.sessionStorage
function LS(k,v){
  if(v===undefined){
    var r=localStorage.getItem('tsrs_'+k)
    try{return JSON.parse(r)}catch(e){return r}
  }
  if(v===null){localStorage.removeItem('tsrs_'+k);return}
  localStorage.setItem('tsrs_'+k,JSON.stringify(v))
}

var state={
  tab: LS('tab') || 'home',
  user: LS('user') || '',
  checklists: LS('checklists') || {},
  studyTime: LS('studyTime') || 0,
  lastDate: LS('lastDate') || '',
  streak: LS('streak') || 0
}

function save(){for(var k in state){if(k==='tab')continue;LS(k,state[k])}}

// ============================================================
// DATA
// ============================================================
var MODULES=[
  {id:'osi',icon:'📡',title:'Modèle OSI',desc:'Les 7 couches, encapsulation, communication',count:6,color:'#06b6d4'},

  {id:'scripting',icon:'⚡',title:'Scripting',desc:'Bash & PowerShell, automatisation',count:5,color:'#ec4899'},
]

var OSI_LAYERS=[
  {num:7,name:'Application',example:'HTTP, FTP, SMTP, DNS',color:'#ef4444',desc:'Logiciels et services que tu utilises directement. Navigateur web, client email, transfert de fichiers.'},
  {num:6,name:'Présentation',example:'SSL/TLS, JPEG, MPEG',color:'#f97316',desc:'Traduction, chiffrement et compression des données. Transforme les données pour qu\'elles soient compréhensibles par la couche Application.'},

]

var IP_CLASSES=[
  {cls:'A',debut:'0',debutIP:'1.0.0.0',finIP:'126.255.255.255',masque:'255.0.0.0 (/8)',nb:'126 réseaux',hotes:'16 777 214'},

var EQUIPEMENTS=[

var LINUX_CMDS=[
  {cmd:'ls',desc:'Lister les fichiers du dossier courant'},
  {cmd:'cd <dossier>',desc:'Aller dans un dossier'},

function getProgress(){
  var total=0,done=0
  for(var k in CHECKLIST_ITEMS){
    var items=CHECKLIST_ITEMS[k]
    var saved=state.checklists[k]||[]
    for(var i=0;i<items.length;i++){
      total++
      if(saved.indexOf(i)>=0) done++
    }
  }
  return {total,done,pct:total>0?Math.round(done/total*100):0}
}

function toggleCheck(section,idx){
  if(!state.checklists[section]) state.checklists[section]=[]
  var arr=state.checklists[section]
  var pos=arr.indexOf(idx)
  if(pos>=0) arr.splice(pos,1)
  else arr.push(idx)
  save()
  render()
}

function addStudyTime(mins){
  state.studyTime=(state.studyTime||0)+mins
  var today=new Date().toISOString().split('T')[0]
  if(state.lastDate!==today){
    // Check if yesterday
    var yesterday=new Date()
    yesterday.setDate(yesterday.getDate()-1)
    var yStr=yesterday.toISOString().split('T')[0]
    if(state.lastDate===yStr||!state.lastDate){
      state.streak=(state.streak||0)+1
    }else{
      state.streak=1
    }
    state.lastDate=today
  }
  save()
  render()
}

function resetAll(){
  if(!confirm('Réinitialiser toute la progression ?')) return
  state.checklists={}
  state.studyTime=0
  state.lastDate=''
  state.streak=0
  save()
  render()
}

  var app=document.getElementById('app')
  var fn=PAGES[state.tab]
  if(!fn) fn=PAGES.home
  app.innerHTML=fn()

  // Update active tab
  var tabs=document.querySelectorAll('.tab-btn')
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('active',tabs[i].dataset.tab===state.tab)
  }

  // Show tab bar
  document.getElementById('tab-bar').style.display='flex'

  // Scroll to top
  window.scrollTo(0,0)
}

// ============================================================
// INIT
// ============================================================
render()
</script>
</body>
</html>

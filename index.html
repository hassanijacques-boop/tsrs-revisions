<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS — Les 5 Blocs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--bg2:#11151c;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--pink:#ec4899;--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 85px}
h1{font-size:1.3rem;font-weight:800}
h2{font-size:.95rem;font-weight:700;margin:1.1rem 0 .35rem;color:var(--accent)}
h3{font-size:.85rem;font-weight:600;margin:.5rem 0 .2rem;color:#f1f5f9}
p,li{font-size:.78rem;color:var(--text2);line-height:1.65}
p b,li b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;margin-bottom:.45rem}
.gradient{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:.2rem 0 env(safe-area-inset-bottom,.2rem);overflow-x:auto;gap:1px}
.tab-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.3rem .1rem;border:none;background:transparent;color:var(--text2);font-size:.48rem;cursor:pointer;border-radius:5px;font-weight:500;white-space:nowrap}
.tab-btn svg{width:15px;height:15px;opacity:.6}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.08)}
.tab-btn.active svg{opacity:1}
.box{padding:.35rem .55rem;border-radius:6px;margin:.25rem 0;font-size:.75rem}
.box-info{background:rgba(6,182,212,.05);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.05);border-left:3px solid var(--green)}
.box-orange{background:rgba(245,158,11,.05);border-left:3px solid var(--orange)}
.box-blue{background:rgba(99,102,241,.05);border-left:3px solid #6366f1}
.box-red{background:rgba(239,68,68,.05);border-left:3px solid var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:.3rem;margin:.35rem 0}
.stat-card{text-align:center;padding:.35rem;background:var(--card);border-radius:8px;border:1px solid var(--border)}
.stat-card .val{font-size:1.1rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:.55rem;color:var(--text2);margin-top:.1rem}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:.3rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px}
.check-list{list-style:none;padding:0}
.check-list li{display:flex;align-items:flex-start;gap:.35rem;padding:.18rem 0;font-size:.73rem;color:var(--text2);cursor:pointer}
.check-list li input{margin-top:2px;accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0}
.check-list li.done{text-decoration:line-through;opacity:.5}
.liv{border:1px dashed var(--orange);background:rgba(245,158,11,.025);border-radius:8px;padding:.45rem .6rem;margin:.25rem 0;font-size:.73rem}
.liv strong{color:var(--orange)}
.eval{border:1px dashed var(--green);background:rgba(16,185,129,.025);border-radius:8px;padding:.45rem .6rem;margin:.25rem 0;font-size:.73rem}
.eval strong{color:var(--green)}
.tag{display:inline-block;padding:.1rem .35rem;border-radius:4px;font-size:.55rem;font-weight:600}
.tag-b{background:rgba(6,182,212,.12);color:var(--accent)}
.tag-g{background:rgba(16,185,129,.12);color:var(--green)}
.tag-o{background:rgba(245,158,11,.12);color:var(--orange)}
.tag-r{background:rgba(239,68,68,.12);color:var(--red)}
.tag-p{background:rgba(139,92,246,.12);color:var(--purple)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .25s ease}
</style>
</head>
<body>
<noscript><div style="padding:2rem;text-align:center;color:#ef4444">JavaScript est desactive. Active-le.</div></noscript>
<div id="app"><div style="text-align:center;padding:3rem 1rem;color:var(--text2)"><div style="font-size:2rem;margin-bottom:.5rem">📡</div><div>Chargement...</div></div></div>
<nav class="tab-bar" id="tab-bar" style="display:none">
<button class="tab-btn active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"/></svg><span>Accueil</span></button>
<button class="tab-btn" data-tab="b1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Bloc1</span></button>
<button class="tab-btn" data-tab="b2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg><span>Bloc2</span></button>
<button class="tab-btn" data-tab="b3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><span>Bloc3</span></button>
<button class="tab-btn" data-tab="b4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Bloc4</span></button>
<button class="tab-btn" data-tab="b5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>Bloc5</span></button>
<button class="tab-btn" data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Progres</span></button>
</nav>
<script>
// ====== DATA ======
var C={};
C.home=["Je connais le modele OSI (7 couches)","Je connais la difference TCP/UDP","J ai installe VMware et une VM Linux"];
C.b1=["Tester materiel avant deploiement","Installer postes/serveurs/imprimantes","Installer un OS (image systeme, WDS)","Deployer un reseau filaire/WiFi","Configurer switchs et routeurs","Installer logiciels (Office, messagerie)","Utiliser TeamViewer/prise en main distance"];
C.b2=["Creer et migrer serveurs physiques/virtuels","Gerer comptes utilisateurs dans AD","Configurer acces donnees multi-sites","Gerer messagerie Exchange/365","Creer scripts d automatisation","Configurer sauvegardes serveur","Brasser baies reseaux","Configurer routage","Gerer DHCP, DNS, NFS, Samba"];
C.b3=["Connaitre le modele CIA","Planifier sauvegardes/restaurations","Securiser acces donnees","Pratiquer veille vulnerabilites","Appliquer correctifs et mises a jour","Installer et configurer antivirus/EDR","Configurer pare-feu","Securiser acces WiFi","Segmenter le reseau (VLAN, DMZ)","Configurer un VPN"];
C.b4=["Controler conformite materiel recu","Tenir inventaire du parc","Faire entretien preventif des postes","Reconditionner equipements","Qualifier reparabilite","Reparer ou recycler","Pratiquer veille technologique","Rediger analyses comparatives","Appliquer methode 4R"];
C.b5=["Diagnostiquer incident N1/N2","Respecter SLA et delais","Gerer conflits utilisateurs","Rediger fiches intervention","Prioriser incidents","Alimenter base de connaissances","Escalader incidents non resolus","Participer reunions equipe","Faire compte rendu activite","Former utilisateurs","Sensibiliser cybersecurite","Diffuser charte informatique"];

var P={};
function lp(){try{var d=localStorage.getItem("p");if(d)P=JSON.parse(d)}catch(e){}}
function sp(){try{localStorage.setItem("p",JSON.stringify(P))}catch(e){}}

function tg(s,i){
  if(!P[s])P[s]=[];
  var a=P[s],p=a.indexOf(i);
  p>=0?a.splice(p,1):a.push(i);
  sp();r();
}

function ch(s){
  var it=C[s],sv=P[s]||[],h='<ul class="check-list">',d;
  for(var i=0;i<it.length;i++){d=sv.indexOf(i)>=0;h+='<li class="'+(d?"done":"")+'" onclick="tg(''+s+'','+i+')"><input type="checkbox"'+(d?" checked":"")+"> "+it[i]+"</li>"}
  return h+"</ul>";
}

function st(){
  var t=0,d=0;
  for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++}}
  return {d:d,t:t,p:t>0?Math.round(d/t*100):0};
}

// ====== PAGES ======
function pgHome(){
  var s=st(),h='<div class="page">';
  h+='<div style="text-align:center;padding:1rem 0 .5rem">';
  h+='<span style="display:inline-block;background:rgba(6,182,212,.1);color:var(--accent);padding:.2rem .6rem;border-radius:20px;font-size:.6rem;font-weight:600;margin-bottom:.35rem">BAC+2 RNCP Niveau 5</span>';
  h+='<h1>TSRS <span class="gradient">Revisions</span></h1>';
  h+='<p style="font-size:.78rem">Technicien Systemes Reseaux et Securite — Les 5 blocs officiels</p></div>';
  h+='<div class="card" style="text-align:center;padding:.4rem;margin-bottom:.5rem">';
  h+='<div style="display:flex;justify-content:center;gap:1rem;font-size:.75rem">';
  h+='<div><b style="color:var(--accent);font-size:.95rem">'+s.d+'</b><br><span style="font-size:.6rem;color:var(--text2)">Acquis</span></div>';
  h+='<div><b style="color:var(--text);font-size:.95rem">'+s.t+'</b><br><span style="font-size:.6rem;color:var(--text2)">Notions</span></div>';
  h+='<div><b style="color:var(--green);font-size:.95rem">'+s.p+'%</b><br><span style="font-size:.6rem;color:var(--text2)">Maitrise</span></div></div>';
  h+='<div class="progress"><div class="progress-fill" style="width:'+s.p+'%"></div></div></div>';
  h+='<div class="card" style="font-size:.75rem;border-left:3px solid var(--accent);padding:.5rem .7rem">';
  h+='<b>Le diplome TSRS</b> (BAC+2, RNCP Niveau 5) comporte 5 blocs. Chaque bloc peut etre valide separement. Les 5 sont obligatoires pour le diplome. Dossier de validation: 60 pages mini + oral 20 min devant un jury.</div>';

  var bl=[["b1","Deployer materiaux, systemes et reseau","1️⃣","var(--accent)"],["b2","Administrer serveurs et reseau multi-sites","2️⃣","var(--green)"],["b3","Securiser l environnement numerique","3️⃣","var(--red)"],["b4","Entretenir le parc informatique","4️⃣","var(--orange)"],["b5","Assurer le support technique","5️⃣","var(--purple)"]];
  for(var i=0;i<bl.length;i++){
    var ms=P[bl[i][0]]||[],mt=(C[bl[i][0]]||[]).length,mp=mt>0?Math.round(ms.length/mt*100):0;
    h+='<div class="card" style="cursor:pointer;padding:.45rem .6rem;border-left:3px solid '+bl[i][3]+'" onclick="nav(''+bl[i][0]+'')">';
    h+='<div style="display:flex;align-items:center;gap:.35rem"><div style="font-size:1.2rem">'+bl[i][2]+'</div>';
    h+='<div style="flex:1"><b style="font-size:.78rem">'+bl[i][1]+'</b></div></div>';
    if(mt>0)h+='<div class="progress" style="height:2px;margin-top:.2rem"><div class="progress-fill" style="width:'+mp+'%"></div></div>';
    h+="</div>";
  }

  h+='<div class="box box-info"><b>Rappel :</b> Le modele OSI a 7 couches. TCP est fiable (verification). UDP est rapide (streaming). Les equipements cles : switch (interieur), routeur (exterieur), pare-feu (protection).</div>';
  h+="<h2>Checklist</h2>"+ch("home")+"</div>";
  return h;
}

function pgB1(){
  var h='<div class="page">';
  h+='<h1>Bloc 1 — Deploiement</h1>';
  h+='<p><b>1.1 Materiel :</b> Tester les equipements avant deploiement, installer postes/serveurs (physiques + virtuels), imprimantes reseau, telephones IP, materiel audiovisuel.</p>';
  h+='<p><b>1.2 Systeme :</b> Outils de deploiement automatique (WDS, MDT), creation d image systeme, virtualisation (VMware/Hyper-V), scripts d automatisation.</p>';
  h+='<p><b>1.3 Reseau :</b> Reseau filaire/sans fil, interconnection switchs/routeurs, parametrage IP/VLAN, simulation Packet Tracer, bornes WiFi (SSID, WPA2/3).</p>';
  h+='<p><b>1.4 Logiciel :</b> Suite bureautique (Office), messagerie (Exchange/Outlook), collaboration (Teams, SharePoint), bureau virtuel (VDI, RDS), prise en main distance (TeamViewer, AnyDesk).</p>';
  h+=liv(["Procedures d installation","Plan de deploiement","Plan de recette","Scripts d automatisation","Rapport images systemes","Tables de routage","Topologie du SI","Fiches interventions"],
    ["Tests effectues et reussis","Delais respectes","Materiel adapte aux besoins","Serveurs integres dans annuaire","OS installes et a jour","Scripts operationnels","Interconnexion de qualite"]);
  h+="<h2>Checklist</h2>"+ch("b1")+"</div>";
  return h;
}

function pgB2(){
  var h='<div class="page">';
  h+='<h1>Bloc 2 — Administration</h1>';
  h+='<p><b>2.1 Serveurs :</b> Creation et migration serveurs physiques/virtuels. Prise en compte de l interoperabilite Windows/Linux. Plan de migration.</p>';
  h+='<p><b>2.2 Production :</b> Gestion des comptes dans AD, configuration acces multi-sites (NFS, Samba), messagerie (Exchange/365), scripts automatisation (Bash, PowerShell), sauvegardes et restauration.</p>';
  h+='<p><b>2.3 Reseau multi-sites :</b> Brassage baies, administration switchs/routeurs, parametrage routage (OSPF, statique).</p>';
  h+=liv(["Procedure installation","Plan migration","Topologie SI","Politique sauvegarde","Scripts automatisation","Journaux alertes","Tables routage","Plan adressage"],
    ["Communication serveurs operationnelle","Niveau de service respecte","Correctifs appliques","Scripts operationnels","Alertes remontees","Liens reseaux fonctionnels","Bande passante respectee"]);
  h+="<h2>Checklist</h2>"+ch("b2")+"</div>";
  return h;
}

function pgB3(){
  var h='<div class="page">';
  h+='<h1>Bloc 3 — Securite</h1>';
  h+='<p><b>Modele CIA :</b> Confidentialite, Integrite, Disponibilite — les 3 piliers.</p>';
  h+='<p><b>3.1 Politique :</b> Sauvegardes (plan de reprise PRA), securisation acces site/distant/cloud, haute disponibilite et redondance.</p>';
  h+='<p><b>3.2 Correctifs :</b> Veille vulnerabilites (CERT, ANSSI), identification equipements a mettre a jour, gestion des patchs.</p>';
  h+='<p><b>3.3 Logiciels securite :</b> Antivirus/EDR, pare-feu, IDS/IPS, securisation acces physique et sans-fil, segmentation VLAN/DMZ, tests securite. Chiffrement nomades, VPN, MFA.</p>';
  h+=liv(["Plan sauvegarde/restauration","Politique securite","Plan veille vulnerabilites","Journaux mises a jour","Plan segmentation reseau","Procedures securite","Rapports surveillance"],
    ["Donnees sauvegardees fiables","Redondance controlee","Patchs installes et operationnels","Sondes parametrees","Equipements nomades chiffres","Acces controles par MFA","Acces reseaux publics limite"]);
  h+="<h2>Checklist</h2>"+ch("b3")+"</div>";
  return h;
}

function pgB4(){
  var h='<div class="page">';
  h+='<h1>Bloc 4 — Entretien</h1>';
  h+='<p><b>4.1 Reception :</b> Controle conformite (quantite, modele, etat), enregistrement entrees/sorties, mise a jour inventaire (GLPI).</p>';
  h+='<p><b>4.2 Preventif :</b> Entretien postes (nettoyage, MAJ), serveur de mises a jour (WSUS), reconditionnement, Green IT.</p>';
  h+='<p><b>4.3 Curatif :</b> Qualification reparabilite, reparation, recyclage. <b>Methode 4R</b> : Reduire, Reparer, Reemployer, Recycler.</p>';
  h+='<p><b>4.4 Ameliorations :</b> Veille technologique, redaction comparatifs, proposition de solutions, alerte technologique.</p>';
  h+=liv(["Inventaire stock","Documents suivi","Bon livraison","Inventaire materiel/logiciel","Plan migration","Ordre reparations","Stats suivi","Plan veille","Analyse comparative"],
    ["Commande conforme","Stock mis a jour","Serveur MAJ fonctionnel","Durabilite augmentee","Cycle de vie allonge","Taux reconditionnes augmente","Alerte technologique diffusee"]);
  h+="<h2>Checklist</h2>"+ch("b4")+"</div>";
  return h;
}

function pgB5(){
  var h='<div class="page">';
  h+='<h1>Bloc 5 — Support</h1>';
  h+='<p><b>5.1 Diagnostic N1/N2 :</b> Identifier la cause, intervenir sur site ou a distance, resoudre et rediger rapport. Respecter les SLA (delais d intervention). </p>';
  h+='<p><b>5.2 Gestion incidents :</b> Prioriser par criticite, consulter/alimenter la base de connaissances, escalader si necessaire.</p>';
  h+='<p><b>5.3 Reunions :</b> Bilan resolution incidents, compte rendu activite, communication problemes relationnels.</p>';
  h+='<p><b>5.4 Formation :</b> Former utilisateurs, communiquer incidents majeurs, sensibiliser cybersecurite, diffuser charte informatique, protection donnees (RGPD), eco-responsabilite.</p>';
  h+=liv(["Fiches interventions","Contrat service (SLA)","Historique interventions","Base connaissances","Plan suivi incidents","CR activite","Rapport incidents","Charte informatique"],
    ["SLA respectes","Satisfaction > 80%","90% incidents clotures dans les temps","Base connaissances a jour","Communication de confiance","CR clairement redige","Charte diffusee","Utilisateurs formes"]);
  h+='<div class="box box-blue"><b>Important :</b> Le support est souvent le premier contact avec l entreprise. Ecouter, reformuler, faire preuve d empathie et de pedagogie est aussi important que les competences techniques.</div>';
  h+="<h2>Checklist</h2>"+ch("b5")+"</div>";
  return h;
}

function pgProg(){
  var s=st(),h='<div class="page">';
  h+='<h1>Progression</h1>';
  h+='<div class="stat-grid">';
  h+='<div class="stat-card"><div class="val">'+s.d+'</div><div class="lbl">Acquis</div></div>';
  h+='<div class="stat-card"><div class="val">'+s.t+'</div><div class="lbl">Total</div></div>';
  h+='<div class="stat-card"><div class="val" style="color:var(--green)">'+s.p+'%</div><div class="lbl">Maitrise</div></div>';
  h+='</div><div class="progress" style="height:5px"><div class="progress-fill" style="width:'+s.p+'%"></div></div>';

  var ss=[["b1","Deploiement","1️⃣"],["b2","Administration","2️⃣"],["b3","Securite","3️⃣"],["b4","Entretien","4️⃣"],["b5","Support","5️⃣"]];
  for(var i=0;i<ss.length;i++){
    var it=C[ss[i][0]]||[],sv=P[ss[i][0]]||[],pct=it.length>0?Math.round(sv.length/it.length*100):0;
    h+='<div class="card" style="padding:.4rem .6rem">';
    h+='<div style="display:flex;align-items:center;gap:.35rem"><div style="font-size:1.1rem">'+ss[i][2]+'</div>';
    h+='<div style="flex:1"><b style="font-size:.78rem">'+ss[i][1]+'</b>';
    h+='<div class="progress" style="height:3px;margin:.15rem 0"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    h+='<span style="font-size:.55rem;color:var(--text2)">'+sv.length+"/"+it.length+" maitrises</span></div>";
    h+='<button class="tb" style="padding:.2rem .4rem;font-size:.6rem;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer" onclick="nav(''+ss[i][0]+'')">Voir</button>';
    h+="</div></div>";
  }

  h+='<h2>Dossier de validation</h2>';
  h+='<div class="card" style="font-size:.72rem">60 pages minimum. Portefeuille de preuves (captures, scripts, procedures). Presentation orale 20 min devant jury. Chaque bloc valide separement. Les 5 sont obligatoires pour le diplome.</div>';
  h+='<div style="margin-top:.3rem"><button class="tb" style="padding:.25rem .6rem;font-size:.68rem;border-radius:5px" onclick="if(confirm('Reinitialiser ?')){P={};sp();r()}">Reinitialiser</button></div>';
  h+="</div>";
  return h;
}

function liv(items,crit){
  var h='<div class="liv"><strong>Livrables :</strong><ul>';
  for(var i=0;i<items.length;i++)h+="<li>"+items[i]+"</li>";
  h+="</ul></div><div class=\'eval\'><strong>Criteres :</strong><ul>";
  for(var i=0;i<crit.length;i++)h+="<li>"+crit[i]+"</li>";
  return h+"</ul></div>";
}

// ====== ROUTER ======
var PG={home:pgHome,b1:pgB1,b2:pgB2,b3:pgB3,b4:pgB4,b5:pgB5,prog:pgProg};
var ct="home";

function nav(p){ct=p;try{localStorage.setItem("t",p)}catch(e){}r()}

function r(){
  var a=document.getElementById("app"),fn=PG[ct];
  if(!fn)fn=PG.home;
  a.innerHTML=fn();
  var tb=document.querySelectorAll(".tab-btn");
  for(var i=0;i<tb.length;i++)tb[i].className="tab-btn"+(tb[i].dataset.tab===ct?" active":"");
  var ba=document.getElementById("tab-bar");if(ba)ba.style.display="flex";window.scrollTo(0,0);
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSRS Programme</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--card:#11151c;--border:rgba(255,255,255,.07);--text:#e2e8f0;--text2:#8892a4;--accent:#06b6d4;--green:#10b981;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
#app{max-width:860px;margin:0 auto;padding:.8rem .8rem 80px}
h1{font-size:1.25rem;font-weight:800}
h2{font-size:.9rem;font-weight:700;margin:.8rem 0 .3rem;color:var(--accent)}
p,li{font-size:.76rem;color:var(--text2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem;margin-bottom:.4rem}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,12,16,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding:.2rem 0}
.tab-btn{flex-shrink:0;padding:.3rem .5rem;border:none;background:transparent;color:var(--text2);font-size:.55rem;cursor:pointer;border-radius:6px;white-space:nowrap}
.tab-btn.active{color:var(--accent);background:rgba(6,182,212,.1)}
.box{padding:.35rem .5rem;border-radius:6px;margin:.25rem 0;font-size:.74rem}
.box-info{background:rgba(6,182,212,.05);border-left:3px solid var(--accent)}
.box-green{background:rgba(16,185,129,.05);border-left:3px solid var(--green)}
.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:.25rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green))}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:3rem">Chargement...</div></div>
<nav class="tab-bar" id="tab-bar">
<button class="tab-btn active" data-tab="home" onclick="go(this)">Accueil</button>
<button class="tab-btn" data-tab="m1" onclick="go(this)">M1 OSI</button>
<button class="tab-btn" data-tab="m2" onclick="go(this)">M2 IP</button>
<button class="tab-btn" data-tab="m3" onclick="go(this)">M3 Win</button>
<button class="tab-btn" data-tab="m4" onclick="go(this)">M4 Linux</button>
<button class="tab-btn" data-tab="prog" onclick="go(this)">Progres</button>
</nav>
<script>
var C={};
C.home=["Test 1","Test 2","Test 3"];
C.m1=["7 couches OSI","Encapsulation","TCP vs UDP"];
C.m2=["Binaire","Adressage IPv4","Classes A B C"];
C.m3=["VMware","Cmd","PowerShell"];
C.m4=["Commandes","Permissions","Pipes"];
C.prog=["Suivi","Checklist"];

var P={};
function lp(){try{var d=localStorage.getItem("p");if(d)P=JSON.parse(d)}catch(e){}}
function sp(){try{localStorage.setItem("p",JSON.stringify(P))}catch(e){}}
function tg(s,i){if(!P[s])P[s]=[];var a=P[s],p=a.indexOf(i);p>=0?a.splice(p,1):a.push(i);sp();render();}
function cl(s){var it=C[s],sv=P[s]||[],h="<ul>";for(var i=0;i<it.length;i++){var d=sv.indexOf(i)>=0;h+='<li onclick="tg(\\"'+s+'\\",'+i+')" style="cursor:pointer;padding:3px 0;font-size:.75rem;color:var(--text2);'+(d?"text-decoration:line-through;opacity:.5":"")+'">'+(d?"✓":"○")+" "+it[i]+"</li>";}return h+"</ul>";}
function st(){var t=0,d=0;for(var k in C){var it=C[k],sv=P[k]||[];for(var i=0;i<it.length;i++){t++;if(sv.indexOf(i)>=0)d++;}}return{d:d,t:t,p:t>0?Math.round(d/t*100):0};}

function home(){var s=st();return"<h1>TSRS Revisions</h1><p>Les modules du programme.</p><div class=progress><div class=progress-fill style=width:"+s.p+"%></div></div><p>"+s.d+"/"+s.t+" ("+s.p+"%)</p>"+cl("home");}
function m1(){return"<h1>M1 Modele OSI</h1><p>7 couches : Application, Presentation, Session, Transport, Reseau, Liaison, Physique.</p>"+cl("m1");}
function m2(){return"<h1>M2 IPv4</h1><p>Adresse IP = 4 nombres (0-255). Masque = separe reseau/machine.</p>"+cl("m2");}
function m3(){return"<h1>M3 Windows</h1><p>VMware = logiciel pour machines virtuelles. Cmd = commandes. PowerShell = evolution.</p>"+cl("m3");}
function m4(){return"<h1>M4 Linux</h1><p>Commandes: ls, cd, cp, mv, rm. Permissions: rwx. Pipes: |.</p>"+cl("m4");}
function prog(){var s=st();return"<h1>Progression</h1><p>"+s.d+"/"+s.t+" ("+s.p+"%)</p><div class=progress><div class=progress-fill style=width:"+s.p+"%></div></div>"+cl("prog");}

var PG={home:home,m1:m1,m2:m2,m3:m3,m4:m4,prog:prog};
var ct="home";

function go(el){ct=el.dataset.tab;render();}
function render(){
  var a=document.getElementById("app"),fn=PG[ct];if(!fn)fn=PG.home;
  a.innerHTML=fn();
  var tb=document.querySelectorAll(".tab-btn");
  for(var i=0;i<tb.length;i++){tb[i].className="tab-btn"+(tb[i].dataset.tab===ct?" active":"");}
}
lp();
try{var t=localStorage.getItem("t");if(t&&PG[t])ct=t;}catch(e){}
render();
</script>
</body>
</html>

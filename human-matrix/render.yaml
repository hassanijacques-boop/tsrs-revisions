services:
  - type: web
    name: human-matrix-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: human_matrix
      - key: STRIPE_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
